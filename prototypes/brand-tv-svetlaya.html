<meta charset="utf-8">
<title>Табло турнира · брендирование · тёмно-салатовая схема</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@600;700;800&display=swap">
<style>
:root{--bg:#0b0b0b;--stripe:#101010;--card:#161616;--line:#2a2a2a;--ink:#ffffff;--muted:#a3a8a3;--dim:#666c66;
 --brand:#b8dc1e;--brand-ink:#0b0f02;--display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:repeating-linear-gradient(180deg,var(--bg) 0 54px,var(--stripe) 54px 108px);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:26px;padding:24px 44px 18px;background:var(--brand);color:var(--brand-ink)}
.cat{background:rgba(11,15,2,.1);border:1px solid rgba(11,15,2,.35);border-radius:8px;padding:11px 20px;font-family:var(--display);font-weight:800;font-style:italic;font-size:28px}
.ttl b{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:36px;text-transform:uppercase;line-height:1.02}
.ttl span{display:block;font-size:19px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.78;margin-top:4px}
.right{margin-left:auto;align-self:stretch;display:flex;align-items:center;gap:32px}
.spon{align-self:stretch;display:flex}
.wordmark{align-self:stretch;margin:-24px 0 -18px;display:flex;align-items:center;gap:16px;background:var(--bg);color:#fff;padding:0 32px 0 26px;font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.mark{width:44px;height:44px;border-radius:50%;flex:none;background:linear-gradient(90deg,var(--bg) 0 48%,#fff 48% 52%,var(--brand) 52%);border:2px solid #fff}
.live{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.1em}
.live i{width:13px;height:13px;border-radius:50%;background:var(--brand-ink);animation:b 1.6s infinite}
@keyframes b{0%,100%{opacity:1}50%{opacity:.35}}

.board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px 44px}
.hdr,.row{display:grid;grid-template-columns:1fr repeat(3,116px) 150px 190px;gap:14px}
.hdr{padding:0 30px 2px}
.hdr span{font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.hdr span:first-child{text-align:left}
.row{flex:1;max-height:210px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 30px}
.row.srv{border-color:var(--brand);box-shadow:inset 6px 0 0 var(--brand);background:linear-gradient(90deg,rgba(184,220,30,.1),var(--card) 42%)}
.team{display:flex;align-items:center;gap:20px;min-width:0}
.dot{width:24px;height:24px;border-radius:50%;background:#2c2c2c;flex:none}
.row.srv .dot{background:var(--brand);box-shadow:0 0 0 6px rgba(184,220,30,.18)}
.nm{font-family:var(--display);font-weight:800;font-style:italic;font-size:52px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05}
.sd{font-family:var(--display);font-weight:800;font-size:54px;text-align:center;font-variant-numeric:tabular-nums;color:var(--dim)}
.sd.won{color:var(--ink)}
.sd.cur{color:var(--brand)}
.gm{font-family:var(--display);font-weight:800;font-size:64px;text-align:center;font-variant-numeric:tabular-nums}
.pt{font-family:var(--display);font-weight:900;font-size:96px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.row.srv .pt{color:var(--brand)}

.foot{display:flex;align-items:center;gap:20px;padding:16px 44px;border-top:1px solid var(--line);background:var(--bg)}
.foot .lb{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.foot .nx{font-size:22px;font-weight:700}
.partners{margin-left:auto;display:flex;align-items:center;gap:14px}
.partners .p{height:38px;min-width:96px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:0 12px}
.partners .lg{font-family:var(--display);font-weight:800;font-style:italic;font-size:19px;letter-spacing:.04em;color:var(--ink)}
.partners .lg em{font-style:italic;color:var(--brand)}
</style>

<div class="top">
  <span class="cat">ФПР 250</span>
  <span class="ttl"><b>Региональный турнир</b><span>1/8 финала · Корт 1</span></span>
  <span class="right">
    <span class="spon"><span class="wordmark"><i class="mark"></i><span>Светлая сторона</span></span></span>
    <span class="live"><i></i>LIVE</span>
  </span>
</div>

<div class="board">
  <div class="hdr"><span>Пара</span><span>Сет 1</span><span>Сет 2</span><span>Сет 3</span><span>Геймы</span><span>Очки</span></div>
  <div class="row srv">
    <span class="team"><span class="dot"></span><span class="nm">Кутузова / Чиркова</span></span>
    <span class="sd won">6</span><span class="sd">4</span><span class="sd cur">5</span><span class="gm">5</span><span class="pt">40</span>
  </div>
  <div class="row">
    <span class="team"><span class="dot"></span><span class="nm">Петрова / Мехтиева</span></span>
    <span class="sd">3</span><span class="sd won">6</span><span class="sd cur">5</span><span class="gm">5</span><span class="pt">30</span>
  </div>
</div>

<div class="foot">
  <span class="lb">Следующий матч</span>
  <span class="nx">1/8 финала · <b>Виленкин / Смит</b> — <b>Горбунов / Бородин</b></span>
  <span class="partners"><span class="p">партнёр</span><span class="p">партнёр</span><span class="p">клуб</span><span class="lg">PADEL.<em>SELECT</em></span></span>
</div>
