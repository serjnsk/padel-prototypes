<title>Виджет счёта в трансляции</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@600;700;800&display=swap">
<style>
:root{--lime:#7ee81f;--lime-ink:#08190a;--display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{margin:0;overflow:hidden;font-family:var(--sans);background:#05090a}
.frame{position:relative;width:100vw;height:100vh;overflow:hidden;background:#0b1a16}
.court{position:absolute;inset:0}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%)}
.tag{position:absolute;right:26px;bottom:22px;color:rgba(255,255,255,.5);font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* widget */
.w{position:absolute;left:38px;top:34px;width:520px;border-radius:12px;overflow:hidden;background:rgba(8,16,18,.9);backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.09)}
.wh{display:flex;align-items:center;gap:12px;padding:11px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.07)}
.wh .cat{background:var(--lime);color:var(--lime-ink);border-radius:5px;padding:4px 10px;font-family:var(--display);font-weight:800;font-style:italic;font-size:15px}
.wh .t{font-size:14px;font-weight:700;color:#dbe6e8;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;letter-spacing:.1em;color:#fff}
.wh .live i{width:9px;height:9px;border-radius:50%;background:#ff4d4d;animation:b 1.6s infinite}
@keyframes b{0%,100%{opacity:1}50%{opacity:.3}}
.wr{display:grid;grid-template-columns:1fr repeat(3,42px) 54px;align-items:center;gap:0;padding:12px 16px;color:#fff}
.wr+.wr{border-top:1px solid rgba(255,255,255,.07)}
.wr.srv{background:linear-gradient(90deg,rgba(126,232,31,.14),transparent 55%)}
.wr .team{display:flex;align-items:center;gap:11px;min-width:0}
.wr .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.22);flex:none}
.wr.srv .dot{background:var(--lime);box-shadow:0 0 0 3px rgba(126,232,31,.22)}
.wr .nm{font-family:var(--display);font-weight:800;font-style:italic;font-size:23px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.wr .s{font-family:var(--display);font-weight:800;font-size:23px;text-align:center;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.55)}
.wr .s.won{color:#fff}
.wr .s.cur{color:var(--lime)}
.wr .p{font-family:var(--display);font-weight:900;font-size:30px;text-align:center;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);border-radius:7px;padding:3px 0;margin-left:8px}
.wr.srv .p{background:var(--lime);color:var(--lime-ink)}
.wf{display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.07);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.wf .lg{margin-left:auto;font-family:var(--display);font-weight:800;font-style:italic;font-size:13px;letter-spacing:.04em;color:#fff}
.wf .lg em{font-style:italic;color:var(--lime)}
</style>

<div class="frame">
  <svg class="court" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132b26"/><stop offset="1" stop-color="#0a1714"/></linearGradient>
      <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4a5e"/><stop offset="1" stop-color="#153a4a"/></linearGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#sky)"/>
    <polygon points="250,1080 1670,1080 1330,392 590,392" fill="url(#fl)"/>
    <polygon points="250,1080 1670,1080 1330,392 590,392" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="4"/>
    <line x1="420" y1="736" x2="1500" y2="736" stroke="rgba(255,255,255,.5)" stroke-width="5"/>
    <line x1="960" y1="736" x2="960" y2="392" stroke="rgba(255,255,255,.22)" stroke-width="4"/>
    <line x1="505" y1="908" x2="1415" y2="908" stroke="rgba(255,255,255,.16)" stroke-width="3"/>
    <rect x="420" y="640" width="1080" height="96" fill="rgba(255,255,255,.09)"/>
    <line x1="420" y1="640" x2="1500" y2="640" stroke="rgba(255,255,255,.62)" stroke-width="5"/>
    <polygon points="590,392 1330,392 1330,196 590,196" fill="rgba(120,190,210,.07)" stroke="rgba(255,255,255,.16)" stroke-width="3"/>
    <circle cx="806" cy="828" r="26" fill="rgba(10,20,18,.75)"/><circle cx="838" cy="812" r="22" fill="rgba(10,20,18,.6)"/>
    <circle cx="1150" cy="612" r="20" fill="rgba(10,20,18,.7)"/><circle cx="1186" cy="600" r="17" fill="rgba(10,20,18,.55)"/>
    <circle cx="1000" cy="700" r="9" fill="#dfe63a"/>
  </svg>
  <div class="vig"></div>
  <span class="tag">кадр трансляции</span>

  <div class="w">
    <div class="wh"><span class="cat">ФПР 250</span><span class="t">Региональный турнир · 1/8 финала · Корт 1</span><span class="live"><i></i>LIVE</span></div>
    <div class="wr srv">
      <span class="team"><span class="dot"></span><span class="nm">Кутузова / Чиркова</span></span>
      <span class="s won">6</span><span class="s">4</span><span class="s cur">5</span><span class="p">40</span>
    </div>
    <div class="wr">
      <span class="team"><span class="dot"></span><span class="nm">Петрова / Мехтиева</span></span>
      <span class="s">3</span><span class="s won">6</span><span class="s cur">5</span><span class="p">30</span>
    </div>
    <div class="wf"><span>Решающий сет · 54:24</span><span class="lg">PADEL.<em>СЕЛЕКТ</em></span></div>
  </div>
</div>
