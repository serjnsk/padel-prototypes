<title>Виджет счёта в трансляции</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@600;700;800&display=swap">
<style>
:root{--lime:#7ee81f;--lime-ink:#08190a;--display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{margin:0;overflow:hidden;font-family:var(--sans);background:#05090a}
/* кадр 1920×1080 вписывается в окно целиком, виджет масштабируется вместе с ним */
.frame{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--k,1));background:#0b1a16 center/cover no-repeat}

/* widget: ширина по самой длинной паре 420–600 px, дальше имена уменьшаются (скрипт внизу) */
.w{position:absolute;left:88px;top:56px;min-width:420px;max-width:600px}
.bug{display:flex;border-radius:8px;overflow:hidden;background:rgba(8,16,18,.9);backdrop-filter:blur(8px);box-shadow:0 12px 36px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.09)}
.spon{flex:none;display:grid;place-items:center;padding:0 14px;background:#fff;color:#e11b22;font-family:var(--display);font-weight:900;font-style:italic;font-size:19px;letter-spacing:.02em}
.main{flex:1 1 auto;min-width:0}
.st{height:24px;display:flex;align-items:center;padding:0 12px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap}
.r{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,30px) 50px;align-items:center;height:36px;color:#fff}
.r+.r{border-top:1px solid rgba(255,255,255,.08)}
.team{display:flex;align-items:center;gap:8px;min-width:0;padding:0 12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--lime);box-shadow:0 0 0 3px rgba(126,232,31,.22);visibility:hidden}
.srv .dot{visibility:visible}
.nm{font-family:var(--display);font-weight:800;font-style:italic;font-size:20px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.s{font-family:var(--display);font-weight:800;font-size:20px;text-align:center;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.5)}
.s.won{color:#fff}
.s.cur{color:var(--lime)}
.p{align-self:stretch;display:grid;place-items:center;margin-left:6px;background:rgba(255,255,255,.13);font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.p:empty{background:none}
.tabs{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:5px}
.ev{height:22px;display:flex;align-items:center;padding:0 10px;border-radius:5px;background:#fff;color:#0b1414;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.ev.star{background:var(--lime);color:var(--lime-ink)}
.ev[hidden]{display:none}
.st .lg{margin-left:auto;padding-left:12px}

        <div class="st"><span>1/8 финала · Корт 1</span><span class="lg">PADEL.SELECT</span></div>
        <div class="r srv">
          <span class="team"><i class="dot"></i><span class="nm">Загрядский / Семьянинов</span></span>
          <span class="s won">6</span><span class="s">4</span><span class="s cur">5</span><span class="p">40</span>
        </div>
        <div class="r">
          <span class="team"><i class="dot"></i><span class="nm">Курмаев / Татарников</span></span>
          <span class="s">3</span><span class="s won">6</span><span class="s cur">5</span><span class="p">40</span>

    <div class="tabs"><span class="ev" hidden></span></div>
  </div>
</div>
<script>
const frame=document.querySelector('.frame');
const fit=()=>frame.style.setProperty('--k',Math.min(innerWidth/1920,innerHeight/1080));
fit();addEventListener('resize',fit);
document.fonts.ready.then(()=>{
  const nm=[...document.querySelectorAll('.nm')];
  const k=Math.min(1,...nm.map(n=>n.clientWidth/n.scrollWidth));
  if(k<1)nm.forEach(n=>n.style.fontSize=Math.max(15,Math.floor(20*k))+'px');
});
// Star Point: 40:40 → AD1 → 40:40 → AD2 → 40:40 → решающий розыгрыш. Шаги идут по кругу, ?s=1…5 фиксирует шаг
const steps=[
  {p:['40','40']},
  {p:['AD1','']},
  {p:['40','40']},
  {p:['','AD2'],ev:'Break point'},
  {p:['40','40'],ev:'★ Star point',star:true},
];
const pts=[...document.querySelectorAll('.p')],ev=document.querySelector('.ev');
const show=i=>{const s=steps[i];pts.forEach((c,j)=>c.textContent=s.p[j]);ev.textContent=s.ev||'';ev.hidden=!s.ev;ev.classList.toggle('star',!!s.star)};
const fixed=+new URLSearchParams(location.search).get('s');
if(fixed>=1&&fixed<=steps.length)show(fixed-1);
else{let i=0;show(i);setInterval(()=>show(i=(i+1)%steps.length),2500)}
</script>
