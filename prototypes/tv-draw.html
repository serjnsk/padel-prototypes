<title>Региональный турнир · ТВ-табло жеребьёвки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@600;700;800&display=swap">
<style>
:root{--bg:#0b1412;--stripe:#0e1a18;--panel:#0a1210;--line:#1e3a2a;--ink:#fff;--lime:#5ee619;--lime-ink:#08210a;--display:"Inter Tight","Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:repeating-linear-gradient(180deg,var(--bg) 0 44px,var(--stripe) 44px 88px);color:var(--ink);font-family:var(--display);display:flex;flex-direction:column;overflow:hidden}
.tvhead{display:flex;align-items:center;gap:22px;padding:22px 34px}
.cat{background:var(--lime);color:var(--lime-ink);border-radius:6px;padding:12px 20px;font-weight:800;font-style:italic;font-size:26px;letter-spacing:.02em}
.ttl b{display:block;font-weight:800;font-style:italic;font-size:32px;text-transform:uppercase;line-height:1.05;letter-spacing:-.01em}
.ttl span{display:block;font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-top:4px}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:.08em}
.live i{width:13px;height:13px;border-radius:50%;background:#ff4d4d;display:inline-block;animation:b 1.6s infinite}
@keyframes b{0%,100%{opacity:1}50%{opacity:.35}}
.br{flex:1;display:grid;grid-template-columns:70px 900px;justify-content:center;align-content:center;gap:6px 18px;padding:0 34px 30px}
.sl{display:contents}
.n{grid-column:1;font-weight:800;font-size:26px;color:var(--lime);text-align:right;align-self:center;font-style:italic}
.row{grid-column:2;position:relative;border:1px solid var(--line);border-radius:3px;height:44px;display:flex;align-items:center;padding:0 18px;font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;letter-spacing:.01em;color:transparent}
.row.f{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.gap{grid-column:1/3;height:14px}
.row.t::after,.row.b::after{content:"";position:absolute;left:100%;width:26px;border:2px solid var(--line);border-left:0}
.row.t::after{top:50%;bottom:-27px;border-bottom:0;border-radius:0 4px 0 0}
.row.b::after{top:-27px;bottom:50%;border-top:0;border-radius:0 0 4px 0}
</style>

<div class="tvhead">
  <span class="cat">ФПР 250</span>
  <span class="ttl"><b>Региональный турнир</b><span>Основной турнир · Жеребьёвка</span></span>
  <span class="live"><i></i>LIVE</span>
</div>
<div class="br">
<span class="n">1</span><span class="row t f">ФИЛИЧЕВ И. | ДЕНИСОВ И.</span><span class="n">2</span><span class="row b f">БОНДАРЕНКО Р. | ЕЛИСЕЕВ Н.</span><span class="gap"></span><span class="n">3</span><span class="row t f">ПАРЫГИН М. | НИКИТИН А.</span><span class="n">4</span><span class="row b ">&nbsp;</span><span class="gap"></span><span class="n">5</span><span class="row t ">&nbsp;</span><span class="n">6</span><span class="row b ">&nbsp;</span><span class="gap"></span><span class="n">7</span><span class="row t ">&nbsp;</span><span class="n">8</span><span class="row b ">&nbsp;</span><span class="gap"></span><span class="n">9</span><span class="row t ">&nbsp;</span><span class="n">10</span><span class="row b ">&nbsp;</span><span class="gap"></span><span class="n">11</span><span class="row t ">&nbsp;</span><span class="n">12</span><span class="row b ">&nbsp;</span><span class="gap"></span><span class="n">13</span><span class="row t ">&nbsp;</span><span class="n">14</span><span class="row b ">&nbsp;</span><span class="gap"></span><span class="n">15</span><span class="row t ">&nbsp;</span><span class="n">16</span><span class="row b ">&nbsp;</span>
</div>
