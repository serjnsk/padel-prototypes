<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТВ-режим · таблицы, сетки, расписание, призёры</title>
<link rel="icon" href="../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;0,900;1,800;1,900&family=Inter:wght@500;600;700;800&family=Roboto+Condensed:wght@500;600;700&display=swap">
<style>
/* ТВ-режим турнира и лиги (padel.select/t/<code>/tv) по аудиту ТВ1–ТВ18 (specs/05_tv_board.md).
   Холст 1920×1080 масштабируется целиком, как табло у корта. Кегль слайда подбирается по месту:
   от 28px (меньше — слайд делится) до 48px. Лига и турнир идут одной логикой: дивизион лиги = группа турнира. */
:root{--bg:#0c1719;--surface:#11242a;--surface-2:#173037;--line:#22383d;--line-2:#31494e;
 --ink:#fff;--muted:#8fa3a5;--dim:#5e7174;--lime:#82eb00;--lime-ink:#0b1b06;--glow:rgba(130,235,0,.09);--deep:rgba(38,92,101,.32);--red:#ff6b5e;
 --display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;--cond:"Roboto Condensed","Arial Narrow",sans-serif}
/* палитра турнира black-lime — как у брендированных экранов «Светлой стороны» */
:root[data-palette="black-lime"]{--bg:#0d0f0e;--surface:#171a19;--surface-2:#1e2221;--line:#2a2f2d;--line-2:#3a403e;
 --muted:#9aa19e;--dim:#646b68;--lime:#b8dc1e;--lime-ink:#141700;--glow:rgba(184,220,30,.07);--deep:rgba(60,64,62,.3)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050909;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}

/* строка управления прототипом — вне холста, на телевизоре её нет (?kiosk=1) */
.ctl{position:fixed;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#101414;border-bottom:1px solid #222a2a;font-size:13px;color:#b7c2c2;z-index:5;white-space:nowrap;overflow-x:auto}
.ctl label{display:flex;align-items:center;gap:6px}
.ctl select,.ctl button{font:inherit;font-size:13px;color:#e8eeee;background:#1a2121;border:1px solid #2c3636;border-radius:6px;height:30px;padding:0 8px;cursor:pointer}
.ctl .sp{flex:1}
.ctl b{color:#fff;font-weight:700;min-width:44px;text-align:center}
.kiosk .ctl{display:none}
.view{position:fixed;left:0;right:0;bottom:0;top:48px}
.kiosk .view{top:0}

.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k,1));
 display:flex;flex-direction:column;padding:26px 56px 22px;overflow:hidden;
 background:radial-gradient(900px 520px at 100% 0,var(--glow),transparent 70%),radial-gradient(1100px 700px at 0 100%,var(--deep),transparent 70%),
  repeating-linear-gradient(-66deg,transparent 0 46px,rgba(255,255,255,.02) 46px 54px),var(--bg)}

/* ---------- шапка (ТВ6): категория · название · статус, часы и дата ---------- */
.top{flex:none;height:80px;display:flex;align-items:center;gap:26px}
.cat{flex:none;background:var(--lime);color:var(--lime-ink);border-radius:8px;padding:12px 20px;font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:1;text-transform:uppercase;white-space:nowrap}
.ttl{flex:1;min-width:0;font-family:var(--display);font-weight:900;font-style:italic;font-size:52px;line-height:1;text-transform:uppercase;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.ttl span{display:inline-block}
.tr-r{flex:none;display:flex;align-items:center;gap:22px}
.stc{display:flex;align-items:center;gap:12px;border-radius:8px;padding:12px 18px;font-weight:800;font-size:24px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.stc.live{background:var(--lime);color:var(--lime-ink)}
.stc.live i{width:14px;height:14px;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}
.stc.fin,.stc.soon{border:2px solid var(--line-2);color:var(--muted)}
@keyframes blink{50%{opacity:.25}}
.clk{text-align:right;line-height:1}
.clk b{display:block;font-family:var(--display);font-weight:800;font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clk span{display:block;margin-top:6px;font-size:21px;font-weight:700;color:var(--muted)}
.badge{flex:none;display:flex;align-items:center;height:72px;padding:8px 18px;background:#fff;border-radius:10px}
.badge img{height:52px;width:auto;display:block}

/* ---------- тело слайда: полоса-заголовок (ТВ2) и область содержимого ---------- */
.body{position:relative;flex:1;margin:18px 0 14px}
.strip{position:absolute;left:0;right:0;top:0;height:56px;display:none;align-items:center;justify-content:center;background:var(--lime);color:var(--lime-ink);border-radius:8px;
 font-weight:800;font-size:26px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ws .strip{display:flex}
.box{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden}
.ws #main,#meas.ws{top:72px}
#meas{visibility:hidden;pointer-events:none}
.cnt{font-size:var(--fs,28px);height:100%}

/* ---------- подвал (ТВ8): подписи слайдов с полосой времени, партнёры, PADEL.SELECT ---------- */
.foot{flex:none;height:62px;display:flex;align-items:flex-start;gap:30px}
.segs{flex:1;min-width:0;display:flex;gap:18px}
.seg{flex:var(--g,1) 1 0;min-width:110px;max-height:62px;overflow:hidden;cursor:pointer;color:var(--dim);font-size:20px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.seg .bar{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:9px;overflow:hidden}
.seg .bar i{display:block;height:100%;width:0;background:var(--lime)}
.seg.on{color:var(--ink)}
.seg.on .bar i{animation:prog var(--dur,15s) linear forwards}
.paused .seg.on .bar i{animation:none;width:100%}
@keyframes prog{to{width:100%}}
.prt{flex:none;display:flex;gap:14px}
.prt span{display:flex;align-items:center;height:52px;padding:6px 14px;background:#fff;border-radius:8px}
.prt img{height:36px;width:auto;display:block}
.ps{flex:none;align-self:center;font-size:30px;padding-left:28px;border-left:2px solid var(--line)}
/* Логотип «Табло»: мяч вместо точки, SELECT на наклонной плашке в акценте скина; правило — assets/tokens.css */
.ps{font-family:var(--display);font-style:italic;font-weight:900;letter-spacing:.02em;white-space:nowrap;text-decoration:none;--logo-plate:var(--lime);--logo-on:var(--lime-ink);--logo-dot:var(--lime)}
.ps .b{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--logo-dot,currentColor);margin:0 .12em 0 .08em;overflow:hidden;text-indent:1em}
.ps em{display:inline-block;position:relative;z-index:0;font-style:italic;color:var(--logo-on);padding:.11em .3em .09em .25em;line-height:1}
.ps em::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--logo-plate);transform:skewX(-12deg);border-radius:.08em}

/* ---------- имена (ТВ5): «Фамилия Имя» полностью, игрок на строке, флаг; длинные ужимаются ---------- */
.nm{display:flex;align-items:center;gap:.34em;min-width:0;white-space:nowrap;overflow:hidden;font-family:var(--cond);font-weight:600;line-height:1.1;letter-spacing:.005em}
.nm .t{flex:none}
.fl{flex:none;width:1.05em;height:.72em;border-radius:3px;background:linear-gradient(#fff 0 33.4%,#1c57a5 33.4% 66.7%,#d52b1e 66.7%) center/cover;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.fl.no{visibility:hidden}
.src{color:var(--muted);font-style:italic;font-weight:500}
.lab{font-size:max(20px,.64em);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

/* ---------- таблица (ТВ9–ТВ11): одна для групп турнира и дивизионов лиги ---------- */
.tbls{display:grid;gap:22px 34px;height:100%;align-content:center;align-items:start}
.tbls.n1{grid-template-columns:minmax(0,1180px);justify-content:center}
.tbls.n2,.tbls.n4{grid-template-columns:1fr 1fr}
.tb{--cn:1.45em;--cw:2.1em;--gw:3.9em;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.th,.tr{display:grid;grid-template-columns:var(--cn) minmax(0,1fr) var(--cw) var(--cw) var(--cw) var(--gw);align-items:center;padding:0 .55em 0 .3em}
.th{min-height:1.9em;background:var(--surface-2)}
.th.lime{background:var(--lime);color:var(--lime-ink)}
.th .tt{grid-column:1/3;padding-left:.25em;font-weight:800;font-size:max(22px,.8em);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.th .lab{text-align:center}
.th.lime .lab{color:var(--lime-ink);opacity:.75}
.tr{padding-top:.16em;padding-bottom:.16em;border-top:1px solid var(--line)}
.tr .n{font-weight:700;font-size:.8em;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.tr.q .n{color:var(--lime);font-size:.95em;font-weight:800}
.tr.cut{border-bottom:3px solid var(--lime)}
.tr .v{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:#d9e2e2}
.tr .v.b{font-weight:800;color:var(--ink)}
.tr .g{display:grid;grid-template-columns:1fr auto 1fr;gap:.12em;font-weight:600;font-variant-numeric:tabular-nums;color:#d9e2e2}
.tr .g i{font-style:normal}
.tr .g i:first-child{text-align:right}
.tr .g s{text-decoration:none;color:var(--dim)}
.pn{min-width:0;position:relative}
.tr.wd{opacity:.5}
.tr.wd .t{text-decoration:line-through;text-decoration-thickness:2px}
.tr.wd .pn{padding-right:4.8em}
.tr.wd1{border-top:2px dashed var(--line-2)}
.wdc{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:max(20px,.62em);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}

/* ---------- карточка матча (ТВ12, ТВ14): одна для сеток и расписания ---------- */
.mc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.mc.live{border:3px solid var(--lime)}
.mh{display:flex;align-items:center;gap:.6em;padding:.22em .5em;background:var(--surface-2);border-radius:9px 9px 0 0}
.mh .lab{flex:1;min-width:0;overflow:hidden}
.mh .tm{flex:none;font-family:var(--display);font-weight:800;font-size:.9em;font-variant-numeric:tabular-nums}
.mh .tm i{font-style:normal;font-family:var(--sans);font-weight:700;font-size:max(20px,.66em);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:.35em}
.mh .tm.lt{font-family:var(--sans);font-weight:700;font-size:max(20px,.66em);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lv{display:inline-flex;align-items:center;gap:.35em;background:var(--lime);color:var(--lime-ink);border-radius:6px;padding:.12em .45em;font-weight:800;font-size:max(20px,.62em);letter-spacing:.1em}
.lv i{width:.55em;height:.55em;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.4em;padding:.16em .5em}
.pr+.pr{border-top:1px solid var(--line)}
.pp{min-width:0;min-height:2.2em;display:flex;flex-direction:column;justify-content:center}
.pr.l .nm{color:var(--muted)}
.pr.w .nm{color:var(--ink);font-weight:700}
.ss{display:flex;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.ss span{width:1.35em;text-align:center;color:var(--muted)}
.ss span.up{color:var(--ink)}
.ss span.cur{color:var(--lime)}
.ss span.ns{color:var(--dim);font-weight:600}
.ss sup{font-size:.5em;margin-left:.04em;vertical-align:.9em;line-height:0;color:var(--muted)}
.ss .rs{width:auto;min-width:2.9em;text-align:right;font-family:var(--sans);font-size:max(20px,.6em);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.mc.dim{opacity:.48}
/* идущий матч в сетке — лаймовая полоса LIVE на левом краю карточки: высота карточки та же, счёт не перекрыт */
.mc.lvc{padding-left:1.15em}
.lvs{position:absolute;left:0;top:0;bottom:0;width:1.15em;display:flex;align-items:center;justify-content:center;background:var(--lime);color:var(--lime-ink);border-radius:0 6px 6px 0;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:max(20px,.62em);letter-spacing:.14em}
.dest{padding:.1em .5em .3em;font-size:max(20px,.62em);font-weight:700;color:var(--muted)}
.dest b{color:var(--lime);font-weight:800}

/* ---------- сетка деревом (ТВ13): раунды колонками, линии к следующему матчу ---------- */
.bw{height:100%;display:flex;flex-direction:column;--gap:48px}
.rh{flex:none;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--gap);margin-bottom:10px}
.rh .lab{text-align:center}
.tree{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:var(--gap)}
.tcol{position:relative;display:flex;flex-direction:column;min-height:0}
.slot{flex:1 1 0;min-height:0;display:flex;align-items:center;position:relative;padding:.3em 0}
.slot>.mc{width:100%}
.k-pair .slot::after,.k-straight .slot::after{content:"";position:absolute;right:calc(var(--gap)/-2);width:calc(var(--gap)/2);border:2px solid var(--line-2);border-left:0}
.k-pair .slot:nth-child(odd)::after{top:50%;height:50%;border-bottom:0;border-radius:0 10px 0 0}
.k-pair .slot:nth-child(even)::after{top:0;height:50%;border-top:0;border-radius:0 0 10px 0}
.k-straight .slot::after{top:50%;height:0;border-right:0;border-bottom:0}
.inc .slot::before{content:"";position:absolute;left:calc(var(--gap)/-2);width:calc(var(--gap)/2);top:50%;border-top:2px solid var(--line-2)}
.third{position:absolute;left:0;right:0;bottom:0}
/* сетка на 16 пар целиком на одном экране: формат карточки тот же, кегль меньше, между матчами зазор 10px */
.bw.cmp .pr{padding:.08em .45em}
.bw.cmp .pp{min-height:0}
/* мелкий кегль: узкий жирный Roboto Condensed сплющивается — имена обычной ширины (Inter) и тоньше */
.bw.cmp .nm{font-family:var(--sans);font-weight:500;letter-spacing:0;line-height:1.1}
.bw.cmp .pr.w .nm{font-weight:600}
.bw.cmp .ss{font-weight:700}
.bw.cmp .ss span.ns{font-weight:500}
.bw.cmp .slot{padding:5px 0}
.bw.cmp .mc{border-color:var(--line-2)}
.bw.cmp .pr+.pr{border-top:2px solid var(--line-2)}
.bw.cmp .rh{margin-bottom:4px}
.third .lab{display:block;margin-bottom:.3em}
/* ранний раунд, который не помещается в дерево, — отдельным слайдом карточками */
.rgrid{height:100%;display:grid;grid-auto-flow:column;column-gap:48px;row-gap:16px;align-content:center}

/* ---------- расписание дня (ТВ15–ТВ17): клуб на слайде, корты колонками ---------- */
.sched{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,660px);justify-content:center;column-gap:28px}
/* название корта задаёт организатор («Корт 1 Станционная»): до двух строк, дальше многоточие */
.ch{margin-bottom:14px;padding:.3em .5em;background:var(--surface-2);border-radius:8px;text-align:center;font-family:var(--display);font-weight:800;font-size:max(24px,.86em);letter-spacing:.06em;text-transform:uppercase;line-height:1.15;display:flex;align-items:center;justify-content:center}
.ch span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cl{min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.more{flex:none;text-align:center;padding:.2em 0}


/* ---------- призёры (ТВ18) ---------- */
.wins{height:100%;display:grid;gap:34px;align-content:center}
.wins.n1{grid-template-columns:minmax(0,1180px);justify-content:center}
.wins.n2{grid-template-columns:1fr 1fr}
.wp{display:flex;flex-direction:column;gap:14px;min-width:0}
.wh{padding:.3em .5em;background:var(--lime);color:var(--lime-ink);border-radius:8px;text-align:center;font-weight:800;font-size:max(22px,.8em);letter-spacing:.08em;text-transform:uppercase}
.wr{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:center;gap:.4em;padding:.3em .6em;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wr .pl{font-family:var(--display);font-weight:900;font-style:italic;font-size:1.5em;line-height:1;text-align:center;color:var(--lime)}
.wr.p1{border:3px solid var(--lime)}
.wr.p1 .pl{font-size:2em}
.wr.dt .pl{font-size:1em}
.wr .cap{margin-top:.18em}

/* ---------- главный спонсор ---------- */
.spon{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.spon .chip{background:var(--lime);color:var(--lime-ink);border-radius:8px;padding:12px 22px;font-weight:800;font-size:24px;letter-spacing:.18em;text-transform:uppercase}
.spon .plate{background:#fff;border-radius:16px;padding:44px 70px}
.spon img{display:block;height:440px;max-width:1300px;width:auto;object-fit:contain}
.empty{height:100%;display:grid;place-items:center;font-size:32px;color:var(--muted)}
</style></head>
<body>
<div class="ctl" id="ctl"></div>
<div class="view" id="view">
  <div class="stage" id="stage">
    <header class="top" id="top"></header>
    <div class="body" id="body">
      <div class="strip" id="strip"></div>
      <div class="box" id="main"></div>
      <div class="box" id="meas" aria-hidden="true"></div>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>
</div>
<script>
// Данные — снимки /api/public/<code> (2026-10-27), урезанные до полей, нужных ТВ-режиму:
// лига FREEDOM PADEL LEAGUE (94ddeebe, «сегодня» — 27 октября), турнир с группами и двумя дивизионами (da36e9c5),
// турнир ФПР 500 с квалификацией (4daf356d), турнир УО-2 (295a92ea).
// Турниры по умолчанию показаны идущими — как в демо публичной страницы: последний день, первая половина матчей сыграна,
// следующий идёт (LIVE). Завершённый вид с призёрами — ?finished=1, у лиги призёры считаются по таблице (только демо).
// Параметры: ?t=<code> · ?slide=N (стоп на слайде) · ?venue=N (ТВ стоит в клубе N) · ?today=ГГГГ-ММ-ДД · ?time=ЧЧ:ММ · ?kiosk=1
const Q = new URLSearchParams(location.search);
const ORIGIN = 'https://padel.select';
const SLIDE_SEC = 15, FS_MIN = 28, FS_LOW = 22, FS_MAX = 48, FS_TREE_MIN = 16;
const EVENTS = ['94ddeebe', 'da36e9c5', '4daf356d', '295a92ea'];
let RAW, T, P = {}, V = {}, D = {}, LEAGUE, GROUPED, TOP, START, N_DAYS, TODAY_IDX, FINISHED;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const pl = x => `${x.lastName}${x.firstName ? ' ' + x.firstName : ''}`;
const divShort = d => d.title.replace(/^Дивизион\s+/, '');
const topOf = id => { const d = D[id]; return d && d.parentId ? D[d.parentId] : d || null; };
const dayDate = i => { const d = new Date(START); d.setDate(d.getDate() + i - 1); return d; };
const dayText = i => { const d = dayDate(i); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const isBye = m => m.result && m.result.special === 'bye';
// Название корта задаёт организатор (К1). Не задано, а клубов на слайде несколько — «Корт N Станционная»:
// клуб без общего начала названий всех клубов («Padel Tennis Club …»)

/* ---------- названия раундов и этапов (как на публичной странице, C2) ---------- */
const RL = {r128:'1/64 финала', r64:'1/32 финала', r32:'1/16 финала', r16:'1/8 финала', qf:'1/4 финала', sf:'1/2 финала', final:'Финал', lsf:'1/2 финала', lfinal:'Финал', qo8:'Квалификация · 1-й круг', qo4:'Квалификация · 1-й круг', qo2:'Квалификация · финал'};
function roundName(code, m) {
  code = code.replace(/^d(?=qf|sf|final|r\d)/, '');

const isQual = m => /^qo\d+$/.test(m.round);

// ТВ2: этапы называются как сегменты сайта (R4)
const STAGE_TITLE = k => ({qual: 'Квалификация', group: 'Группы', upper: 'Основная сетка', lower: GROUPED ? 'ДТ' : 'Нижняя сетка'})[k];

  return same.length ? Math.max(...same.map(x => toMin(x.time))) + 1 : 9999;
}
// Подпись источника → раунд: «победитель 1/4 №2», «проигравший 1/8 №3»
function srcName(c) {

  r = c.match(/^qo(\d+)$/); if (r) return 'квал. 1/' + r[1];

/* ---------- данные события ---------- */
function load() {
  RAW = JSON.parse(document.getElementById('data').textContent);
  T = RAW[Q.get('t')] || RAW[EVENTS[0]];
  LEAGUE = T.type === 'championship';
  T.pairs.forEach(p => P[p.id] = p);
  T.venues.forEach(v => V[v.id] = v);
  T.divisions.forEach(d => D[d.id] = d);
  TOP = T.divisions.filter(d => !d.parentId);
  GROUPED = T.divisions.some(d => d.parentId);
  START = new Date(T.dateStart + 'T00:00:00');
  N_DAYS = T.dayLabels.length;
  const today = Q.get('today') ? new Date(Q.get('today') + 'T00:00:00') : LEAGUE ? new Date('2026-10-27T00:00:00') : dayDate(N_DAYS);
  TODAY_IDX = Math.round((today - START) / 864e5) + 1;
  FINISHED = !!Q.get('finished');
  if (LEAGUE) { T.state = FINISHED ? 'finished' : 'live'; if (FINISHED) leaguePodium(); }
  else if (!FINISHED) demoRunning();
  if (T.palette) document.documentElement.dataset.palette = T.palette;
}
// Демо идущего турнира (как на публичной странице): последний день, первая половина матчей сыграна, следующий идёт
// с неполным счётом, остальные впереди. Пары матчей, ждущих несыгранного матча, неизвестны — вместо них подпись источника.
function demoRunning() {
  T.state = 'live';
  const day = T.matches.filter(m => m.day === N_DAYS && !isBye(m)).sort((a, b) => timeKey(a) - timeKey(b) || (a.court || 0) - (b.court || 0));
  const cleared = new Set(day.slice(Math.floor(day.length / 2)));
  [...cleared].forEach((m, i) => {
    const s0 = (m.result && m.result.sets) || [];
    if (i === 0 && s0.length) {
      m.live = true;
      m.liveScore = s0.length > 1 ? [s0[0], {a: Math.min(s0[1].a, 4), b: Math.min(s0[1].b, 3)}] : [{a: Math.min(s0[0].a, 4), b: Math.min(s0[0].b, 3)}];
    }
    m.result = null;
  });
  const queue = [...cleared];
  while (queue.length) {
    const m = queue.shift(), sn = srcName(m.round);
    if (!sn) continue;
    for (const kind of ['победитель', 'проигравший']) {
      const lab = `${kind} ${sn} №${m.number}`;
      T.matches.filter(x => x.divisionId === m.divisionId && (x.sourceLabel1 === lab || x.sourceLabel2 === lab)).forEach(x => {
        if (x.sourceLabel1 === lab) x.pair1 = null;
        if (x.sourceLabel2 === lab) x.pair2 = null;
        if (!cleared.has(x)) { x.result = null; x.live = false; cleared.add(x); queue.push(x); }
      });
    }
  }
  T.podium = [];
}
// Демо завершённой лиги: в API подиум идущей лиги пуст, призёры — первые три пары таблицы каждого дивизиона
function leaguePodium() {
  T.podium = [];
  T.standings.forEach(s => s.rows.filter(r => !r.withdrawn).slice(0, 3).forEach((r, i) => T.podium.push({place: i + 1, pairId: r.pairId, divisionId: s.divisionId})));
}

/* ---------- таблица: группа турнира или дивизион лиги (ТВ9–ТВ11) ---------- */
function rowsOf(divId) { const s = T.standings.find(x => x.divisionId === divId); return s ? s.rows : []; }
function tableHtml(t) {

/* ---------- карточка матча (ТВ12): одна для сеток и расписания ---------- */
const SPECIAL = {retired: 'Отказ', technical: 'Тех. поражение', walkover: 'Неявка'};
const SET_COLS = {};

  if (!(k in SET_COLS)) SET_COLS[k] = Math.max(1, ...T.matches.filter(x => `${x.phase}|${x.branch}` === k).map(x => ((x.result || {}).sets || []).length));

}
function scoreHtml(m, i) {

    if (!x) return '<span class="ns">—</span>';

    return `<span class="${cur ? 'cur' : a > b ? 'up' : ''}">${a}${x.tb != null && a > b && !cur ? `<sup>(${x.tb})</sup>` : ''}</span>`; }).join('')}</div>`;
}
function sideHtml(m, i) {

  const names = P[id] ? pairNames(id) : `<div class="nm src"><span class="t">${esc(isBye(m) ? 'бай' : (i === 1 ? m.sourceLabel1 : m.sourceLabel2) || 'пара определится')}</span></div>`;

// ТВ14: шапка карточки в расписании — «Дивизион · этап | время»
function stageLabel(m) {

  if (top && (LEAGUE || TOP.length > 1)) parts.push(divShort(top));
  const r = m.round.match(/^r(\d+)t(\d+)$/);
  if (LEAGUE) { if (r) { if ((T.championshipRounds || 1) > 1) parts.push(`${r[1]}-й круг`); parts.push(`${r[2]}-й тур`); } }
  else if (m.phase === 'group') { parts.push(D[m.divisionId].title); if (r) parts.push(`${r[2]}-й тур`); }

}

}

/* ---------- сетка (ТВ13) ---------- */
const ORDER_UP = ['r128','r64','r32','r16','qf','sf','final'];
const inDiv = (m, div) => !div || m.divisionId === div;
const stageMatches = (stage, div) => T.matches.filter(m => stageOf(m) === stage && inDiv(m, div));
function bracketRounds(stage, div) {
  const codes = [...new Set(stageMatches(stage, div).filter(m => m.round !== 'third').map(m => m.round))];
  const order = c => { if (/^qo\d+$/.test(c)) return -1000 - parseInt(c.slice(2), 10); const i = ORDER_UP.indexOf(c.replace(/^d(?=qf|sf|final|r\d)/, '')); return i >= 0 ? i : c === 'lsf' ? 90 : c === 'lfinal' ? 99 : parseInt(c.replace(/\D/g, ''), 10); };
  codes.sort((a, b) => order(a) - order(b));
  if (stage === 'qual' && codes.length) codes.push('qout');

}
function roundTitle(c, stage, div) {

  return stage === 'qual' ? n.replace(/^Квалификация · /, '').replace(/^./, ch => ch.toUpperCase()) : stage === 'lower' && GROUPED && n === 'Финал' ? 'Финал ДТ' : n;
}
const roundMatches = (c, stage, div) => stageMatches(stage, div).filter(m => m.round === c).sort((a, b) => a.number - b.number);
// Последний шаг квалификации: победители последнего раунда и их место в основной сетке
function qoutCard(m) {
  const id = m.result ? (m.result.winner === 1 ? m.pair1 : m.pair2) : null, x = nextOf(m, 'победитель');
  const names = P[id] ? pairNames(id) : `<div class="nm src"><span class="t">победитель квал. №${m.number}</span></div>`;
  const dest = x ? `<div class="dest">в основной: <b>${esc(roundName(x.round, x))} · №${x.number}</b></div>` : '';
  return `<article class="mc ${id ? 'done' : 'wait'}"><div class="pr w"><div class="pp">${names}</div></div>${dest}</article>`;
}

/* ---------- расписание дня (ТВ15–ТВ17) ---------- */
const venueOf = m => m.venueId || (T.venues[0] || {}).id || null;
// Подпись клуба в подвале: без общего начала названий («Padel Tennis Club …»), в полосе — полностью
function venueShort(id) {
  const titles = T.venues.map(v => v.title);
  let k = 0;
  if (titles.length > 1) while (titles.every(t => t[k] === titles[0][k])) k++;
  k = titles[0].lastIndexOf(' ', k) + 1;
  return (V[id] ? V[id].title : T.venueName).slice(titles.length > 1 ? k : 0);
}
// ТВ16: день — сегодняшний, если сегодня в этих клубах есть матчи; иначе ближайший день с несыгранными матчами
function schedDay(ids) {
  const ms = T.matches.filter(m => m.day && ids.includes(venueOf(m)) && !isBye(m));
  if (ms.some(m => m.day === TODAY_IDX)) return TODAY_IDX;
  const next = ms.filter(m => m.day > TODAY_IDX && !m.result).map(m => m.day);
  return next.length ? Math.min(...next) : null;
}
function schedSlide(ids) {
  const day = schedDay(ids);
  if (!day) return null;
  const groups = ids.map(vid => {
    const ms = T.matches.filter(m => m.day === day && venueOf(m) === vid && !isBye(m));
    const courts = [...new Set(ms.map(m => m.court || 0))].sort((a, b) => (a || 99) - (b || 99))
      .map(c => ({court: c, ms: ms.filter(m => (m.court || 0) === c).sort((a, b) => timeKey(a) - timeKey(b) || a.number - b.number)}));
    return {vid, title: V[vid] ? V[vid].title : T.venueName, courts};
  }).filter(g => g.courts.length);
  if (!groups.length) return null;
  const courts = groups.flatMap(g => g.courts);
  return {kind: 'sched', groups, courts, cut: courts.map(() => ({before: 0, after: 0})), label: 'Расписание',
    strip: `Расписание · ${day === TODAY_IDX ? 'сегодня, ' : ''}${dayText(day)}${groups.length === 1 ? ' · ' + groups[0].title : ''}`};
}
// ТВ15: все клубы — на одном слайде, над кортами название клуба. Если корты всех клубов не помещаются
// при 28px (по одной карточке в колонке), — по клубу на слайд. ТВ в конкретном клубе — ?venue=N, только он
function schedSlides() {
  const all = T.venues.length ? T.venues.map(v => v.id) : [null];
  const pick = Q.get('venue');
  if (pick && T.venues.length > 1) return [schedSlide([all[(+pick - 1) || 0] || all[0]])].filter(Boolean);
  const merged = schedSlide(all);
  if (!merged || merged.groups.length < 2) return merged ? [merged] : [];
  const probe = {...merged, cut: merged.courts.map(c => ({before: 0, after: Math.max(0, c.ms.length - 1)}))};
  if (fitSlide(probe, true)) return [merged];
  return all.map(vid => schedSlide([vid])).filter(Boolean).map(s => ({...s, label: `Расписание · ${venueShort(s.groups[0].vid)}`}));
}
// ТВ17: идущий — LIVE и счёт, сыгранные сегодня — со счётом, приглушены. ТВ3: что не поместилось — «ещё N»
function schedHtml(sl) {
  const multi = sl.groups.length > 1;
  return `<div class="sched">${sl.groups.flatMap(g => g.courts.map(c => ({g, c}))).map(({g, c}, ci) => {
    const cut = sl.cut[ci], list = c.ms.slice(cut.before, c.ms.length - cut.after);
    return `<h3 class="ch"><span>${c.court ? esc(courtLabel(c.court, g.vid, multi)) : 'Корт не назначен'}</span></h3><div class="cl fitv">
      ${cut.before ? `<div class="more lab">сыграно ещё ${cut.before}</div>` : ''}
      ${list.map(m => cardHtml(m, {head: true, dim: !!m.result})).join('')}
      ${cut.after ? `<div class="more lab">ещё ${cut.after} ${plural(cut.after, ['матч', 'матча', 'матчей'])}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
const plural = (n, w) => { const a = n % 10, b = n % 100; return w[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 1 : 2]; };

/* ---------- призёры (ТВ18) ---------- */

function bracketSlides(stage, div, pre) {

// ТВ5: все имена на слайде — одного кегля, многоточия нет. Если самое длинное имя не помещается в ячейку,
