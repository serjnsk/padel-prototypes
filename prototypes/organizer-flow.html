<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет организатора · единый путь турнира</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#f3f4f6;--border:#e5e7eb;--border-strong:#d1d5db;
  --ink:#111827;--muted:#6b7280;--faint:#9ca3af;
  --accent:#84cc16;--accent-ink:#111827;--accent-soft:#ecfccb;--accent-line:#65a30d;
  --black:#111111;--black-ink:#ffffff;
  --path:#111827;
  --warn:#92400e;--warn-bg:#fef3c7;--err:#b91c1c;--err-bg:#fee2e2;--hint:#1e40af;--hint-bg:#dbeafe;
  --r:8px;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---- shell ---- */
.topbar{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
.logo{font-weight:800;letter-spacing:.06em;font-size:15px}
.logo em{font-style:normal;color:var(--accent-line)}
.pillchip{background:var(--surface-2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.topbar .user i{width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800}
.topbar .out{color:var(--ink);font-weight:500;font-size:13px;background:none;border:0}
.shell{display:grid;grid-template-columns:184px 1fr;min-height:calc(100vh - 50px)}
.sidenav{background:var(--surface);border-right:1px solid var(--border);padding:14px 8px;display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:15px;position:sticky;top:50px;height:calc(100vh - 50px)}
.sidenav a{color:var(--ink);text-decoration:none;padding:9px 10px;border-radius:8px}
.sidenav a:hover{background:var(--surface-2)}
.sidenav a.cur{font-weight:700;background:var(--surface-2)}
.sidenav .reset{margin-top:auto;font-size:12px;color:var(--muted);padding:9px 10px}
.page{padding:20px 24px 60px;min-width:0;max-width:1736px}/* контент кабинета: ширина как на экране 1920 (1920 − меню 184 − отступы), шире не растягивается */
/* ---- page header ---- */
.crumbs{color:var(--muted);font-size:13px;margin-bottom:4px}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
.ph .tt{min-width:0;flex:1}
.ph h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.ph .meta i{font-style:normal;color:var(--faint)}
.ph .act{display:flex;gap:8px;align-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.3;vertical-align:middle}
.pill.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink);opacity:.6}
.pill.done{color:var(--muted)}
.pill.draft{color:var(--muted);border-style:dashed}
/* ---- stage bar (steps of wizard and stages of tournament are one component) ---- */
.steps{display:flex;gap:8px;list-style:none;margin:0 0 14px;padding:0;flex-wrap:wrap;align-items:center}
.steps li,.steps a{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 10px;min-height:36px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--border);text-decoration:none;white-space:nowrap}
.steps b{width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.steps .done{color:var(--ink)}
.steps .done b{background:var(--accent-soft);color:var(--accent-line)}
.steps .cur{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.steps .view{border-color:var(--black);color:var(--ink);box-shadow:inset 0 0 0 1px var(--black)}
.steps .view b{background:var(--black);color:#fff}
.steps .cur b{background:var(--accent);color:var(--accent-ink)}
.steps .lock{opacity:.55;cursor:not-allowed}
.steps .skip{opacity:.45;border-style:dashed}
.steps .sep{color:var(--faint);font-size:12px;padding:0 2px}
.steps .lbl{display:flex;flex-direction:column;line-height:1.15;font-size:13px}
.steps .lbl small{font-size:11px;font-weight:500;opacity:.7;margin-top:2px}
.steps .right{margin-left:auto;display:flex;gap:8px}
/* ---- status band: one per stage, holds substatus and the single green action ---- */
.band{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.band .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.band.live .dot{background:var(--accent)}
.band.done .dot{background:var(--ink)}
.band.warn .dot{background:#f59e0b}
.band .txt{min-width:0;flex:1;line-height:1.35}
.band .txt b{font-size:14px;display:flex;align-items:center;gap:8px}
.band .txt span{font-size:12.5px;color:var(--muted)}
.band .acts{display:flex;gap:8px;flex:none;align-items:center}
.band-h{display:flex;align-items:center;gap:14px;padding:12px 16px}
.band-h b{font-size:14px;display:flex;align-items:center;gap:8px;flex:1}
.band-h .acts{display:flex;gap:8px;align-items:center}
.band-b{padding:0 16px 14px}
.sh2{display:flex;align-items:center;gap:12px;margin:4px 0 12px;min-height:32px}
.sh2 h2{margin:0;font-size:16px;font-weight:700}
.sh2 h2 .st{color:var(--muted);font-weight:500;margin-left:8px}
.sh2 .r{margin-left:auto;display:flex;gap:8px;align-items:center}
/* ---- buttons ---- */
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 16px;height:36px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.btn.primary:hover{background:#000}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go:hover{background:#78bd0f}
.btn.danger{color:var(--err);border-color:var(--err-bg);background:var(--surface)}
.btn.danger:hover{background:var(--err-bg)}
.btn.ghost{border-color:transparent;background:transparent;font-weight:600}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:6px}
.btn.xs{height:24px;padding:0 8px;font-size:11px;border-radius:5px;font-weight:600}
.btn.ic{width:30px;padding:0;justify-content:center}
.btn.trash{color:var(--muted)}
.btn.trash:hover{color:var(--err);border-color:var(--err-bg);background:var(--err-bg)}
.btn:disabled,.btn.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn svg{width:14px;height:14px;flex:none}
/* ---- panels & forms ---- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);min-height:48px}
.panel-h h3{margin:0;font-size:14px;font-weight:700}
.panel-h .hint{color:var(--muted);font-size:12.5px;font-weight:400}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.panel.flat .panel-b{padding:0}
.panel.locked .panel-h h3::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-1px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>') no-repeat center/contain}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.field>label i{color:var(--err);font-style:normal}
.field .hint{font-size:12px;color:var(--muted)}
.field.locked .in,.field.locked .sel{color:var(--muted);background:var(--surface);border-style:dashed}
.panel-h h3 .q,.sh h3 .q{margin-left:8px;vertical-align:2px;font-weight:700}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:700;cursor:help;position:relative;white-space:normal;letter-spacing:0;text-transform:none;flex:none}
.q:hover{background:var(--ink);color:#fff}
.q::after{content:attr(data-t);position:absolute;left:-10px;top:24px;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:0 10px 30px rgba(17,24,39,.14);font-weight:400;font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:8px;width:max-content;max-width:340px;text-align:left;z-index:40;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .12s,transform .12s}
.q::before{content:"";position:absolute;left:3px;top:17px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg) translateY(-4px);z-index:41;opacity:0;pointer-events:none;transition:opacity .12s}
.q:hover::after,.q:hover::before{opacity:1;transform:none}
.q:hover::before{transform:rotate(45deg)}
.r .q::after,.tt .q::after{left:auto;right:-10px}
.r .q::before,.tt .q::before{left:auto;right:3px}
.in,.sel,.ta{width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--ink);font-weight:500}
.ta{height:auto;min-height:72px;padding:9px 11px;resize:vertical;font-weight:400}
.in::placeholder,.ta::placeholder{color:var(--faint);font-weight:400}
.in.mono{font-family:var(--mono);font-size:13px}
.sel{appearance:auto}
.num{width:84px;text-align:center;font-variant-numeric:tabular-nums}
/* ширина поля по объёму данных: даты, числа и селекты не растягиваются, во всю строку только текст */
.grid2,.grid3,.grid4{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start}
:where(.grid2,.grid3,.grid4)>.field{flex:1 1 260px;max-width:440px}
/* flex-basis только внутри рядов полей: в колонках (модалки) он стал бы высотой */
:where(.grid2,.grid3,.grid4)>.field:has(>input[type="date"]),:where(.grid2,.grid3,.grid4)>.field:has(>.inl>input[type="date"]){flex:0 0 190px}
:where(.grid2,.grid3,.grid4)>.field:has(>input[type="datetime-local"]){flex:0 0 250px}
:where(.grid2,.grid3,.grid4)>.field:has(>input[type="number"]){flex:0 0 auto}
:where(.grid2,.grid3,.grid4)>.field:has(>select){flex:0 0 280px}
:where(.grid2,.grid3,.grid4)>.field:has(>label+.btn),:where(.grid2,.grid3,.grid4)>.field:has(>.inl>select){flex:0 0 auto}
.field:has(>input[type="date"]),.field:has(>.inl>input[type="date"]){max-width:190px}
.field:has(>input[type="datetime-local"]){max-width:250px}
.field:has(>input[type="number"]){max-width:none}
.field:has(>input[type="number"])>.in{width:150px}
.field>label{white-space:nowrap}
.field:has(>select){max-width:280px}
.field:has(>label+.btn),.field:has(>.inl>select){max-width:none}
.field:has(>.inl>select) .sel{width:260px}
.field:has(>input.num){max-width:150px}
.inl{display:flex;gap:8px;align-items:center}
.inl .in{flex:1}
.wizwrap{max-width:1040px}
.wizwrap.wide{max-width:1400px}/* шаг «Тип турнира»: три карточки этапов со схемами, при необходимости сужается */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip.ok{background:var(--accent-soft);color:var(--accent-line)}
button.chip{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
button.chip:hover{background:var(--border)}
.chip.on{background:var(--black);color:var(--black-ink)}
.chip.on.bad{background:var(--err);color:#fff}
.chip.bad{background:var(--err-bg);color:var(--err)}
.chip.x{border:1px solid var(--border);background:var(--surface)}
.chip.x button{border:0;background:transparent;color:var(--muted);padding:0;font-size:14px;line-height:1}
.chip.add{border:1px dashed var(--border-strong);background:transparent;color:var(--muted);cursor:pointer}
.toggle{position:relative;width:38px;height:22px;flex:none;border-radius:999px;background:var(--border-strong);border:0;transition:background .15s;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:19px}
.toggle:disabled{opacity:.4;cursor:not-allowed}
.trow{display:flex;align-items:center;gap:10px}
.trow b{font-size:13px;font-weight:600;white-space:nowrap}
.trow span{color:var(--muted);font-size:12px}
.vrow{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.vrow .b{width:28px;height:28px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.vrow .t{flex:1;min-width:0}
.vrow .t b{display:block;font-size:13px}
.vrow .t span{font-size:12px;color:var(--muted)}
.vrow .courts{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.vrow .courts input{width:56px;height:30px;text-align:center;font-weight:600;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.alert{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;font-size:12.5px;flex-wrap:wrap}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.hint{background:var(--hint-bg);color:var(--hint)}
.alert .fix{margin-left:auto;display:flex;gap:6px}
.alert .fix button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;color:inherit}
/* ---- wizard footer ---- */
.wizfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 0;margin-top:6px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border)}
.wizfoot .sp{flex:1;color:var(--err);font-size:13px}
/* ---- stage cards (type step) ---- */
.stages{display:grid;grid-template-columns:1fr 48px 1fr 48px 1fr;gap:0;align-items:stretch}
.arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700}
.arrow svg{width:28px;height:14px}
.arrow.off{opacity:.35}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:300px}
.scard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scard.off{opacity:.65}
.scard.off .sbody{pointer-events:none}
.scard .shead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.scard .shead .k{font-size:11px;color:var(--muted);font-weight:600}
.scard .shead .n{font-weight:700;font-size:14px}
.scard .sbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard .sfoot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:500}
.scard .sfoot b{color:var(--ink);font-size:13px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px;font-weight:600}
.prow .sel,.prow .in{width:auto;height:32px}
.tview{display:flex;flex-direction:column;gap:8px}
.tview .tt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tview .tt b{font-size:14px}
.tview .tt .code{font-family:var(--mono);font-size:11px;color:var(--accent-line);margin-left:4px}
.tview .tt .q{margin-left:8px;vertical-align:1px}
.tview .tt .nw{white-space:nowrap}
.tview p{margin:0;color:var(--muted);font-size:12.5px}
.anim{background:var(--surface-2);border-radius:6px;border:1px solid var(--border);aspect-ratio:1.5;display:block;overflow:hidden}
.anim svg{width:100%;height:100%;display:block}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{border:1px solid var(--border);border-radius:10px;padding:16px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;cursor:pointer;font:inherit}
.tcard:hover{border-color:var(--border-strong)}
.tcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard.dis{cursor:default}
.tcard.dis:hover{border-color:var(--border)}
.tcard.dis b,.tcard.dis p{color:var(--muted)}
.tcard.dis .anim{opacity:.6}
.tcard .codes{display:flex;gap:6px;align-items:center}
.tcard .code{display:inline-block;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:11px;font-weight:600}
.tcard .selp{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.tcard b{font-size:15px;line-height:1.3}
.tcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.tcard .soon{color:#e0655a;font-weight:700;font-size:13px;margin-top:auto}
.sheet.wide{max-width:1140px}
.n{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2}
.n.bye{stroke-dasharray:2 2;fill:transparent}
.n.in{fill:var(--accent-soft);stroke:var(--accent-line)}
.ln{fill:none;stroke:var(--border-strong);stroke-width:1.1}
.ln.dash{stroke-dasharray:3 3;stroke:var(--accent-line)}
.pth{fill:none;stroke:var(--path);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pn{fill:var(--accent);stroke:var(--path);stroke-width:1.5}
.lab{font-size:10px;fill:var(--muted);font-family:var(--sans);font-weight:600}
.lab.big{font-size:11px;fill:var(--ink)}
.cap{font-size:11px;fill:var(--ink);font-family:var(--sans);font-weight:600}
.box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2;rx:5}
.pl{font-size:10px;fill:var(--ink);font-family:var(--mono)}
.anim .pth{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 4s linear infinite}
@keyframes draw{0%{stroke-dashoffset:var(--len)}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:12px;border:1px solid var(--border);max-width:560px;width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.sheet .sh h3{margin:0;font-size:16px}
.sheet .sh .hint{color:var(--muted);font-size:12.5px}
.sheet .sh .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.sheet .sb{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}

/* ---------- расчёт структуры (портировано из конструктора типа) ---------- */
function rrCalc(s){return {matches:s*(s-1)/2,rounds:s<2?0:(s%2?s:s-1)}}
function groupSizes(n,G){if(n<2)return [n];G=Math.max(1,Math.min(G,Math.floor(n/2)));const base=Math.floor(n/G),extra=n%G,sizes=[];for(let i=0;i<G;i++)sizes.push(base+(i<extra?1:0));return sizes}
function bracketCalc(t,f){
  if(t<=1)return {matches:0,rounds:0,byes:0,M:1};
  if(f.type==='FG'){const c=rrCalc(t);return {...c,byes:0,M:t}}
  const M=pow2up(t),R=log2(M),byes=M-t;
  if(f.type==='O')return {matches:t-1+(f.third&&t>=4?1:0),rounds:R,byes,M};
  if(f.type==='ODT'){const L1=t-M/2;let E,dtR;if(f.dt==='r1'){E=L1;dtR=E>=2?log2(pow2up(E)):0}else if(f.dt==='r12'){E=L1+(R>=2?M/4:0);dtR=Math.max(1,L1>=2?log2(pow2up(L1)):0)+(R>=2?1:0)}else{E=t-1;dtR=R}
    return {matches:t-1+(f.thirdOT&&t>=4?1:0)+Math.max(0,E-1)+(f.thirdDT&&E>=4?1:0),rounds:Math.max(R,1+dtR),byes,M}}
  if(f.type==='UO')return {matches:(M/2)*R-byes,rounds:R,byes,M};
  if(f.type==='UO2'){const g=f.grand?1:0;return {matches:2*t-4+g+(f.third&&t>=4?1:0),rounds:2*R-2+g,byes,M}}
}
function structure(w){
  const N=+w.N,Q=w.qual?+w.Q:0,WC=+w.WC,DA=N-Q-WC,out={N,Q,WC,DA,errors:[],warns:[]};
  if(w.groups){const sizes=groupSizes(N,+w.G);let m=0,r=0;sizes.forEach(s=>{const c=rrCalc(s);m+=c.matches;r=Math.max(r,c.rounds)});out.groups={sizes,G:sizes.length,matches:m,rounds:r,out:sizes.reduce((a,s)=>a+Math.min(+w.k,s),0)}}
  if(w.finOn!==false){const t=w.groups?out.groups.out:N;out.fin={t,...bracketCalc(t,w.fin)}}
  if(DA<0)out.errors.push({id:'V8',msg:`Прямой допуск + Q + WC больше вместимости на ${-DA}. Уменьшите Q или WC.`});
  if(w.groups&&out.groups.G>1&&w.finOn===false)out.errors.push({id:'V4',msg:'Места между группами не разыграны. Включите финальный этап.'});
  if(!w.groups&&w.finOn===false)out.errors.push({id:'V5',msg:'Турнир не определяет победителя: включите групповой или финальный этап.'});
  if(w.finOn!==false&&w.fin.type==='FG'&&!w.groups)out.errors.push({id:'V6',msg:'Финальная группа возможна только после группового этапа.'});
  if(out.fin&&out.fin.byes>0&&w.fin.type!=='FG')out.warns.push({id:'V1',msg:`Сетка ${out.fin.M}: ${out.fin.byes} ${plural(out.fin.byes,'пропуск','пропуска','пропусков')} в первом туре у сильнейших по посеву.`});
  if(w.qual&&Q>N/2)out.warns.push({id:'V3',msg:'Через квалификацию больше половины мест основного турнира.'});
  return out;
}
function formula(w){const c=structure(w),p=[];if(w.qual)p.push(`Квал →${c.Q}`);if(c.groups)p.push(`Группы ${c.groups.G}×${Math.max(...c.groups.sizes)}${c.fin?` (выходят ${w.k})`:''}`);
  if(c.fin){if(w.fin.type==='FG')p.push(`Финальная группа ${c.fin.t}`);else{let s=`Плей-офф ${c.fin.t} ${TYPES[w.fin.type].code}`;if((w.fin.type==='O'||w.fin.type==='UO2')&&w.fin.third)s+=', матч за 3-е';if(w.fin.type==='ODT'&&w.fin.thirdOT)s+=', матч за 3-е';if(w.fin.type==='UO2'&&w.fin.grand)s+=', гранд-финал';p.push(s)}}
  return p.join(' · ')}
function rulesText(r){return `до ${r.sets} ${plural(+r.sets,'победы','побед','побед')} · сет до ${r.games} · тай-брейк ${r.tb==='off'?'выкл':'до '+r.tb} · ${r.dec==='stb'?'решающий — супер-тай-брейк до 10':'решающий — полный сет'} · 40:40 — ${DEUCE_N[r.deuce]}`}

/* ---------- мини-схемы типов (SVG) ---------- */
function layoutCols(cols,x0,y0,colW,h){const nodes={};cols.forEach((n,ci)=>{const s=h/n;for(let i=0;i<n;i++)nodes[ci+':'+i]={x:x0+ci*colW,y:y0+s*(i+.5)}});return {nodes}}
function circ(p,cls,r=4){return `<circle class="${cls}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}"/>`}
function elbow(a,b){const mx=(a.x+b.x)/2;return `<path class="ln" d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}H${mx.toFixed(1)}V${b.y.toFixed(1)}H${b.x.toFixed(1)}"/>`}
function drawSE(pre,M,t,x,y,w,h,opts={}){const R=log2(M);const cols=[];for(let r=0;r<=R;r++)cols.push(M/Math.pow(2,r));const colW=w/(cols.length-1||1);const {nodes}=layoutCols(cols,x,y,colW,h);let s='',map={};const byeSet=new Set();let byes=M-t;for(let i=M/2-1;i>=0&&byes>0;i--,byes--)byeSet.add(2*i+1);
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];map[pre+':'+ci+':'+i]=p;if(ci<cols.length-1){s+=elbow(p,nodes[(ci+1)+':'+(i>>1)])}}});
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];const bye=ci===0&&byeSet.has(i);s+=circ(p,'n'+(bye?' bye':'')+(opts.inCls&&ci===0?' in':''),ci===cols.length-1?5:3.5)}});
  if(opts.label)s+=`<text class="lab" x="${x}" y="${y-6}">${opts.label}</text>`;
  if(opts.third&&t>=4){const f=nodes[R+':0'];const p={x:f.x,y:Math.min(y+h+14,f.y+Math.max(28,h/M*2))};map[pre+':3rd']=p;s+=circ(p,'n',3.5)+`<text class="lab" x="${p.x+8}" y="${p.y+3.5}">за 3-е</text>`}
  return {s,map,R,cols,byeSet}}
function drawUO(pre,M,t,x,y,w,h){const R=log2(M);const cols=[];for(let r=0;r<=R;r++)cols.push(M);const colW=w/R;const {nodes}=layoutCols(cols,x,y,colW,h);let s='',map={};
  for(let r=0;r<R;r++){const B=M/Math.pow(2,r);for(let i=0;i<M;i++){const b=Math.floor(i/B),pI=Math.floor((i%B)/2);const p=nodes[r+':'+i];s+=elbow(p,nodes[(r+1)+':'+(b*B+pI)]);s+=elbow(p,nodes[(r+1)+':'+(b*B+B/2+pI)])}}
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];map[pre+':'+ci+':'+i]=p;s+=circ(p,'n'+(ci===0&&i>=t?' bye':''),ci===R?4:3);if(ci===R)s+=`<text class="pl" x="${p.x+8}" y="${p.y+3.5}">${i+1}</text>`}});
  return {s,map,R}}
function drawUO2(pre,M,t,x,y,w,h){const R=log2(M);const upH=h*.5,loH=h*.42;const up=drawSE(pre+':U',M,t,x,y,w,upH,{label:'Верхняя сетка'});
  const drop=[];for(let r=2;r<=R-1;r++)drop.push(M/Math.pow(2,r));const cols=[M/2];let cur=M/2;const merge=[];drop.forEach(d=>{cur=cur/2+d;cols.push(cur);merge.push(cols.length-1);cur=cur/2;cols.push(cur)});if(cur>1)cols.push(1);
  const ly=y+upH+26;const colW=w/Math.max(1,cols.length-1);const {nodes}=layoutCols(cols,x,ly,colW,loH);let s=up.s,map=up.map;
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];map[pre+':L:'+ci+':'+i]=p;if(ci<cols.length-1)s+=elbow(p,nodes[(ci+1)+':'+(i>>1)])}});
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];const isDrop=merge.includes(ci)&&i>=n/2;s+=circ(p,'n'+(isDrop?' in':''),ci===cols.length-1?5:3.5)}});
  s+=`<text class="lab" x="${x}" y="${ly-6}">Нижняя сетка</text>`;return {s,map,R,cols,merge}}
function drawODT(pre,M,t,x,y,w,h,f){const R=log2(M);const L1=t-M/2;let E;if(f.dt==='r1')E=L1;else if(f.dt==='r12')E=L1+(R>=2?M/4:0);else E=t-1;const upH=h*.52,loH=h*.38;
  const up=drawSE(pre+':U',M,t,x,y,w,upH,{label:'Основная сетка (ОТ)',third:f.thirdOT});let s=up.s,map=up.map;
  if(E>=1){const ME=pow2up(Math.max(2,E));const ly=y+upH+34;const lo=drawSE(pre+':D',ME,Math.max(1,E),x,ly,w*.7,loH,{label:'Утешительная (ДТ)',third:f.thirdDT,inCls:true});s+=lo.s;Object.assign(map,lo.map);
    let k=0;for(let i=0;i<M/2&&k<Math.min(E,ME);i++){if(up.byeSet.has(2*i+1))continue;const a=map[pre+':U:0:'+(2*i+1)],b=map[pre+':D:0:'+k];if(a&&b)s+=`<path class="ln dash" d="M${a.x} ${a.y}C${a.x-18} ${a.y},${b.x-18} ${b.y},${b.x} ${b.y}"/>`;k++}}
  return {s,map,R,E}}
function drawRR(pre,t,x,y,w,h,label){let s=`<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/><text class="lab big" x="${x+8}" y="${y+14}">${label}</text>`;const map={};const step=(h-24)/t;
  for(let i=0;i<t;i++){const p={x:x+16,y:y+24+step*(i+.5)};map[pre+':'+i]=p;s+=circ(p,'n',3.5)+`<text class="pl" x="${x+w-22}" y="${p.y+3.5}">${i+1}</text>`}
  for(let i=0;i<t;i++)for(let j=i+1;j<t;j++){const a=map[pre+':'+i],b=map[pre+':'+j];s+=`<path class="ln" d="M${a.x+4} ${a.y}C${a.x+30} ${a.y},${b.x+30} ${b.y},${b.x+4} ${b.y}" opacity=".5"/>`}
  return {s,map}}
function pathSE(pre,R,L,i0=0){const ids=[];const last=L===0?R:L-1;for(let r=0;r<=last;r++)ids.push(pre+':'+r+':'+(i0>>r));return ids}
function pathUO(pre,M,L,i0=0){const R=log2(M);const ids=[pre+':0:'+i0];let i=i0;for(let r=0;r<R;r++){const B=M/Math.pow(2,r);const b=Math.floor(i/B),pI=Math.floor((i%B)/2);const win=!(L===r+1);i=win?b*B+pI:b*B+B/2+pI;ids.push(pre+':'+(r+1)+':'+i)}return {ids,place:i+1}}
function typeAnim(type){const W=270,H=190,CAP=H-8;let s='',map={},ids=[],endLabel='';
  if(type==='O'){const d=drawSE('a',8,8,14,20,180,112,{third:true});s=d.s;map=d.map;ids=pathSE('a',3,2);endLabel='проиграл во 2-м туре → место 5–8'}
  if(type==='ODT'){const d=drawODT('a',8,8,14,20,175,120,{dt:'r1',thirdOT:false,thirdDT:false});s=d.s;map=d.map;ids=[...pathSE('a:U',3,1,1),...pathSE('a:D',2,0,0)];endLabel='проиграл в 1-м туре → победитель ДТ'}
  if(type==='UO'){const d=drawUO('a',8,8,14,20,180,132);s=d.s;map=d.map;const p=pathUO('a',8,1,0);ids=p.ids;endLabel='проиграл в 1-м туре → место '+p.place}
  if(type==='UO2'){const d=drawUO2('a',8,8,14,20,180,124);s=d.s;map=d.map;ids=[...pathSE('a:U',3,1,1),'a:L:0:0','a:L:1:0','a:L:2:0','a:L:3:0'];endLabel='проиграл в 1-м туре → нижняя сетка, 5-е'}
  if(type==='QUAL'){const a1=drawSE('a',4,4,14,22,110,64,{label:'Мини-сетка 1'}),a2=drawSE('b',4,4,14,110,110,64,{label:'Мини-сетка 2'});s=a1.s+a2.s;map={...a1.map,...a2.map};
    const m1=map['a:2:0'],m2=map['b:2:0'];const box={x:170,y:40,w:86,h:110};s+=`<rect class="box" x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="5"/><text class="lab big" x="${box.x+8}" y="${box.y+14}">Основной</text><text class="lab big" x="${box.x+8}" y="${box.y+26}">турнир</text>`;
    [m1,m2].forEach((m,i)=>{const p={x:box.x+20,y:box.y+50+i*30};map['q:'+i]=p;s+=`<path class="ln dash" d="M${m.x+4} ${m.y}C${m.x+30} ${m.y},${p.x-30} ${p.y},${p.x-4} ${p.y}"/>`+circ(p,'n in',4)});
    ids=['a:0:0','a:1:0','a:2:0','q:0'];endLabel='победитель мини-сетки → основной турнир'}
  if(type==='GROUPS'){const g1=drawRR('r',4,14,20,110,132,'Группа A'),g2=drawRR('s',4,146,20,110,132,'Группа B');s=g1.s+g2.s;map={...g1.map,...g2.map};ids=['r:0','r:1','r:2','r:3'];endLabel='каждый с каждым внутри группы'}
  if(type==='FG'){const gw=78,gh=32;let g='';for(let i=0;i<4;i++){const y=14+i*38;g+=`<rect class="box" x="14" y="${y}" width="${gw}" height="${gh}" rx="5"/><text class="lab big" x="22" y="${y+13}">Группа ${String.fromCharCode(65+i)}</text>`;for(let k=0;k<4;k++){const p={x:26+k*14,y:y+24};if(k===0)map['g:'+i+':0']=p;g+=circ(p,'n'+(k===0?' in':''),3)}}
    const r=drawRR('r',4,140,20,112,132,'Финальная группа');s=g+r.s;Object.assign(map,r.map);for(let i=0;i<4;i++){const a=map['g:'+i+':0'],b=map['r:'+i];s+=`<path class="ln dash" d="M${a.x+gw-16} ${a.y}C${a.x+gw+10} ${a.y},${b.x-30} ${b.y},${b.x-4} ${b.y}"/>`}ids=['g:1:0','r:1'];endLabel='победители групп → одна таблица'}
  const pts=ids.map(i=>map[i]).filter(Boolean);let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  const poly=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join('');s+=`<path class="pth" d="${poly}" style="--len:${len.toFixed(0)}"/>`+pts.map(p=>circ(p,'pn',3)).join('');
  s+=`<line x1="0" y1="${CAP-14}" x2="${W}" y2="${CAP-14}" stroke="var(--border)" stroke-width="1"/><text class="cap" x="14" y="${CAP}">${endLabel}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>`}

function renderNav(cur){document.getElementById('nav').innerHTML=`<a class="${cur==='t'?'cur':''}" href="#/tournaments">Турниры</a><a href="championships-list.html">Чемпионаты / Лиги</a><a href="#">Игроки</a><a href="#">Судьи</a><a href="#">Спонсоры</a><a class="reset" href="#" data-act="reset">Сбросить прототип</a>`}
function stepsBar(items){return `<ol class="steps">${items.map((it,i)=>{const cls=[it.state,it.skip?'skip':''].join(' ');const inner=`<b>${it.state==='done'?'✓':(it.num??i+1)}</b><span class="lbl">${esc(it.label)}${(it.sub||(it.state==='lock'?'ожидает':''))?`<small>${esc(it.sub||'ожидает')}</small>`:''}</span>`;
  return it.href&&it.state!=='lock'?`<a class="${cls}" href="${it.href}">${inner}</a>`:`<li class="${cls}" title="${esc(it.title||'')}">${inner}</li>`}).join('')}</ol>`}
function band(kind,title,sub,acts){return `<div class="band ${kind}"><span class="dot"></span><div class="txt"><b>${title}${sub?`<span class="q" data-t="${esc(sub)}">?</span>`:''}</b></div><div class="acts">${acts||''}</div></div>`}
function stageHead(title,status,acts,go){VIEW.foot=stageActs(go);return `<div class="sh2"><h2>${title}<span class="st">· ${status}</span></h2><span class="r">${acts||''}</span></div>${VIEW&&VIEW.divsw||''}`}
function stageActs(go){const {t,stage}=VIEW;const act=activeStage(t),prev=prevStage(t);if(stage!==act||!go)return '';
  const back=stage==='apps'&&!t.divisions.every(d=>d.apps==='open')?`<button class="btn" data-act="reopen-apps">← Открыть приём заново</button>`:prev?`<button class="btn" data-act="undo" data-s="${prev}">← ${UNDO_L[prev]}</button>`:'';
  return `<div class="wizfoot">${back}<span class="sp"></span>${go}</div>`}
function stageFoot(){return ''}
function field(label,control,hint,opts={}){const q=[opts.q,hint].filter(Boolean).join(' ');return `<div class="field ${opts.cls||''}"><label>${label}${opts.req?' <i>*</i>':''}${q?` <span class="q" data-t="${esc(q.replace(/<[^>]+>/g,''))}">?</span>`:''}</label>${control}</div>`}
function sel(bind,opts,val,extra=''){return `<select class="sel" data-bind="${bind}" ${extra}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('sheet').classList.remove('wide')}
function confirmModal(title,text,okLabel,act,danger){openModal(`<div class="sh"><h3>${title}</h3><button class="x" data-act="close">×</button></div><div class="sb"><p style="margin:0;color:var(--muted)">${text}</p></div><div class="sf"><span class="sp"></span><button class="btn" data-act="close">Отмена</button><button class="btn ${danger?'danger':'primary'}" data-act="${act}">${okLabel}</button></div>`)}

function tStatus(t){const d=D(t);const stages=t.divisions.map(dv=>divStage(t,dv));
  if(stages.every(s=>s.key==='done'))return {cls:'done',l:'завершён'};
  if(stages.some(s=>s.key==='main'||s.key==='qual'))return {cls:'live',l:'турнир идёт'};
  if(stages.some(s=>s.key==='drawq'||s.key==='drawm'))return {cls:'',l:'жеребьёвка'};
  return {cls:'',l:'приём заявок'}}
function pageList(){renderNav('t');const rows=DB.tournaments.map(t=>{const st=tStatus(t);const pairs=t.divisions.reduce((a,d)=>a+d.pairs.filter(p=>!p.off).length,0);
  return `<tr><td class="name"><b>${esc(t.name)}</b><span>${esc(t.cat)}${t.divisions.length>1?' · дивизионы: '+t.divisions.map(d=>d.name.toLowerCase()).join(', '):''}</span></td><td>${fmtRange(t.start,t.end)}</td><td>${t.venues[0]?esc(t.venues[0].name+', '+t.venues[0].city):'<span style="color:var(--faint)">площадка не указана</span>'}</td><td>${pairs||'—'}</td><td><span class="pill ${st.cls}">${st.l}</span></td><td style="color:var(--muted);font-size:12px">${fmtRange(t.created)}</td><td class="act"><a class="btn sm ${st.cls==='live'?'primary':''}" href="#/t" data-act="open" data-id="${t.id}">${st.cls==='live'?'Вести матчи':'Открыть'}</a></td></tr>`}).join('');
  document.getElementById('app').innerHTML=`<div class="ph"><div class="tt"><h1>Турниры</h1><div class="meta">Ваши турниры: создание, публикация, ведение</div></div><div class="act"><a class="btn go" href="#/new/1" data-act="newwiz">+ Новый турнир</a></div></div>
  <div class="tbl"><table><thead><tr><th>Турнир</th><th>Даты</th><th>Площадка</th><th>Пары</th><th>Состояние</th><th>Создан</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}

/* =====================================================================

const WSTEPS=['Основные настройки','Тип турнира','Настройки матчей','Участники'];
function wizErrors(w){const e=[];if(!w.name.trim())e.push({step:1,msg:'название турнира'});if(!w.start)e.push({step:1,msg:'дата начала'});if(!(+w.courts>0))e.push({step:1,msg:'число кортов'});(w.divisions.length?w.divisions:[{struct:w.struct}]).forEach(d=>structure(d.struct).errors.forEach(x=>e.push({step:2,msg:(d.name?d.name+': ':'')+x.msg})));return e}
function stepDone(w,i){return !wizErrors(w).some(e=>e.step===i)&&(i===1?!!(w.name.trim()&&w.start):true)}
function pageWiz(step){renderNav('t');const w=DB.wiz;w.step=step;const errs=wizErrors(w);
  const items=WSTEPS.map((l,i)=>({label:l,state:i+1===step?'cur':(i+1<step&&stepDone(w,i+1))?'done':'',href:`#/new/${i+1}`}));
  const body=[null,wizStep1,wizStep2,wizStep3,wizStep4][step](w);
  const missing=errs.length?`<div class="alert err" style="margin-bottom:12px">Чтобы создать турнир, заполните: ${errs.map(e=>`<a href="#/new/${e.step}" style="font-weight:600">${e.msg}</a> (шаг ${e.step})`).join(', ')}</div>`:'';
  const foot=`<div class="wizfoot">${step>1?`<a class="btn" href="#/new/${step-1}">← Назад</a>`:''}<span class="sp"></span>${step<4?`<a class="btn primary" href="#/new/${step+1}">Далее →</a>`:`<button class="btn go" data-act="create" ${errs.length?'disabled':''}>Создать турнир</button>`}</div>`;
  if(step===4)return void(document.getElementById('app').innerHTML=`<div class="ph"><div class="tt"><h1>Создание турнира</h1></div></div>${stepsBar(items)}
  <div class="wizwrap">${body}${missing}${foot}</div>`);
  document.getElementById('app').innerHTML=`<div class="ph"><div class="tt"><h1>Создание турнира</h1></div></div>${stepsBar(items)}
  <div class="wizwrap ${step===2?'wide':''}">${body}${foot}</div>`}
function divTabs(w,edit){const c=wizCur(w);const tabs=`<div class="tb" style="gap:10px;padding:10px 16px"><span class="seg lg">${w.divisions.map(d=>`<button class="${d.id===c.d.id?'on':''}" data-act="seldiv" data-d="${d.id}">${esc(d.name)}${!edit&&structure(d.struct).errors.length?' <span style="color:var(--err)">•</span>':''}</button>`).join('')}</span>${edit?`<button class="btn sm" data-act="adddiv">+ Добавить дивизион</button>`:''}<span class="sp"></span>${!edit&&w.divisions.length>1?`<button class="btn sm" data-act="copystruct" data-d="${c.d.id}">Скопировать настройки во все дивизионы</button>`:''}</div>`;
  if(!edit)return tabs;
  return tabs+`<div class="panel-b" style="padding-top:12px"><div class="grid3">${field('Название дивизиона',`<input class="in" data-bind="wiz.divisions.${c.i}.name" value="${esc(c.d.name)}" placeholder="Дивизион 1">`,'Так дивизион называется на витрине и в расписании')}${field('Состав',sel(`wiz.divisions.${c.i}.kind`,DIVK,c.d.kind),'От пола зависит, каким аккаунтом ЕЦП загружаются заявки')}<div class="field"><label>&nbsp;</label><button class="btn ${w.divisions.length>1?'danger':''}" data-act="deldiv" data-d="${c.d.id}" ${w.divisions.length>1?'':'disabled'}>Удалить дивизион</button></div></div></div>`}
function judgesPanel(o){const attached=[...JUDGES_FPR,...o.judgesLocal].filter(j=>o.judges.includes(j.id));const free=[...JUDGES_FPR,...o.judgesLocal].filter(j=>!o.judges.includes(j.id));
  return `<div class="panel"><div class="panel-h"><h3>Судьи турнира<span class="q" data-t="Из закреплённых выбирается судья матча в расписании. Судьи ФПР видны всем организаторам, локальных заводит организатор и видит только он. Без судей матчи идут без судьи">?</span></h3><span class="r"><button class="btn sm" data-act="judge-new">Завести судью</button></span></div><div class="panel-b">
    ${attached.length?attached.map(j=>`<div class="jrow"><span class="t"><b>${esc(j.n)}</b><span>${esc(j.e)} · ${j.kind==='fpr'?'аккредитован ФПР':'мой судья'}</span></span><span class="chip ${j.kind==='fpr'?'ok':''}">${j.kind==='fpr'?'ФПР':'локальный'}</span><button class="btn xs" data-act="judge-detach" data-id="${j.id}">Открепить</button></div>`).join(''):'<div class="empty" style="margin-bottom:12px">Судей пока нет</div>'}
    <div class="inl" style="margin-top:12px"><select class="sel" data-act-change="judge-attach" style="max-width:360px"><option value="">+ Закрепить судью…</option><optgroup label="Судьи ФПР · видны всем организаторам">${free.filter(j=>j.kind==='fpr').map(j=>`<option value="${j.id}">${esc(j.n)}</option>`).join('')}</optgroup><optgroup label="Мои судьи · видны только мне">${free.filter(j=>j.kind==='local').map(j=>`<option value="${j.id}">${esc(j.n)}</option>`).join('')}</optgroup></select></div>
  </div></div>`}
function judgeCtx(){return location.hash.startsWith('#/new')?DB.wiz:T()}
function wizStep1(w){const courts=+w.courts||0;w.judges=w.judges||[];w.judgesLocal=w.judgesLocal||[];

  ${w.venues.map((v,i)=>`<div class="vrow"><span class="b">${esc(v.name[0])}</span><span class="t"><b>${esc(v.name)}</b><span>${esc(v.city)}</span></span><button class="btn xs ic" data-act="delvenue" data-i="${i}" title="Убрать">×</button></div>`).join('')}
  </div></div></div>
  ${judgesPanel(w)}
  <div class="panel"><div class="panel-h"><h3>Описание и регламент<span class="q" data-t="Публикуются в разделе «Регламент» витрины">?</span></h3></div><div class="panel-b"><div class="form">
  ${field('Описание',`<textarea class="ta" data-bind="wiz.desc" placeholder="Организатор, взнос, призовые, условия участия…">${esc(w.desc)}</textarea>`)}
  ${field('Полный регламент',`<div class="inl"><input class="in" data-bind="wiz.reg" value="${esc(w.reg)}" placeholder="https://…"><button class="btn" data-act="pdf">Загрузить PDF</button></div>`,'Ссылка на страницу или PDF до 10 МБ, на витрине покажем и то, и другое')}
  <div class="grid2">${field('Цветовая схема',`<div class="inl">${sel('wiz.color',[['green','Зелёная'],['blue','Голубая'],['red','Красная'],['dark','Тёмная']],w.color)}<button class="btn" data-act="preview-color">Как это выглядит</button></div>`,'Цвета витрины, ТВ-табло и табло жеребьёвки')}</div>

function counts(t,dv){const st=S_(t,dv);const m=zone(dv,'main'),q=zone(dv,'qual'),r=zone(dv,'res');const wc=m.filter(p=>p.wc).length;return {m:m.length,q:q.length,r:r.length,wc,N:st.N,Q:st.qual?st.Q:0,WC:st.WC,directCap:st.N-(st.qual&&q.length?st.Q:0)}}

  const list=[...livePairs(dv).sort((a,b)=>(b.a.r+b.b.r)-(a.a.r+a.b.r)),...dv.pairs.filter(p=>p.off)].filter(p=>!zf||p.zone===zf||(zf==='wc'&&p.wc));

function pairRow(t,dv,p,n,open){t=S_(t,dv);const locked=!open;const segDis=locked||p.off;
  return `<div class="row ${p.off?'off':''}" data-pair="${p.id}"><span class="n">${n}</span><span class="nm"><b>${esc(p.a.n)}</b><small>${p.a.r}</small><span style="color:var(--faint)">/</span><b>${esc(p.b.n)}</b><small>${p.b.r}</small>${p.wc?'<span class="tag wc">WC</span>':''}${p.manual?'<span class="tag res">вручную</span>':''}</span><span class="rt">${p.a.r+p.b.r}</span>

function byRating(t,dv){t=S_(t,dv);const list=livePairs(dv).sort((a,b)=>(b.a.r+b.b.r)-(a.a.r+a.b.r));const wcs=list.filter(p=>p.wc);const others=list.filter(p=>!p.wc);const direct=t.N-t.WC-(t.qual?t.Q:0);

/* =====================================================================
   Стадии 2 и 3: жеребьёвка квалификации и основной сетки
   ===================================================================== */
function drawSpec(t,dv,kind){t=S_(t,dv);if(kind==='q'){const P=zone(dv,'qual').length;const M=P>=2?pow2up(P):2;const R=log2(M)-log2(pow2up(t.Q));return {M,title:'Квалификация',roundName:P>=2?`${P} ${plural(P,'пара','пары','пар')} · сетка ${M}${M>P?` · ${M-P} ${plural(M-P,'пропуск','пропуска','пропусков')}`:''} · ${R} ${plural(R,'тур','тура','туров')} · пройдут ${t.Q}`:'',ok:P>=2&&P>t.Q}}
  return {M:t.N,title:'Основная сетка',roundName:`1/${t.N/2} финала · ${t.N} позиций`,ok:true}}
function drawPool(t,dv,kind){t=S_(t,dv);if(kind==='q')return zone(dv,'qual').map(p=>({k:'pair',id:p.id}));const pool=zone(dv,'main').map(p=>({k:'pair',id:p.id}));if(hasQual(t,dv))for(let i=1;i<=t.Q;i++)pool.push({k:'q',n:i});return pool}
function refKey(r){return r.k==='pair'?'p:'+r.id:'q:'+r.n}
function refLabel(t,dv,r,full){if(!r)return null;if(r.k==='pair'){const p=dv.pairs.find(x=>x.id===r.id);return p?(full?pairShort(p):pairName(p)):'—'}if(r.k==='q'){const w=dv.qualWinners[r.n-1];if(w){const p=dv.pairs.find(x=>x.id===w);return p?(full?pairShort(p):pairName(p)):'—'}return `Победитель квалификации №${r.n}`}return '—'}
function stageDraw(t,dv,kind){if(kind==='q'&&!hasQual(t,dv))return stageHead('Жеребьёвка квалификации','не нужна',`<span class="hint">в дивизионе «${esc(dv.name)}» пар в квалификации нет</span>`,`<button class="btn go" data-act="draw-fix" data-k="q" ${drawReady(T(),'q')?'':'disabled'}>Зафиксировать жеребьёвку →</button>`)+`<div class="empty">Квалификация в этом дивизионе не проводится. Зафиксируйте жеребьёвку в дивизионах, где она есть</div>`;
  const dr=kind==='q'?dv.drawQ:dv.drawM;const spec=drawSpec(t,dv,kind);const pool=drawPool(t,dv,kind);if(dr.slots.length!==spec.M){dr.slots=Array(spec.M).fill(null);dr.done=false}
  const placed=new Set(dr.slots.filter(Boolean).map(refKey));const wait=pool.filter(r=>!placed.has(refKey(r)));const n=dr.slots.filter(Boolean).length;const selKey=DB.ui.sel;
  const ready=drawReady(T(),kind);const hd=stageHead(kind==='q'?'Жеребьёвка квалификации':'Жеребьёвка основной сетки',dr.done?'завершена':'идёт','',dr.done?'':`<button class="btn go" data-act="draw-fix" data-k="${kind}" ${ready?'':'disabled'} title="${ready?'':'Расставьте все пары во всех дивизионах'}">Зафиксировать жеребьёвку →</button>`);
  const ft='';
  const waitRows=wait.map(r=>{const key=refKey(r);const p=r.k==='pair'?dv.pairs.find(x=>x.id===r.id):null;return `<div class="wp ${key===selKey?'sel':''} ${r.k==='q'?'ph':''}" draggable="${dr.done?'false':'true'}" data-act="draw-sel" data-key="${key}">${p?`${esc(pairShort(p))}${p.wc?' <span class="tag wc">WC</span>':''}<span class="r">${p.a.r+p.b.r}</span>`:`${refLabel(t,dv,r)}<span class="tag q">Q</span>`}</div>`}).join('');
  const slots=[];for(let i=0;i<spec.M;i+=2){slots.push(`<div class="pair">${[i,i+1].map(j=>{const r=dr.slots[j];const lbl=r?refLabel(t,dv,r,true):null;const p=r&&r.k==='pair'?dv.pairs.find(x=>x.id===r.id):null;
    return `<div class="pos"><span class="n">${j+1}</span><span class="s ${r?'f':''} ${r&&r.k==='q'?'ph':''} ${!r&&selKey&&!dr.done?'can':''}" data-act="draw-put" data-i="${j}" data-k="${kind}"><span class="nm">${lbl||'свободно'}</span>${p&&p.wc?'<span class="tag wc">WC</span>':''}${r&&!dr.done?`<button class="x" data-act="draw-del" data-i="${j}" data-k="${kind}" title="Убрать">×</button>`:''}</span></div>`}).join('')}</div>`)}
  return hd+`<div class="dcols"><div class="panel flat" style="margin:0"><div class="panel-h"><h3>Ждут жеребьёвки</h3><span class="hint">${wait.length} из ${pool.length}</span></div>${waitRows||'<div class="empty" style="margin:12px">Все пары расставлены</div>'}</div>
  <div class="panel flat ${dr.done?'ro':''}" style="margin:0"><div class="panel-h"><h3>${spec.title}</h3><span class="hint">${spec.roundName}</span></div><div class="slots">${slots.join('')}</div></div></div>`+ft}
function fixDraw(t,dv,kind){const dr=kind==='q'?dv.drawQ:dv.drawM;if(!dr.slots.length)return;dr.done=true;dv.matches=dv.matches.filter(m=>m.stage!==(kind==='q'?'qual':'main'));genMatches(t,dv,kind);DB.ui.sel=null}
function resetDraw(t,dv,kind){const dr=kind==='q'?dv.drawQ:dv.drawM;dr.done=false;dr.slots=dr.slots.map(()=>null);dv.matches=dv.matches.filter(m=>m.stage!==(kind==='q'?'qual':'main'));if(kind==='q'){dv.qualDone=false;dv.qualWinners=[]}else dv.mainDone=false}

/* =====================================================================
   Матчи: генерация сеток, разрешение ссылок, расписание, счёт
   ===================================================================== */
function mkMatch(stage,br,r,i,label,a,b){return {id:uid(),stage,br,r,i,label,num:i+1,a,b,court:null,day:null,tm:'at',time:'',judge:'',sets:[],winner:null,fin:'normal',done:false}}
function roundName(size){return size===1?'Финал':size===2?'1/2 финала':`1/${size} финала`}
function refExists(dv,ref){if(!ref)return false;if(ref.k==='pair'||ref.k==='q')return true;const m=dv.matches.find(x=>x.id===ref.m);if(!m)return false;if(!m.bye)return true;return ref.k==='w'?!!m.winner:false}
function settleByes(dv){let changed=true;while(changed){changed=false;dv.matches.forEach(m=>{if(m.done)return;const ea=refExists(dv,m.a),eb=refExists(dv,m.b);if(ea&&eb)return;m.bye=true;m.done=true;m.sets=[];m.fin='bye';m.winner=ea?'a':eb?'b':null;changed=true})}}
function genMatches(t,dv,kind){t=S_(t,dv);
  if(kind==='q'){const slots=dv.drawQ.slots;const P=slots.length;const R=log2(pow2up(P))-log2(pow2up(t.Q));let prev=[];
    for(let r=0;r<R;r++){const cnt=P/Math.pow(2,r+1);const cur=[];const lbl=R===1?'Квалификация · решающий тур':r===R-1?`Квалификация · ${r+1}-й тур, решающий`:`Квалификация · ${r+1}-й тур`;
      for(let i=0;i<cnt;i++){const a=r===0?slots[2*i]:{k:'w',m:prev[2*i].id},b=r===0?slots[2*i+1]:{k:'w',m:prev[2*i+1].id};cur.push(mkMatch('qual','U',r,i,lbl,a,b))}dv.matches.push(...cur);prev=cur}settleByes(dv);return}
  const slots=dv.drawM.slots;const N=slots.length;const R=log2(N);let prev=[];const rounds=[];
  for(let r=0;r<R;r++){const cnt=N/Math.pow(2,r+1);const cur=[];for(let i=0;i<cnt;i++){const a=r===0?slots[2*i]:{k:'w',m:prev[2*i].id},b=r===0?slots[2*i+1]:{k:'w',m:prev[2*i+1].id};cur.push(mkMatch('main','U',r,i,roundName(cnt),a,b))}dv.matches.push(...cur);rounds.push(cur);prev=cur}
  if(t.fin.third&&R>=2){const sf=rounds[R-2];dv.matches.push(mkMatch('main','T',R-1,0,'Матч за 3-е место',{k:'l',m:sf[0].id},{k:'l',m:sf[1].id}))}
  if(t.fin.type==='UO2'&&R>=3){let cur=rounds[0].map(m=>({k:'l',m:m.id}));let r=0;while(cur.length>=2){const cnt=cur.length/2;const lbl=cnt===1?'Матч за 5-е место':`Нижняя сетка · ${r+1}-й круг`;const ms=[];for(let i=0;i<cnt;i++)ms.push(mkMatch('main',cnt===1?'T5':'L',r,i,lbl,cur[2*i],cur[2*i+1]));dv.matches.push(...ms);cur=ms.map(m=>({k:'w',m:m.id}));r++}}
  settleByes(dv);
}
function resolve(t,dv,ref){if(!ref)return {p:null,text:'—'};if(ref.k==='pair'){const p=dv.pairs.find(x=>x.id===ref.id);return {p,text:p?pairName(p):'—'}}
  if(ref.k==='q'){const w=dv.qualWinners[ref.n-1];if(w){const p=dv.pairs.find(x=>x.id===w);return {p,text:p?pairName(p):'—'}}return {p:null,text:`победитель квалификации №${ref.n}`}}
  const m=dv.matches.find(x=>x.id===ref.m);if(!m)return {p:null,text:'—'};if(m.done&&m.winner){const side=ref.k==='w'?m.winner:(m.winner==='a'?'b':'a');if(m.bye&&side!==m.winner)return {p:null,text:'—'};return resolve(t,dv,m[side])}if(m.bye)return {p:null,text:'—'};
  return {p:null,text:`${ref.k==='w'?'победитель':'проигравший'}: ${m.label.toLowerCase()} · матч ${m.num}`}}
function dayList(t){const n=daysBetween(t.start,t.end);const out=[];for(let i=0;i<n;i++)out.push({i:i+1,iso:addDays(t.start,i)});return out}
function courtList(t){const out=[];for(let c=1;c<=(+t.courts||0);c++)out.push({n:c,v:1,c,name:`Корт ${c}`});return out}
const SLOTS=['10:00','11:30','13:00','14:30','16:00','17:30','19:00'];
function autoTime(t,dv,stage){const days=dayList(t),courts=courtList(t);if(!courts.length)return toast('Сначала укажите число кортов в настройках');const ms=dv.matches.filter(m=>m.stage===stage&&!m.done&&!m.bye);
  const startDay=stage==='main'&&hasQual(t,dv)?Math.min(2,days.length):1;let cur={d:startDay,s:0,c:0};const brOrder={U:0,L:1,T:2,T5:3};
  const groups={};ms.forEach(m=>{const k=m.r+'-'+brOrder[m.br];(groups[k]=groups[k]||[]).push(m)});
  Object.keys(groups).sort((a,b)=>{const [ra,ba]=a.split('-').map(Number),[rb,bb]=b.split('-').map(Number);return ra-rb||ba-bb}).forEach(k=>{if(cur.c!==0){cur.c=0;cur.s++}
    groups[k].forEach(m=>{if(cur.s>=SLOTS.length){cur.s=0;cur.d=Math.min(days.length,cur.d+1)}m.court=courts[cur.c].n;m.day=cur.d;m.time=SLOTS[cur.s];m.tm='at';cur.c++;if(cur.c>=courts.length){cur.c=0;cur.s++}})});
  toast(`Расставлено: ${ms.length} ${plural(ms.length,'матч','матча','матчей')}`)}
function judgeOptions(t){const all=[...JUDGES_FPR,...t.judgesLocal].filter(j=>t.judges.includes(j.id));return [['','судья —'],...all.map(j=>[j.id,j.n.split(' ').slice(0,2).join(' ')])]}
function scoreStr(m,side){if(!m.done)return '';return m.sets.map(s=>s[side==='a'?0:1]).join(' ')}
function matchCard(t,dv,m,opts={}){const A=resolve(t,dv,m.a),B=resolve(t,dv,m.b);const ready=A.p&&B.p;const days=dayList(t),courts=courtList(t);const locked=opts.locked;

  return `<div class="mc ${m.done?'done':''}" data-m="${m.id}"><div class="h"><span class="dr">⠿</span>${esc(m.label)} · матч ${m.num}<span class="st ${m.done?'ok':''}">${m.done?'сыгран'+finTxt:ready?'не сыгран':'ждёт соперников'}</span></div>
  <div class="p"><span class="t ${A.p?'':'ph'} ${cls('a')}">${esc(A.text)}</span><span class="sc"><b>${scoreStr(m,'a')}</b></span><span class="t ${B.p?'':'ph'} ${cls('b')}">${esc(B.text)}</span><span class="sc"><b>${scoreStr(m,'b')}</b></span></div>

function scoreEditor(t,dv,m){const A=resolve(t,dv,m.a),B=resolve(t,dv,m.b);const rules=rulesFor(t,dv,m.stage);const maxSets=2*(+rules.sets)-1;const sets=[];for(let i=0;i<maxSets;i++)sets.push(m.sets[i]||['','']);

function stagePlay(t,dv,stage){if(stage==='qual'&&!hasQual(t,dv))return stageHead('Квалификация','не нужна',`<span class="hint">в дивизионе «${esc(dv.name)}» квалификации нет</span>`,`<button class="btn go" data-act="finish-stage" data-s="qual" ${playReady(T(),'qual')?'':'disabled'}>Завершить квалификацию →</button>`)+`<div class="empty">Квалификация в этом дивизионе не проводится</div>`;
  const ms=dv.matches.filter(m=>m.stage===stage&&!m.bye);const done=ms.filter(m=>m.done).length;const all=ms.length&&done===ms.length;const finished=stage==='qual'?dv.qualDone:dv.mainDone;
  const view=DB.ui.view[stage]||'sched';const days=dayList(t);const firstDay=(ms.filter(m=>m.day).sort((a,b)=>a.day-b.day)[0]||{}).day;const day=DB.ui.day[stage]||firstDay||1;const courts=courtList(t);const todayMs=ms.filter(m=>m.day===day).length;
  const title=stage==='qual'?'Квалификация':'Основной турнир';
  const ready=playReady(T(),stage);const hd=stageHead(title,finished?(stage==='qual'?'завершена':'завершён'):'идёт','',finished?'':`<button class="btn go" data-act="finish-stage" data-s="${stage}" ${ready?'':'disabled'} title="${ready?'':'Введите счёт всех матчей во всех дивизионах'}">${stage==='qual'?'Завершить квалификацию →':'Завершить турнир →'}</button>`);
  const ft='';
  const tb=`<div class="tb" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px"><span class="seg lg"><button class="${view==='sched'?'on':''}" data-act="view" data-s="${stage}" data-v="sched">Расписание</button><button class="${view==='brk'?'on':''}" data-act="view" data-s="${stage}" data-v="brk">Сетка</button></span>${!finished&&view==='sched'?`<button class="btn" data-act="autotime" data-s="${stage}">${ICO.bolt} Расставить время автоматом</button>`:''}
<span class="sp"></span><input class="in search" placeholder="Найти по фамилии" data-search="mc"></div>`;
  const daysRow=`<div class="divsw" style="margin:0 0 14px"><span class="lbl">День</span><span class="days">${days.map(d=>`<button class="${d.i===day?'on':''}" data-act="day" data-s="${stage}" data-d="${d.i}"><b>${d.i}-й</b><span>${fmtD(d.iso).toUpperCase()}</span></button>`).join('')}</span></div>`;
  let body='';
  if(view==='sched'){const noSched=ms.filter(m=>!m.court||!m.day);const byTime=(a,b)=>(a.time||'99').localeCompare(b.time||'99');
    body=daysRow+`<div class="courts3" style="--nc:${Math.max(1,courts.length)}">${courts.map(c=>{const list=ms.filter(m=>m.court===c.n&&m.day===day).sort(byTime);return `<div><div class="ch">${c.name.toUpperCase()}<span>${list.length?list.length+' '+plural(list.length,'матч','матча','матчей'):''}</span></div>${list.map(m=>matchCard(t,dv,m,{locked:finished})).join('')||'<div class="emptyc">В этот день матчей на корте нет</div>'}</div>`}).join('')||'<div class="empty">Укажите число кортов в настройках турнира</div>'}</div>

  else body=bracketView(t,dv,stage,ms);
  return hd+tb+body+ft}
function bracketView(t,dv,stage,ms){ms=dv.matches.filter(m=>m.stage===stage);const H0=104;
  const box=m=>{const A=resolve(t,dv,m.a),B=resolve(t,dv,m.b);const l=(x,side)=>`<div class="l ${x.p?'':'ph'} ${m.done&&!m.bye?(m.winner===side?'w':'lo'):''}"><span class="nm">${esc(x.text)}</span><span>${scoreStr(m,side)}</span></div>`;
    return `<div class="bm ${m.done?'done':''} ${m.bye?'bye':''}"><div class="k">МАТЧ ${m.num}${m.bye?' · без игры':m.court?` · корт ${m.court}${m.day?', день '+m.day:''}${m.time?' '+m.time:''}`:''}</div>${l(A,'a')}${l(B,'b')}</div>`};
  const col=(list,r)=>`<div class="bcol"><div class="rh">${esc(list[0].label)}</div>${list.map(m=>`<div class="bslot" style="height:${H0*Math.pow(2,r)}px">${box(m)}</div>`).join('')}</div>`;
  const rows=(br)=>{const g={};ms.filter(m=>br.includes(m.br)).forEach(m=>(g[m.r]=g[m.r]||[]).push(m));return Object.keys(g).sort((a,b)=>a-b).map((r,i)=>col(g[r],i))};
  const U=rows(['U']),Tm=ms.filter(m=>m.br==='T'),L=rows(['L','T5']);
  return `<div class="panel"><div class="brk">${stage==='main'&&L.length?'<h4>Верхняя сетка</h4>':''}<div class="brow">${U.join('')}${Tm.length?col(Tm,U.length-1):''}</div>${L.length?`<h4>Нижняя сетка</h4><div class="brow">${L.join('')}</div>`:''}</div></div>`}
function rulesFor(t,dv,stage){const src=(!t.sameDivs&&t.rulesDiv&&dv&&t.rulesDiv[dv.code])||t;if(src.sameRules)return src.rules;const k=stage==='qual'?'qual':'fin';return src.rulesPer[k]||src.rules}
function setsWinner(sets,rules){let a=0,b=0;sets.forEach(s=>{if(s[0]==null||s[1]==null||(s[0]===''||s[1]===''))return;if(+s[0]>+s[1])a++;else if(+s[1]>+s[0])b++});if(a>=+rules.sets)return 'a';if(b>=+rules.sets)return 'b';return null}
function modalScore(t,dv,m){const A=resolve(t,dv,m.a),B=resolve(t,dv,m.b);const rules=rulesFor(t,dv,m.stage);const maxSets=2*(+rules.sets)-1;const sets=[];for(let i=0;i<maxSets;i++)sets.push(m.sets[i]||['','']);

  <span class="who">${esc(A.text)}</span>${sets.map((s,i)=>`<input type="number" min="0" max="${i===maxSets-1&&rules.dec==='stb'?30:+rules.games+1}" data-set="${i}" data-side="0" value="${s[0]}">`).join('')}
  <span class="who">${esc(B.text)}</span>${sets.map((s,i)=>`<input type="number" min="0" max="${i===maxSets-1&&rules.dec==='stb'?30:+rules.games+1}" data-set="${i}" data-side="1" value="${s[1]}">`).join('')}</div>
  <div class="grid2">${field('Завершение',sel('',[['normal','обычное завершение'],['retire','отказ, снятие пары'],['wo','неявка']],m.fin,'id="sfin"'))}${field('Победитель',sel('',[['','по счёту'],['a',A.text],['b',B.text]],m.fin==='normal'?'':m.winner,'id="swin"'))}</div>

function readSets(){const inputs=[...document.querySelectorAll('#sets input')];const sets={};inputs.forEach(i=>{const k=+i.dataset.set;(sets[k]=sets[k]||['',''])[+i.dataset.side]=i.value===''?'':+i.value});return Object.keys(sets).sort().map(k=>sets[k]).filter(s=>s[0]!==''||s[1]!=='')}
function updWinLine(){const t=T(),dv=D(t);const mid=document.querySelector('[data-act="score-save"]')?.dataset.m;const m=dv.matches.find(x=>x.id===mid);if(!m)return;const rules=rulesFor(t,dv,m.stage);const sets=readSets();const fin=document.getElementById('sfin').value;const force=document.getElementById('swin').value;
  const w=force||setsWinner(sets,rules);const A=resolve(t,dv,m.a),B=resolve(t,dv,m.b);document.getElementById('wline').innerHTML=w?`Победитель: <b>${esc(w==='a'?A.text:B.text)}</b>${fin!=='normal'?' · '+({retire:'отказ соперника',wo:'неявка соперника'})[fin]:''}`:`Счёт не определяет победителя: нужно ${rules.sets} ${plural(+rules.sets,'выигранный сет','выигранных сета','выигранных сетов')}`;
  document.querySelectorAll('#sets input').forEach(i=>{const s=sets[+i.dataset.set];i.classList.toggle('ok',!!(s&&s[0]!==''&&s[1]!==''&&+s[+i.dataset.side]>+s[1-i.dataset.side]))})}
function saveScore(t,dv,m){const rules=rulesFor(t,dv,m.stage);const sets=readSets();const fin=document.getElementById('sfin').value;const force=document.getElementById('swin').value;const w=force||setsWinner(sets,rules);if(!w){toast('Счёт не определяет победителя');return false}

function finishStage(t,dv,stage){if(stage==='qual'){const last=Math.max(...dv.matches.filter(m=>m.stage==='qual').map(m=>m.r));dv.qualWinners=dv.matches.filter(m=>m.stage==='qual'&&m.r===last).sort((a,b)=>a.i-b.i).map(m=>{const r=resolve(t,dv,m[m.winner]);return r.p?r.p.id:null});dv.qualDone=true}else dv.mainDone=true}

function randScore(m){const a=Math.random()<.5;const set=()=>{const l=Math.floor(Math.random()*5);return Math.random()<.5?[6,l]:[l,6]};const s1=set(),s2=set();const w1=s1[0]>s1[1]?'a':'b',w2=s2[0]>s2[1]?'a':'b';const sets=[s1,s2];let w=w1===w2?w1:null;if(!w){const st=Math.random()<.5?[10,Math.floor(Math.random()*9)]:[Math.floor(Math.random()*9),10];sets.push(st);w=st[0]>st[1]?'a':'b'}m.sets=sets;m.winner=w;m.done=true;m.fin='normal'}
function fastForward(t,dv,state){const order=['closed','drawq','drawm','qual','main','done'];const i=order.indexOf(state);if(state==='apps'){dv.apps='open';dv.synced='сегодня 12:40';return}if(i<0)return;
  dv.apps='done';if(i<1)return;
  if(hasQual(t,dv)){const pool=drawPool(t,dv,'q').sort(()=>Math.random()-.5);dv.drawQ.slots=pool;fixDraw(t,dv,'q')}if(i<2)return;
  {const pool=drawPool(t,dv,'m').sort(()=>Math.random()-.5);dv.drawM.slots=pool;fixDraw(t,dv,'m')}if(i<3)return;
  if(hasQual(t,dv)){autoTime(t,dv,'qual');const qs=dv.matches.filter(m=>m.stage==='qual');const half=i===3?Math.ceil(qs.length/2):qs.length;qs.sort((a,b)=>a.r-b.r).slice(0,half).forEach(m=>randScore(m));if(i>3)finishStage(t,dv,'qual')}if(i<4)return;
  autoTime(t,dv,'main');const ms=dv.matches.filter(m=>m.stage==='main').sort((a,b)=>a.r-b.r||({U:0,L:1,T:2,T5:3})[a.br]-({U:0,L:1,T:2,T5:3})[b.br]);const n=i===4?Math.floor(ms.length*0.4):ms.length;ms.slice(0,n).forEach(m=>{if(resolve(t,dv,m.a).p&&resolve(t,dv,m.b).p)randScore(m)});if(i>=5)dv.mainDone=true}
