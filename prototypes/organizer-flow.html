<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет организатора · единый путь турнира</title>
<link rel="icon" href="../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* нейтральная палитра кабинета; лайм — бренд-цвет логотипа padel.select */
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#f3f4f6;--border:#e5e7eb;--border-strong:#d1d5db;
  --ink:#111827;--soft:#4b5563;--muted:#6b7280;--faint:#9ca3af;
  --accent:#82eb00;--accent-ink:#0b1b06;--accent-soft:#ecfad6;--accent-line:#4f9a00;--accent-text:#3f7d00;
  --black:#111111;--black-ink:#ffffff;--display:"Inter Tight","Inter",system-ui,sans-serif;
  --path:#111827;
  --warn:#92400e;--warn-bg:#fef3c7;--err:#b91c1c;--err-bg:#fee2e2;--hint:#1e40af;--hint-bg:#dbeafe;
  --r:8px;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* ---- shell ---- */
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
/* Логотип «Табло»: мяч вместо точки, SELECT на наклонной плашке в акценте скина; правило — assets/tokens.css */
.logo{font-family:var(--display);font-style:italic;font-weight:900;letter-spacing:.02em;white-space:nowrap;text-decoration:none;font-size:17px;color:var(--ink);--logo-plate:var(--accent);--logo-on:var(--accent-ink);--logo-dot:var(--ink)}
.logo .b{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--logo-dot,currentColor);margin:0 .12em 0 .08em;overflow:hidden;text-indent:1em}
.logo em{display:inline-block;position:relative;z-index:0;font-style:italic;color:var(--logo-on);padding:.11em .3em .09em .25em;line-height:1}
.logo em::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--logo-plate);transform:skewX(-12deg);border-radius:.08em}
.pillchip{background:var(--surface-2);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600}
.acct{margin-left:auto}
.avbtn{width:36px;height:36px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 0 transparent;transition:box-shadow .15s}
.avbtn:hover,.acct.open .avbtn{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--border-strong)}
.acct .dd{top:46px;min-width:240px;padding:6px}
.acct .ddh{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.acct .ddh b{display:block;font-size:13.5px}
.acct .ddh span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.acct .dd a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none}
.acct .dd a svg{width:16px;height:16px;color:var(--muted);flex:none}
.acct .dd a:hover{background:var(--surface-2)}
.acct .dd a.cur{font-weight:600;background:var(--surface-2)}
.acct .dd hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.topbar .user:hover{background:var(--surface-2)}
.topbar .user i{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.topbar .user small{color:var(--muted);font-weight:500;font-size:12.5px}
.topbar .out{color:var(--muted);font-weight:500;font-size:13px;text-decoration:none;padding:8px 4px}
.topbar .out:hover{color:var(--ink)}
.shell{display:grid;grid-template-columns:208px 1fr;min-height:calc(100vh - 56px)}
.sidenav{background:var(--surface);border-right:1px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-weight:500;font-size:14px;position:sticky;top:56px;height:calc(100vh - 56px)}
.sidenav a{color:var(--muted);text-decoration:none;white-space:nowrap;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px;position:relative}
.sidenav a svg{width:18px;height:18px;flex:none}
.sidenav a:hover{background:var(--surface-2);color:var(--ink)}
.sidenav a.cur{font-weight:600;background:var(--surface-2);color:var(--ink)}
.sidenav a.cur::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sidenav a.cur svg{color:var(--accent-line)}
.sidenav .reset{margin-top:auto;font-size:12px;color:var(--faint);padding:9px 10px}
.page{padding:20px 24px 60px;min-width:0;max-width:1736px}/* контент кабинета: ширина как на экране 1920 (1920 − меню 184 − отступы), шире не растягивается */
/* ---- page header ---- */
.crumbs{color:var(--muted);font-size:13px;margin-bottom:4px}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
.ph .tt{min-width:0;flex:1}
.ph h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph .meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.ph .meta i{font-style:normal;color:var(--faint)}
.ph .act{display:flex;gap:8px;align-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.3;vertical-align:middle}
.pill.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink);opacity:.6}
.pill.done{color:var(--muted)}
.pill.draft{color:var(--muted);border-style:dashed}
/* ---- stage bar (steps of wizard and stages of tournament are one component) ---- */
.steps{display:flex;gap:8px;list-style:none;margin:0 0 14px;padding:0;flex-wrap:wrap;align-items:center}
.steps li,.steps a{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 10px;min-height:36px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--border);text-decoration:none;white-space:nowrap}
.steps b{width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.steps .done{color:var(--ink)}
.steps .done b{background:var(--accent-soft);color:var(--accent-line)}
.steps .cur{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.steps .view{border-color:var(--black);color:var(--ink);box-shadow:inset 0 0 0 1px var(--black)}
.steps .view b{background:var(--black);color:#fff}
.steps .cur b{background:var(--accent);color:var(--accent-ink)}
.steps .lock{opacity:.55;cursor:not-allowed}
.steps .skip{opacity:.45;border-style:dashed}
.steps .sep{color:var(--faint);font-size:12px;padding:0 2px}
.steps .lbl{display:flex;flex-direction:column;line-height:1.15;font-size:13px}
.steps .lbl small{font-size:11px;font-weight:500;opacity:.7;margin-top:2px}
.steps .right{margin-left:auto;display:flex;gap:8px}
/* ---- status band: one per stage, holds substatus and the single green action ---- */
.band{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:14px}
.band .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.band.live .dot{background:var(--accent)}
.band.done .dot{background:var(--ink)}
.band.warn .dot{background:#f59e0b}
.band .txt{min-width:0;flex:1;line-height:1.35}
.band .txt b{font-size:14px;display:flex;align-items:center;gap:8px}
.band .txt span{font-size:12.5px;color:var(--muted)}
.band .acts{display:flex;gap:8px;flex:none;align-items:center}
.band-h{display:flex;align-items:center;gap:14px;padding:12px 16px}
.band-h b{font-size:14px;display:flex;align-items:center;gap:8px;flex:1}
.band-h .acts{display:flex;gap:8px;align-items:center}
.band-b{padding:0 16px 14px}
.dtabs{display:flex;gap:4px;margin:4px 0 0;padding:0 12px;position:relative;z-index:1}
.dtabs button{border:1px solid var(--border);border-bottom:0;background:var(--surface-2);color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:0 16px;height:36px;border-radius:8px 8px 0 0;cursor:pointer;margin-bottom:-1px}
.dtabs button:hover{color:var(--ink)}
.dtabs button.on{background:var(--surface);color:var(--ink);height:38px;margin-bottom:-2px;position:relative}
.dtabs+.panel,.dtabs+.dcols>.panel{border-top-left-radius:0}
.sh2{display:flex;align-items:center;gap:12px;margin:4px 0 12px;min-height:32px}
.sh2 h2{margin:0;font-size:16px;font-weight:700}
.sh2 h2 .st{color:var(--muted);font-weight:500;margin-left:8px}
.sh2 .r{margin-left:auto;display:flex;gap:8px;align-items:center}
/* ---- buttons ---- */
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 16px;height:36px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.btn.primary:hover{background:#000}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go:hover{background:#76d800}
.btn.danger{color:var(--err);border-color:var(--err-bg);background:var(--surface)}
.btn.danger:hover{background:var(--err-bg)}
.btn.ghost{border-color:transparent;background:transparent;font-weight:600}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:6px}
.btn.xs{height:24px;padding:0 8px;font-size:11px;border-radius:5px;font-weight:600}
.btn.ic{width:30px;padding:0;justify-content:center}
.btn.trash{color:var(--muted)}
.btn.trash:hover{color:var(--err);border-color:var(--err-bg);background:var(--err-bg)}
.btn:disabled,.btn.dis{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn svg{width:14px;height:14px;flex:none}
/* ---- panels & forms ---- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);min-height:48px}
.panel-h h3{margin:0;font-size:14px;font-weight:700}
.panel-h .hint{color:var(--muted);font-size:12.5px;font-weight:400}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.panel.flat .panel-b{padding:0}
.panel.locked .panel-h h3::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-1px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%236b7280" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>') no-repeat center/contain}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.field>label i{color:var(--err);font-style:normal}
.field .hint{font-size:12px;color:var(--muted)}
.dn{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);max-width:640px}
.field.locked .in,.field.locked .sel{color:var(--muted);background:var(--surface);border-style:dashed}
.panel-h h3 .q,.sh h3 .q{margin-left:8px;vertical-align:2px;font-weight:700}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:700;cursor:help;position:relative;white-space:normal;letter-spacing:0;text-transform:none;flex:none}
.q:hover{background:var(--ink);color:#fff}
.q::after{content:attr(data-t);position:absolute;left:-10px;top:24px;background:var(--surface);color:var(--ink);border:1px solid var(--border);box-shadow:0 10px 30px rgba(17,24,39,.14);font-weight:400;font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:8px;width:max-content;max-width:340px;text-align:left;z-index:40;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .12s,transform .12s}
.q::before{content:"";position:absolute;left:3px;top:17px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg) translateY(-4px);z-index:41;opacity:0;pointer-events:none;transition:opacity .12s}
.q:hover::after,.q:hover::before{opacity:1;transform:none}
.q:hover::before{transform:rotate(45deg)}
.r .q::after,.tt .q::after,.taside .q::after{left:auto;right:-10px}
.r .q::before,.tt .q::before{left:auto;right:3px}
.in,.sel,.ta{width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--ink);font-weight:500}
.ta{height:auto;min-height:72px;padding:9px 11px;resize:vertical;font-weight:400}
.in::placeholder,.ta::placeholder{color:var(--faint);font-weight:400}
.in.mono{font-family:var(--mono);font-size:13px}
.sel{appearance:auto}
.num{width:84px;text-align:center;font-variant-numeric:tabular-nums}
/* ширина поля по объёму данных: даты, числа и селекты не растягиваются, во всю строку только текст */
.grid2,.grid3,.grid4{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start}
:where(.grid2,.grid3,.grid4)>.field{flex:1 1 260px;max-width:440px}
/* flex-basis только внутри рядов полей: в колонках (модалки) он стал бы высотой */
:where(.grid2,.grid3,.grid4)>.field:has(>input[type="date"]),:where(.grid2,.grid3,.grid4)>.field:has(>.inl>input[type="date"]){flex:0 0 190px}
:where(.grid2,.grid3,.grid4)>.field:has(>input[type="datetime-local"]){flex:0 0 250px}
:where(.grid2,.grid3,.grid4)>.field:has(>input[type="number"]){flex:0 0 auto}
:where(.grid2,.grid3,.grid4)>.field:has(>select){flex:0 0 280px}
:where(.grid2,.grid3,.grid4)>.field:has(>label+.btn),:where(.grid2,.grid3,.grid4)>.field:has(>.inl>select){flex:0 0 auto}
.field:has(>input[type="date"]),.field:has(>.inl>input[type="date"]){max-width:190px}
.field:has(>input[type="datetime-local"]){max-width:250px}
.field:has(>input[type="number"]){max-width:none}
.field:has(>input[type="number"])>.in{width:150px}
.field>label{white-space:nowrap}
.field:has(>select){max-width:280px}
.field:has(>label+.btn),.field:has(>.inl>select){max-width:none}
.field:has(>.inl>select) .sel{width:260px}
.field:has(>input.num){max-width:150px}
.inl{display:flex;gap:8px;align-items:center}
.inl .in{flex:1}
.wizwrap{max-width:1040px}
.wizwrap.wide{max-width:1400px}/* шаг «Тип турнира»: три карточки этапов со схемами, при необходимости сужается */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip.ok{background:var(--accent-soft);color:var(--accent-line)}
button.chip{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
button.chip:hover{background:var(--border)}
.chip.on{background:var(--black);color:var(--black-ink)}
.chip.on.bad{background:var(--err);color:#fff}
.chip.bad{background:var(--err-bg);color:var(--err)}
.chip.x{border:1px solid var(--border);background:var(--surface)}
.chip.x button{border:0;background:transparent;color:var(--muted);padding:0;font-size:14px;line-height:1}
.chip.add{border:1px dashed var(--border-strong);background:transparent;color:var(--muted);cursor:pointer}
.toggle{position:relative;width:38px;height:22px;flex:none;border-radius:999px;background:var(--border-strong);border:0;transition:background .15s;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:19px}
.toggle:disabled{opacity:.4;cursor:not-allowed}
.trow{display:flex;align-items:center;gap:10px}
.trow b{font-size:13px;font-weight:600;white-space:nowrap}
.trow span{color:var(--muted);font-size:12px}
.vrow{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:6px;padding:8px 12px}
.vrow .b{width:28px;height:28px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.vrow .t{flex:1;min-width:0}
.vrow .t b{display:block;font-size:13px}
.vrow .t span{font-size:12px;color:var(--muted)}
.cnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cnames .cn{display:flex;align-items:center;gap:8px}
.cnames .cn span{flex-shrink:0;width:22px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.vrow .courts{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.vrow .courts input{width:56px;height:30px;text-align:center;font-weight:600;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.alert{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;font-size:12.5px;flex-wrap:wrap}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.hint{background:var(--hint-bg);color:var(--hint)}
.alert .fix{margin-left:auto;display:flex;gap:6px}
.alert .fix button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;color:inherit}
/* ---- wizard footer ---- */
.wizfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 0;margin-top:6px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border)}
.wizfoot .sp{flex:1;color:var(--err);font-size:13px}
/* ---- stage cards (type step) ---- */
.stages{display:grid;grid-template-columns:1fr 48px 1fr 184px 1fr;gap:0;align-items:stretch}
.arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:0 10px}
.arrow svg{width:28px;height:14px}
.arrow.off{opacity:.35;pointer-events:none}
.arrow.plain{padding:0}
/* переход из групп в финал. Между карточками этапов — карточка «Кто с кем»: сразу видны схема и пары первого тура,
   кнопка не нужна, чтобы понять, что там настроено. Линия со стрелкой за карточкой — поток «группы → финал» */
.arrow.link{position:relative;padding:0 12px}
.arrow.link::before{content:"";position:absolute;left:0;right:3px;top:50%;border-top:1.5px solid var(--border-strong)}
.arrow.link::after{content:"";position:absolute;right:2px;top:50%;width:7px;height:7px;margin-top:-4px;border-top:1.5px solid var(--border-strong);border-right:1.5px solid var(--border-strong);transform:rotate(45deg)}
.lk-card{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:12px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.lk-card:hover{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.lk-card.ro{cursor:default}
.lk-card.ro:hover{border-color:var(--border-strong);box-shadow:none}
.lk-card .t{font-size:13px;font-weight:700;line-height:1.3}
.lk-card .s{font-size:12px;color:var(--muted);line-height:1.35}
.lk-card .sch{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-top:2px}
.lk-card .ps{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:12.5px;font-weight:500}
.lk-card .ps .more{font-family:var(--sans);font-size:12px;color:var(--muted)}
.lk-card .go{margin-top:4px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);border-radius:6px;font-size:12.5px;font-weight:700;background:var(--surface)}
.lk-card:hover .go{border-color:var(--ink)}
/* окно «Кто с кем»: слева доступные схемы карточками, справа сетка финального этапа с выбором пар */
.lk-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.lk-schemes{display:flex;flex-direction:column;gap:8px}
.lk-cap{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 2px}
.lk-scheme{display:grid;grid-template-columns:60px 1fr;column-gap:12px;row-gap:3px;align-items:start;width:100%;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:12px;color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
.lk-scheme svg{grid-row:1/span 4;width:60px;height:44px;color:var(--muted)}
.lk-scheme:hover:not(:disabled){border-color:var(--ink)}
.lk-scheme.on{border-color:var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line);background:#fbfef6}
.lk-scheme.on svg{color:var(--accent-line)}
.lk-scheme:disabled{cursor:not-allowed;background:var(--surface-2)}
.lk-scheme:disabled svg,.lk-scheme:disabled .st,.lk-scheme:disabled .ex{opacity:.5}
.lk-scheme .st{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.lk-scheme .rd{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);flex:none}
.lk-scheme.on .rd{border:5px solid var(--accent-line)}
.lk-scheme .ex{font-family:var(--mono);font-size:12px}
.lk-scheme .why{font-size:12.5px;color:var(--muted);line-height:1.4}
.lk-scheme .no{font-size:12px;color:var(--warn);line-height:1.4}
.lk-panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.lk-panel .bt{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.lk-panel .bt b{font-size:14px}
.lk-wrap{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:12px 14px;overflow:auto}
.lk-br{position:relative}
.lk-br svg{position:absolute;left:0;top:0;overflow:visible}
.lk-br svg path{fill:none;stroke:var(--border-strong);stroke-width:1.5}
.lk-h{position:absolute;top:0;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.lk-h.cur{color:var(--ink)}
.lk-m{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lk-m.same{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.lk-m .r{height:30px;display:flex;align-items:center;gap:8px;padding:0 6px 0 7px;min-width:0}
.lk-m .r+.r{border-top:1px solid var(--border)}
.lk-m .r .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-m.nx .r{display:block;line-height:30px;padding:0 9px;font-family:var(--mono);font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-s{appearance:none;-webkit-appearance:none;flex:none;min-width:56px;height:24px;border:1px solid var(--border-strong);border-radius:6px;padding:0 20px 0 7px;background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%236b7280" stroke-width="1.6"/></svg>') no-repeat right 6px center/9px 6px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.lk-s:hover{border-color:var(--ink)}
@media (max-width:900px){.lk-grid{grid-template-columns:1fr}}
.arrow .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.arrow .sel{height:32px;font-size:12.5px;padding:0 8px;font-weight:600;width:100%}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:300px}
.scard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scard.off{opacity:.65}
.scard.off .sbody{pointer-events:none}
.scard .shead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.scard .shead .k{font-size:11px;color:var(--muted);font-weight:600}
.scard .shead .n{font-weight:700;font-size:14px}
.scard .sbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.scard .sfoot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:500}
.scard .sfoot b{color:var(--ink);font-size:13px}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px;font-weight:600}
.prow .sel,.prow .in{width:auto;height:32px}
.tview{display:flex;flex-direction:column;gap:8px}
.tview .tt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tview .tt b{font-size:14px}
.tview .tt .code{font-family:var(--mono);font-size:11px;color:var(--accent-line);margin-left:4px}
.tview .tt .q{margin-left:8px;vertical-align:1px}
.tview .tt .nw{white-space:nowrap}
.tview p{margin:0;color:var(--muted);font-size:12.5px}
.anim{background:var(--surface-2);border-radius:6px;border:1px solid var(--border);aspect-ratio:1.5;display:block;overflow:hidden}
.anim svg{width:100%;height:100%;display:block}
/* выбор типа финального этапа: два ряда по четыре карточки, на узком экране — по две.
   Карточки сжаты, чтобы оба ряда помещались на экране ноутбука 13–14" */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:1000px){.types{grid-template-columns:repeat(2,1fr)}}
.tcard{border:1px solid var(--border);border-radius:10px;padding:12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;cursor:pointer;font:inherit}
.tcard .anim{aspect-ratio:1.8}
.tcard:hover{border-color:var(--border-strong)}
.tcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard.dis{cursor:default}
.tcard.dis:hover{border-color:var(--border)}
.tcard.dis b,.tcard.dis p{color:var(--muted)}
.tcard.dis .anim{opacity:.6}
.tcard .codes{display:flex;gap:6px;align-items:center;position:absolute;top:-10px;left:12px}/* «выбран» — на рамке карточки, не занимает строку */
.tcard .code{display:inline-block;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:11px;font-weight:600}
.tcard .selp{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.tcard b{font-size:14px;line-height:1.25}
.tcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.tcard .pts{margin:0;padding-left:16px;color:var(--muted);font-size:12px;line-height:1.35;display:flex;flex-direction:column;gap:2px}
.tcard .pts li::marker{color:var(--accent-line)}
.tcard .soon{color:#e0655a;font-weight:700;font-size:13px;margin-top:auto}
.sheet.wide{max-width:1140px}
.sheet.wide:has(.types){max-width:1360px;max-height:calc(100vh - 24px)}
.sheet.wide:has(.types) .sh{padding:10px 16px}
.sheet.wide:has(.types) .sb{padding:12px 16px}
.modal:has(.types){padding:12px}
.n{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2}
.n.bye{stroke-dasharray:2 2;fill:transparent}
.n.in{fill:var(--accent-soft);stroke:var(--accent-line)}
.ln{fill:none;stroke:var(--border-strong);stroke-width:1.1}
.ln.dash{stroke-dasharray:3 3;stroke:var(--accent-line)}
.pth{fill:none;stroke:var(--path);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pn{fill:var(--accent);stroke:var(--path);stroke-width:1.5}
.lab{font-size:10px;fill:var(--muted);font-family:var(--sans);font-weight:600}
.lab.big{font-size:11px;fill:var(--ink)}
.cap{font-size:11px;fill:var(--ink);font-family:var(--sans);font-weight:600}
.box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2;rx:5}
.pl{font-size:10px;fill:var(--ink);font-family:var(--mono)}
.anim .pth{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 4s linear infinite}
@keyframes draw{0%{stroke-dashoffset:var(--len)}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:12px;border:1px solid var(--border);max-width:560px;width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.sheet .sh h3{margin:0;font-size:16px}
.sheet .sh .hint{color:var(--muted);font-size:12.5px}
.sheet .sh .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.sheet .sb{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .sf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);align-items:center}
.sheet .sf .sp{flex:1;font-size:12.5px;color:var(--muted)}
/* ---- tournament page grid with links aside ---- */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tmain{min-width:0}
.taside{position:sticky;top:64px}
.lkr{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);min-width:0}
.lkr:last-child{border-bottom:0}
.lkr .ic{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.lkr .ic svg{width:14px;height:14px}
.lkr .t{flex:1;min-width:0}
.lkr .t b{display:block;font-size:13px}
.lkr .t span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkr .a{display:flex;gap:4px;flex:none}
.taside .gh{padding:7px 14px;font-size:11px}
/* ---- public links module ---- */
.links{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.links .lh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.links .lh h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.links .lh .hint{color:var(--muted);font-size:12.5px}
.links .lh .r{margin-left:auto;display:flex;gap:8px}
.links .lb{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.lk{display:flex;align-items:center;gap:10px;padding:11px 16px;border-right:1px solid var(--border);min-width:0}
.lk:last-child{border-right:0}
.lk .ic{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.lk .ic svg{width:16px;height:16px}
.lk .t{flex:1;min-width:0}
.lk .t b{display:block;font-size:13px}
.lk .t span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk .a{display:flex;gap:4px;flex:none}
.links .courts{border-top:1px solid var(--border);padding:8px 16px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 24px}
.links .courts .cr{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.links .courts .cr b{font-size:12.5px}
.links .courts .cr span{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links .courts .cr .a{display:flex;gap:4px}
.links.collapsed .lb,.links.collapsed .courts{display:none}
/* ---- toolbar & row lists ---- */
.tb{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tb .sp{flex:1}
.tb .search{width:220px;height:32px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 10px;height:28px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.seg.lg button{height:34px;padding:0 14px;font-size:13px}
.seg.lg button.on{background:var(--black);color:var(--black-ink)}
.gh{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--surface-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border)}
.gh b{color:var(--ink)}
.gh .r{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0}
.row{display:grid;grid-template-columns:32px 1fr 70px auto auto 34px;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);font-size:14px;min-height:46px}
.row:last-child{border-bottom:0}
.row:hover{background:#fafafa}
.row .n{color:var(--faint);font-weight:600;font-size:12px;text-align:right}
.row .nm{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .nm b{font-weight:600}
.row .nm small{color:var(--muted);font-size:12px;font-weight:500}
.row .rt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.row .wcb{border:1px solid var(--border);border-radius:5px;padding:0 7px;height:24px;font-size:10px;font-weight:800;color:var(--faint);background:transparent}
.row .wcb.on{border-color:var(--accent-line);color:var(--accent-line);background:var(--accent-soft)}
.row.off{opacity:.5}
.row.off .nm b{text-decoration:line-through}
.tag{display:inline-block;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800;letter-spacing:.02em}
.tag.wc{background:var(--accent-soft);color:var(--accent-line)}
.tag.q{background:var(--hint-bg);color:var(--hint)}
.tag.res{background:var(--surface-2);color:var(--muted)}
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:34px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(17,24,39,.12);min-width:200px;z-index:15;padding:4px;display:none}
.menu.open .dd{display:block}
.menu .dd button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:13px;font-weight:500}
.menu .dd button:hover{background:var(--surface-2)}
.menu .dd button.danger{color:var(--err)}
.empty{border:1px dashed var(--border-strong);border-radius:8px;padding:22px;text-align:center;color:var(--muted);font-size:13px}
/* ---- draw ---- */
.dcols{display:grid;grid-template-columns:420px 1fr;gap:14px;align-items:start}
.wp{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:600;cursor:pointer}
.wp:last-child{border-bottom:0}
.wp:hover{background:#fafafa}
.wp.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.wp .r{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.wp.ph{color:var(--hint);font-style:italic}
.slots{padding:12px 30px 12px 16px;display:grid;grid-template-columns:1fr;gap:8px}
.pair{position:relative;display:flex;flex-direction:column;gap:6px;padding-right:0;margin-bottom:6px}
.pair::after{content:"";position:absolute;right:-14px;top:18px;bottom:18px;width:12px;border:1px solid var(--border-strong);border-left:0;border-radius:0 6px 6px 0}
.pos{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px}
.pos .n{color:var(--faint);font-weight:700;text-align:right;font-size:12px}
.pos .s{border:1px solid var(--border);border-radius:6px;padding:0 12px;height:38px;font-size:13.5px;font-weight:600;color:var(--faint);background:var(--surface);display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.pos .s:hover{border-color:var(--border-strong)}
.pos .s.can{border-style:dashed;border-color:var(--accent-line);color:var(--accent-line)}
.pos .s.f{background:var(--surface-2);color:var(--ink);cursor:default}
.pos .s.f.ph{color:var(--hint);font-style:italic;background:var(--hint-bg)}
.pos .s .x{margin-left:auto;color:var(--muted);font-weight:400;border:0;background:transparent;font-size:16px;padding:0 2px;cursor:pointer}
.pos .s .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro .pos .s{cursor:default}
/* ---- schedule: корты вкладками по три, карточка «шапка · настройки · результат», счёт подтверждается галочкой ---- */
.sbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px}
.sfl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sfl .fnote{font-size:12.5px;color:var(--soft)}
.sfl .warn{color:var(--warn);font-weight:700}
.tlink{border:0;background:transparent;padding:0;color:var(--ink);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.seg button .n{margin-left:6px;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
.divh{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 8px}
/* вкладки кортов: «Корты 1–3 · Корты 4–6», справа «Без расписания» */
.ctabs{display:flex;gap:2px;margin:0 0 12px;border-bottom:1px solid var(--border)}
.ctabs button{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;background:transparent;font-size:14px;font-weight:700;color:var(--soft)}
.ctabs button:hover{color:var(--ink);background:var(--surface-2)}
.ctabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.ctabs button .n{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ctabs .lvd{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ctabs .bl{margin-left:auto}
.ctabs button.drop-on{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)}
/* три колонки всегда одной ширины: у корта во вкладке из одного корта карточка такая же */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;margin-bottom:12px}
.colh{display:flex;align-items:center;gap:8px;min-width:0;padding:11px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.colh b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colh span{margin-left:auto;flex:none;font-weight:600;letter-spacing:0;text-transform:none;color:var(--soft)}
.mc{container-type:inline-size;--grid:var(--border);display:flex;flex-direction:column;min-width:0;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);overflow:hidden}
.mc.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc.dirty{border-color:#d97706;box-shadow:0 0 0 1px #d97706}
.mc.dim{opacity:.35}
.mc.dim:hover,.mc.dim:focus-within{opacity:1}
/* 1. шапка: запуск, статус, меню; ниже — дивизион, круг, номер матча */
.mc .mh{padding:12px 10px 11px 14px;background:var(--surface);border-bottom:1px solid var(--grid)}
.mc .mh[draggable=true]{cursor:grab}
.mc .grip{flex:none;margin:-4px 0 -4px -6px;padding:2px 2px;font-size:15px;line-height:1;color:var(--muted);letter-spacing:-1px}
.mc .mh[draggable=true]:hover .grip{color:var(--ink)}
.dragging [data-dragnav],.dragging .colh[data-court]{outline:1px dashed var(--border-strong);outline-offset:-3px}
.colh.drop-on{outline:2px solid var(--ink)!important;outline-offset:-2px;background:var(--surface)}
[data-dragnav].nav-on{outline:2px solid var(--ink)!important;outline-offset:-2px;color:var(--ink)}
.mc .l1{display:flex;align-items:center;gap:8px;min-height:24px}
.mc .mn{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.mc .chp{margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;border:1px solid transparent;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--soft);white-space:nowrap}
.mc .chp.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);letter-spacing:.04em}
.mc .chp.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.mc .chp.bad{background:var(--err-bg);border-color:transparent;color:var(--err)}
.mc .mo{flex:none;width:30px;height:28px;margin:-2px 0;border:0;border-radius:6px;background:transparent;color:var(--soft);font-size:18px;line-height:1;font-weight:700}
.mc .mo:hover{background:var(--border);color:var(--ink)}
.mc .mh .st{margin-top:3px;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink)}
/* 2. настройки: корт, день, начало, судья */
.mc .mset{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--grid)}
/* корт, день, начало, время — одна группа с разделителями; ширина каждого поля по содержимому */
.mc .grp{display:inline-flex;align-items:stretch;max-width:100%;height:32px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);overflow:hidden}
.mc .grp>*{display:flex;align-items:center;min-width:0;height:100%;margin:0;padding:0 8px;border:0;border-radius:0;background:transparent;font-size:13px;font-weight:600;color:var(--ink);field-sizing:content}
.mc .grp>*+*{border-left:1px solid var(--border)}
.mc .grp select{padding-right:4px;cursor:pointer}
.mc .grp input[type=time]{font-family:var(--mono);font-size:12.5px;font-weight:500}
.mc .grp>*:hover{background:var(--surface-2)}
.mc .grp>*:focus{outline:0;background:var(--accent-soft)}
.mc .grp.ro{border-color:var(--border)}
.mc .grp.ro>*{font-weight:500;color:var(--soft)}
.mc .grp.ro>*:hover{background:transparent}
.mc .mset .tlink{margin-left:auto;font-size:12.5px}
/* 3. результат: «посев | игроки | сеты», подписи колонок сверху; черновик — жёлтым до галочки */
.mc .rh{display:flex;align-items:center;height:28px;padding-left:14px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--grid)}
.mc .rh .rc{margin-left:auto;display:flex}
.mc .rh .rc i{width:42px;font-style:normal;text-align:center}
.mc .pr{display:flex;align-items:stretch;min-height:52px}
.mc .pr+.pr{border-top:1px solid var(--grid)}
.mc .seed{flex:none;width:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--grid);font-size:12px;line-height:14px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.mc .seed i{font-style:normal;font-size:10px}
.mc .nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 8px 6px 10px;font-size:14px;line-height:18px;font-weight:500}
.mc .nm>span{overflow-wrap:anywhere}
.mc .nm .src{color:var(--soft);font-style:italic;font-size:13px}
.mc .pr.w .nm{font-weight:700}
.mc .pr.l .nm{color:var(--muted)}
.mc .sc{flex:none;display:flex}
.mc .sc>*{width:42px;flex:none;display:flex;align-items:center;justify-content:center;margin:0;padding:0;border:0;border-left:1px solid var(--grid);border-radius:0;background:transparent;font-family:var(--display);font-size:18px;font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.mc .sc .up{color:var(--ink)}
.mc .pr.l .sc .up{color:var(--soft)}
.mc .sc .si{cursor:text}
.mc .sc .si:hover:not(:disabled){background:var(--surface-2)}
.mc .sc .si.dr{background:var(--warn-bg);color:var(--ink)}
.mc .sc .si:focus{outline:0;background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent-line);color:var(--ink)}
.mc .sc .si:disabled{cursor:default}
.mc .sc .si::placeholder,.mc .sc .ns{color:var(--border-strong);font-weight:600;font-style:normal}
.mc .sc .rt{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--err)}
.mc .cf{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-top:1px solid #fcd34d;background:var(--warn-bg)}
.mc .cf .msg{flex:1;min-width:0;font-size:12.5px;line-height:1.35;color:var(--warn)}
.mc .cf .msg b{color:var(--ink)}
.mc .cf.bad{background:var(--err-bg);border-top-color:#fca5a5}
.mc .cf.bad .msg{color:var(--err)}
.mc .cf .btn.go svg{width:16px;height:16px}
/* перетаскивание: на карточку — поменять местами, в конец колонки — перенести, на «Без расписания» — снять */
.dragging .mc:not(.done){outline:1px dashed var(--border-strong);outline-offset:-1px}
.mc.drop-on{outline:2px solid var(--ink)!important;outline-offset:-2px!important}
.dropz{display:none;align-items:center;justify-content:center;min-height:56px;padding:8px;border:1px dashed var(--border-strong);border-radius:10px;color:var(--soft);font-size:12.5px;text-align:center}
.dropz.e,.dragging .dropz{display:flex}
.dropz.on{border:2px solid var(--ink);color:var(--ink);background:var(--surface)}
/* вид расписания: «Полный» (по умолчанию) — карточки, корты по три; «Компактный» — шесть кортов на экране, ввод в окне */
/* выпадающие списки внутри расписания: вид, день, статус */
.ddb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.ddb:hover,.ddb.open{background:var(--surface-2)}
.ddb .n{margin-left:-2px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ddb.on,.ddb.on:hover{background:var(--black);border-color:var(--black);color:var(--black-ink)}
.ddb.on .n{color:inherit;opacity:.6}
.ddb .cr{width:12px;height:12px;flex:none;opacity:.7;transition:transform .15s}
.ddb.open .cr{transform:rotate(180deg)}
.ddb>svg:not(.cr){width:15px;height:15px;flex:none;color:var(--soft)}
/* панель расписания в две строки: «Расписание | Сетка», под линией — списки и поиск расписания */
.sbar>.tb:last-child{border-bottom:0}
.pm.dm{min-width:220px}
.pm.dm button{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pm.dm .ck{flex:none;width:16px;display:flex;color:var(--accent-text)}
.pm.dm .ck svg{width:15px;height:15px}
.pm.dm .lb{display:inline-flex;align-items:center;gap:8px}
.pm.dm .lb svg{width:15px;height:15px;color:var(--soft)}
.pm.dm .n{margin-left:auto;padding-left:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pm.dm button.sel{font-weight:700}
.pm.dm button:focus-visible{outline:0;background:var(--surface-2)}
.pm.dm button:disabled{color:var(--muted);cursor:not-allowed}
.pm.dm button:disabled:hover{background:transparent}
/* компактный вид: ряд — запуск, слева номер запуска; колонок всегда шесть */
.cgrid{display:grid;grid-template-columns:22px repeat(6,minmax(0,1fr));gap:6px;align-items:stretch;margin-bottom:12px}
.cgrid.bl{grid-template-columns:repeat(6,minmax(0,1fr))}
.cgrid .colh{padding:8px 10px;font-size:12px}
.cgrid .colh span{font-size:12px}
.cgrid .ln{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.cgrid .dropz{min-height:44px;padding:6px;font-size:12px;border-radius:8px}
.mt{display:flex;flex-direction:column;min-width:0;padding:7px 9px 7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;user-select:none}
.mt:hover{border-color:var(--ink)}
.mt:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mt.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* сыгранный матч — серая плитка со светлой рамкой и приглушённой шапкой: это уже история.
   Несыгранные остаются белыми с тёмной рамкой — их ещё играть, взгляд цепляется за них */
.mt.done{background:var(--surface-2);border-color:var(--border)}
.mt.done .tm,.mt.done .tm small,.mt.done .sl{color:var(--muted);font-weight:500}
.mt.dirty{border-color:#d97706;box-shadow:0 0 0 1px #d97706}
.mt.dim{opacity:.35}
.mt.dim:hover,.mt.dim:focus-visible{opacity:1}
.mt .th{display:flex;align-items:center;gap:6px;min-width:0;height:18px}
.mt .tm{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.mt .tm small{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--soft)}
.mt .tm.nx{font-family:var(--sans);font-size:12px;color:var(--soft)}
.mt .ms{margin-left:auto;flex:none;display:inline-flex;align-items:center}
.mt .ms.live{height:17px;padding:0 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;letter-spacing:.05em}
.mt .ms.ok{color:var(--accent-text)}
.mt .ms.ok svg{width:14px;height:14px}
.mt .sl{margin:1px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;color:var(--soft)}
.mt .tp{display:flex;align-items:center;gap:6px;min-width:0;height:20px;font-size:13px;font-weight:500}
.mt .tp+.tp{border-top:1px solid var(--border)}
.mt .tp .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .tp.w{font-weight:700}
.mt .tp.l{color:var(--muted)}
/* пара ещё не определена; класс не .ph — тот занят шапкой страницы и добавлял отступ снизу */
.mt .tp.tbd .n{color:var(--soft);font-style:italic;font-size:12px}
.mt .tp .s{flex:none;display:flex}
.mt .tp .s i{width:15px;font-style:normal;text-align:center;font-family:var(--display);font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.mt .tp .s i.stb{width:20px}
.mt .tp .s i.up{color:var(--ink)}
.mt .tp.l .s i.up{color:var(--soft)}
.mt .tp .s i.dr{color:#b45309}
.mt .tp .s .rt{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--err)}
.dragging .mt:not(.done){outline:1px dashed var(--border-strong);outline-offset:-1px}
.mt.drop-on{outline:2px solid var(--ink)!important;outline-offset:-2px!important}
/* окно матча из компактного вида: та же карточка, крупнее ячейки счёта */
.sheet.mcw{max-width:620px}
.sheet.mcw .mc{border:0;border-radius:0;box-shadow:none;overflow:auto}
.sheet.mcw .mc .mh{padding:14px 12px 14px 20px}
.sheet.mcw .mc .mn{font-size:13px}
.sheet.mcw .mc .mh .st{margin-top:4px;font-size:17px;font-weight:700}
.sheet.mcw .mc .mx{flex:none;width:32px;height:30px;margin:-2px 0;border:0;border-radius:6px;background:transparent;color:var(--soft);font-size:22px;line-height:1}
.sheet.mcw .mc .mx:hover{background:var(--border);color:var(--ink)}
.sheet.mcw .mc .mset{padding:10px 20px}
.sheet.mcw .mc .rh{height:32px;padding-left:20px}
.sheet.mcw .mc .rh .rc i,.sheet.mcw .mc .sc>*{width:60px}
.sheet.mcw .mc .pr{min-height:72px}
.sheet.mcw .mc .seed{width:44px;font-size:13px}
.sheet.mcw .mc .nm{padding-left:14px;font-size:15.5px;line-height:21px}
.sheet.mcw .mc .sc>*{font-size:26px}
.sheet.mcw .mc .sc .rt{font-size:12px}
.sheet.mcw .mc .cf{padding:12px 14px 12px 20px}
.sheet.mcw .mc .cf .msg{font-size:13.5px}
.sheet.mcw .mc .cf .btn.sm{height:38px;padding:0 16px;font-size:13.5px;border-radius:8px}
/* меню матча — поверх страницы и окна матча, у кнопки «⋯» */
#pop{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(17,24,39,.16)}
.pm{padding:4px}
.pm button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:13px;font-weight:500}
.pm button:hover{background:var(--surface-2)}
.pm button.danger{color:var(--err)}
.pm button.on{color:var(--err);font-weight:600}
.pm button b{display:inline-block;width:14px}
.spp{display:flex;flex-direction:column;gap:8px}
.spp label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
/* ---- bracket view ---- */
.brk{overflow:auto;padding:16px}
.brk h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brow{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.bcol{display:flex;flex-direction:column;width:250px;flex:none}
.bcol .rh{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;text-align:center;height:16px}
.bslot{display:flex;align-items:center}
.bm{border:1px solid var(--border);border-radius:8px;background:var(--surface-2);padding:8px 12px;width:100%;font-size:13px}
.bm .k{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.04em;margin-bottom:4px}
.bm .l{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-weight:600;min-width:0}
.bm .l .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .l.ph{color:var(--muted);font-weight:500;font-style:italic}
.bm .l.w{color:var(--ink)}
.bm .l.lo{color:var(--muted)}
.bm .l span:last-child{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.bm.done{background:var(--surface)}
.bm.bye{background:var(--surface);border-style:dashed;color:var(--muted)}
/* ---- list page ---- */
.tbl{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.name b{display:block}
td.name span{color:var(--muted);font-size:12px}
td.act{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.settings-col{max-width:1040px}
.sec-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin:6px 0 10px}
.sec-h b{width:24px;height:24px;border-radius:50%;background:var(--black);color:var(--accent);display:grid;place-items:center;font-size:12px}
.panel+.sec-h{margin-top:22px}
.savebar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 0 0;display:flex;gap:10px;align-items:center;margin-top:4px}
.savebar .sp{flex:1;color:var(--muted);font-size:12.5px}
/* настройки турнира: разделы — аккордеон (шапка с «Свернуть ⌃», открыты могут быть все, по умолчанию открыты);
   вкладки вариантов по дивизионам и этапам — тот же переключатель, что у дивизионов в визарде */
.acc+.acc{margin-top:18px}
.acc-h{width:100%;border:0;background:none;padding:4px 0;font:inherit;font-size:15px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer}
.acc-h .names{min-width:0;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-h .line{flex:1;min-width:16px;height:1px;background:var(--muted);opacity:.3}
.acc-h .tg{flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;font-weight:600}
.acc-h:hover .tg{color:var(--ink)}
.acc-h .tg svg{transition:transform .15s}
.acc.open>.acc-h .tg svg{transform:rotate(180deg)}
.acc:not(.open)>.acc-b{display:none}
.acc-h b{flex:none}
@media (max-width:700px){.acc-h .names{display:none}}
.vtabs{display:flex;align-items:center;gap:10px;margin:0 0 12px;overflow-x:auto}
.jrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.jrow:last-child{border-bottom:0}
.jrow .t{flex:1}
.jrow .t span{display:block;color:var(--muted);font-size:12px}
.divsw{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.divsw .lbl{font-size:12px;color:var(--muted);font-weight:600}
/* ---- первый экран: список турниров ---- */
.lwrap{max-width:1240px}
.ltrial{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13.5px}
.ltrial .trial-b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;flex:none}
.ltrial .tx{flex:1;min-width:0;color:var(--muted)}
.ltrial .tx b{color:var(--ink);margin-right:6px}
.tbl.tl{border-radius:10px}
.tl th{background:var(--surface-2);padding:10px 16px}
.tl td{padding:14px 16px}
.tl td.name b{font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl td.name b .tag-plan{margin-left:0}
.tl td.name span{display:block;margin-top:2px}
.tl tbody tr{cursor:pointer}
.tl .mut{color:var(--muted);font-size:13px}
.lfilt{display:flex;gap:4px;margin:0 0 12px}
.lfilt button{border:0;background:transparent;border-radius:8px;padding:0 12px;height:32px;font-size:13px;font-weight:700;color:var(--ink)}
.lfilt button:hover{background:var(--surface-2)}
.lfilt button.on{background:var(--black);color:var(--black-ink)}
.lfilt button i{font-style:normal;font-weight:500;opacity:.6;margin-left:4px}
.tl td.act .btn+.btn{margin-left:6px}

/* ---- переход из групп в финальный этап: кто с кем играет в первом туре финальной сетки ----
   map — позиции сетки сверху вниз, пары 0–1, 2–3…; ключ 'A1' — группа A, 1-е место; null — пропуск тура.
   g — схема. Крест-накрест и стыковые пересобирают map из текущих чисел этапа сами, своя схема хранит map как есть */
const LINK_PRESETS=[['cross','Крест-накрест'],['stik','Стыковые'],['custom','Своя схема']];
function linkSources(st){const sizes=groupSizes(+st.N,+st.G);const k=+st.k;const out=[];sizes.forEach((sz,i)=>{for(let j=1;j<=Math.min(k,sz);j++)out.push(String.fromCharCode(65+i)+j)});return out}
const lPlace=x=>+x.slice(1);
const lCode=x=>x?x.slice(1)+x[0]:'';   /* 'A1' → '1A': место и группа, как в протоколах */
const lRound=m=>m<=2?'финал':m===4?'1/2 финала':`1/${m/2} финала`;   /* тур по числу участников в нём: 8 → 1/4 финала */
const lRoundIn=m=>m<=2?'финале':lRound(m);
function linkCtx(st){const sizes=groupSizes(+st.N,+st.G),src=linkSources(st);return {G:sizes.length,k:+st.k,src,M:pow2up(src.length)}}
/* почему схема недоступна при текущих числах этапа; пустая строка — доступна */
function linkWhyOff(st,key){const c=linkCtx(st),n=c.src.length,gap=n===c.M?'':`Выходят ${n} ${plural(n,'пара','пары','пар')}: в сетке будут пропуски тура, расставьте пары сами`;
  if(key==='cross')return c.G<2||c.G%2?'Нужно чётное число групп':c.k<2?'Нужно, чтобы из группы выходили хотя бы две пары':gap;
  if(key==='stik')return c.G!==2?'Только при двух группах — так в регламенте, п. 1.4.7':gap;
  return ''}
/* раскладка матчей первого тура: половины сетки поровну, одногруппники и победители групп — как можно дальше друг от друга */
function linkCost(sec,mt){let c=0;mt.forEach(t=>{if(t)sec.forEach(u=>{if(!u)return;const a=lPlace(t),b=lPlace(u);if(t[0]===u[0])c+=10/(a+b);if(a===1&&b===1)c+=1})});return c}
function linkArrange(ms){if(ms.length<2)return ms;const h=ms.length/2,top=[],bot=[],best=m=>Math.min(...m.filter(Boolean).map(lPlace));
  ms.map((m,i)=>[m,i]).sort((a,b)=>best(a[0])-best(b[0])||a[1]-b[1]).forEach(([m])=>{if(top.length===h)return bot.push(m);if(bot.length===h)return top.push(m);
    const ct=linkCost(top.flat(),m),cb=linkCost(bot.flat(),m);(ct<cb||(ct===cb&&top.length<=bot.length)?top:bot).push(m)});
  return [...linkArrange(top),...linkArrange(bot)]}
function linkPreset(st,key){const c=linkCtx(st),gl=i=>String.fromCharCode(65+i),ms=[];
  if(key==='cross'){for(let i=0;i+1<c.G;i+=2){const X=gl(i),Y=gl(i+1);for(let j=1;j<=c.k/2;j++)ms.push([X+j,Y+(c.k+1-j)],[Y+j,X+(c.k+1-j)])}}
  else if(key==='stik'){for(let j=1;j<=c.k;j++)ms.push(['A'+j,'B'+j])}
  else{/* стартовая расстановка своей схемы: сильнейшим — пропуски тура, дальше сильный против слабого из другой группы */
    const ts=[...c.src].sort((a,b)=>lPlace(a)-lPlace(b)||a.charCodeAt(0)-b.charCodeAt(0));ts.splice(0,c.M-ts.length).forEach(t=>ms.push([t,null]));
    while(ts.length){const a=ts.shift();let j=ts.length-1;while(j>=0&&ts[j][0]===a[0])j--;if(j<0)j=ts.length-1;ms.push([a,ts.splice(j,1)[0]])}}
  return linkArrange(ms).flatMap(m=>m[1]&&lPlace(m[1])<lPlace(m[0])?[m[1],m[0]]:m)}
/* схема и map всегда соответствуют текущим числам этапа. Своя схема сбрасывается, только когда числа поменялись */
function linkOf(st){if(!st.link)st.link={};const l=st.link,c=linkCtx(st);if(!Array.isArray(l.map))l.map=[];
  if(l.g!=='custom'&&LINK_PRESETS.some(p=>p[0]===l.g)&&!linkWhyOff(st,l.g)){l.map=linkPreset(st,l.g);return l}
  const ok=l.g==='custom'&&l.map.length===c.M&&c.src.every(x=>l.map.includes(x))&&l.map.every(x=>!x||c.src.includes(x));
  if(!ok){l.g=linkWhyOff(st,'cross')?'custom':'cross';l.map=linkPreset(st,l.g)}
  return l}
function linkLabel(st){return LINK_PRESETS.find(p=>p[0]===linkOf(st).g)[1]}
/* пары первого тура текстом: ['1A – 2B', '1C – 2D', …] */
function linkPairs(st){const m=linkOf(st).map,out=[];for(let i=0;i<m.length;i+=2)out.push(m[i]&&m[i+1]?`${lCode(m[i])} – ${lCode(m[i+1])}`:`${lCode(m[i]||m[i+1])} без игры`);return out}
function linkPairsText(st,n=4){const p=linkPairs(st);return p.slice(0,n).join(', ')+(p.length>n?', …':'')}

function linkCard(st,bp){const c=linkCtx(st),n=c.src.length,from=`${n} ${plural(n,'пара','пары','пар')} из ${c.G>1?`${c.G} ${plural(c.G,'группы','групп','групп')}`:'группы'}`;

  const l=linkOf(st),p=linkPairs(st),cap=8;
  return `<div class="arrow link"><button class="lk-card" data-act="link-open" data-bp="${bp}"><span class="t">Кто с кем в&nbsp;${lRoundIn(l.map.length).replace(' ','&nbsp;')}</span><span class="s">${from}</span><span class="sch">${linkLabel(st)}</span><span class="ps">${p.slice(0,cap).map(x=>`<span>${x}</span>`).join('')}${p.length>cap?`<span class="more">и ещё ${p.length-cap} ${plural(p.length-cap,'пара','пары','пар')}</span>`:''}</span><span class="go">Изменить</span></button></div>`}

/* сетка финального этапа: в первом туре — списки для замены, дальше — кто может прийти в матч */
function linkBracket(map){const M=map.length,R=log2(M),n1=M/2,MH=62,P=76,TOP=24,W1=212,W2=140,CG=28;
  const ys=[[...Array(n1)].map((_,i)=>TOP+i*P)];for(let r=1;r<R;r++){const p=ys[r-1];ys.push([...Array(p.length/2)].map((_,j)=>(p[2*j]+p[2*j+1])/2))}
  const wd=r=>r?W2:W1,xs=ys.map((_,r)=>r?W1+CG+(r-1)*(W2+CG):0),H=TOP+(n1-1)*P+MH,W=xs[R-1]+wd(R-1);
  const src=map.filter(Boolean).sort((a,b)=>a.charCodeAt(0)-b.charCodeAt(0)||lPlace(a)-lPlace(b)),byes=M-src.length;
  const opts=v=>{let o='',g='';src.forEach(x=>{if(x[0]!==g){o+=(g?'</optgroup>':'')+`<optgroup label="Группа ${x[0]}">`;g=x[0]}o+=`<option value="${x}" ${x===v?'selected':''}>${lCode(x)}</option>`});return o+(g?'</optgroup>':'')+(byes?`<option value="" ${v?'':'selected'}>пропуск</option>`:'')};
  const who=(a,b,full)=>{const w=map.slice(a,b).filter(Boolean).map(lCode);return full||w.length<=4?w.join(full?', ':w.length>2?'/':' / '):w.slice(0,3).join('/')+'/…'};
  let lines='',html='';
  ys.forEach((col,r)=>{const rn=lRound(M>>r);html+=`<div class="lk-h ${r?'':'cur'}" style="left:${xs[r]}px">${rn[0].toUpperCase()+rn.slice(1)}</div>`;
    col.forEach((y,j)=>{const span=2<<r,a=j*span,h=span/2;
      if(r<R-1){const x1=xs[r]+wd(r);lines+=`<path d="M${x1} ${y+MH/2}H${x1+CG/2}V${ys[r+1][j>>1]+MH/2}H${xs[r+1]}"/>`}
      if(!r){const same=map[a]&&map[a+1]&&map[a][0]===map[a+1][0];
        html+=`<div class="lk-m ${same?'same':''}"${same?' title="Пары из одной группы: повтор матча группы"':''} style="left:0;top:${y}px;width:${W1}px">${[a,a+1].map(i=>{const v=map[i],pv=map[i^1];return `<div class="r"><select class="lk-s" data-link-slot="${i}" aria-label="${lRound(M)}, матч ${j+1}">${opts(v)}</select><span class="d">${v?`${lPlace(v)}-е в группе ${v[0]}`:pv?`${lCode(pv)} — без игры`:''}</span></div>`}).join('')}</div>`}
      else html+=`<div class="lk-m nx" style="left:${xs[r]}px;top:${y}px;width:${W2}px"><div class="r" title="${who(a,a+h,1)}">${who(a,a+h)}</div><div class="r" title="${who(a+h,a+span,1)}">${who(a+h,a+span)}</div></div>`})});
  return `<div class="lk-br" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}">${lines}</svg>${html}</div>`}
const LINK_TXT={
  cross:{ex:k=>`1A – ${k}B, 1B – ${k}A`,why:'Сильные места играют со слабыми из соседней группы. Сильнейшие не выбивают друг друга сразу, одногруппники встречаются как можно позже. Обычный выбор'},
  stik:{ex:()=>'1A – 1B, 2A – 2B',why:'Пары с одинаковых мест играют между собой: стыковые матчи по регламенту, п. 1.4.7. Победители групп встречаются сразу'},
  custom:{ex:()=>'',why:'Если в положении турнира другая схема. Начните с любой и поменяйте пары в сетке справа'}};
function renderLink(){const st=LINKCTX.st,l=linkOf(st),c=linkCtx(st),M=l.map.length;
  const sb=document.querySelector('#modal.open #sheet .sb'),keep=sb?[sb.scrollTop,(document.querySelector('#sheet .lk-wrap')||{}).scrollLeft||0]:null;
  /* недоступные схемы не показываем; выбранную — показываем, даже если она стала недоступной, чтобы выбор не пропал */
  const cards=LINK_PRESETS.filter(([k])=>l.g===k||!linkWhyOff(st,k)).map(([k,name])=>{const off=linkWhyOff(st,k),on=l.g===k,ex=LINK_TXT[k].ex(Math.max(2,c.k));
    return `<button class="lk-scheme ${on?'on':''}" data-act="link-preset" data-p="${k}" ${off?'disabled':''} aria-pressed="${on}">${linkIcon(k)}<span class="st">${name}<span class="rd"></span></span>${ex?`<span class="ex">${ex}</span>`:''}${off?`<span class="no">${off}</span>`:`<span class="why">${LINK_TXT[k].why}</span>`}</button>`}).join('');
  openModal(`<div class="sh"><h3>Кто с кем играет в ${lRoundIn(M)}</h3><button class="x" data-act="close">×</button></div>
  <div class="sb">
  <div class="lk-grid"><div class="lk-schemes"><div class="lk-cap">Схема</div>${cards}</div>
  <div class="lk-panel"><div class="bt"><b>Сетка финального этапа</b></div>
  <div class="lk-wrap">${linkBracket(l.map)}</div></div></div></div>
  <div class="sf"><span class="sp"></span><button class="btn primary" data-act="close">Готово</button></div>`);
  document.getElementById('sheet').classList.add('wide');
  if(keep){const s=document.querySelector('#sheet .sb'),w=document.querySelector('#sheet .lk-wrap');if(s)s.scrollTop=keep[0];if(w)w.scrollLeft=keep[1]}}
/* замена в первом туре: выбранная пара меняется местами с той, что стояла здесь; схема становится своей */
function linkSwap(i,v){const l=linkOf(LINKCTX.st),m=[...l.map],val=v||null,j=m.findIndex((x,k)=>k!==i&&x===val);
  if(j<0||m[i]===val)return renderLink();
  [m[i],m[j]]=[m[j],m[i]];
  for(let a=0;a<m.length;a+=2)if(!m[a]&&!m[a+1]){toast('В паре должен остаться хотя бы один участник');return renderLink()}
  const was=l.map[i];l.map=m;l.g='custom';save();renderLink();toast(`${was?lCode(was):'Пропуск'} и ${val?lCode(val):'пропуск'} поменялись местами`)}

   счёт генерируется по фиксированному зерну, чтобы у всех демо выглядело одинаково. raw=true — демо на приёме заявок (для ?state=) */
function isoDay(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}

  const db={tournaments:[t],cur:'demo',wiz:defaultWiz(),acc:defaultAcc(),ui:{linksOpen:true,day:{},view:{}}};

let DB=null;
function load(){try{const s=localStorage.getItem(KEY);if(s){DB=JSON.parse(s);migrate();return}}catch(e){}DB=seedDemo();save()}
function migrate(){if(!DB.acc)DB.acc=defaultAcc();if(!DB.acc.profile)DB.acc.profile=defaultProfile();if(!DB.acc.credits)DB.acc.credits=[];if(!DB.acc.sponsors)DB.acc.sponsors=SP_SEED();DB.tournaments.forEach(t=>{if(t.id==='demo')t.plan='demo';if(!t.plan)t.plan='paid';if(!t.mods)t.mods=allMods();
    /* старые настройки спонсоров (главный из списка, подложка, вывод на ТВ) → титульный + партнёры + места */
    if(!t.sponsors||!Array.isArray(t.sponsors.extra)){const o=t.sponsors||{},demo=t.id==='demo';t.sponsors={main:demo?'svetlaya':'',extra:demo?['northline','zerno','volta']:[],tv:o.tv==='footer'?'footer':'corner',hidden:[],wm:!!o.wm}}});
  /* старое значение «Star Point» без числа — это Star Point 1 */
  (function fix(o){if(o&&typeof o==='object'){if(o.deuce==='star')o.deuce='star1';Object.values(o).forEach(fix)}})(DB)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}

const MODS=[

function packSum(){const p=DB.ui.pay,c=packCalc(p);const q=id=>document.getElementById(id);if(!q('pTotal'))return;q('pTotal').textContent=rub(c.sum);

function payDone(){const p=DB.ui.pay;DB.ui.pay=null;

function modLock(k){const m=MODS.find(x=>x.k===k);return `<div class="lkr off"><span class="ic">${ICO.tv}</span><span class="t"><b>${m.l}</b><span>модуль не подключён</span></span><span class="a"><button class="btn sm" data-act="buy-mod" data-m="${k}">+ ${rub(PRICE[k])}</button></span></div>`}
function T(){return DB.tournaments.find(t=>t.id===DB.cur)}
function D(t){t=t||T();return t.divisions.find(d=>d.code===t.div)||t.divisions[0]}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function copy(s){try{navigator.clipboard.writeText(s)}catch(e){}toast('Скопировано: '+s)}
function setPath(o,path,val){const ks=path.split('.');for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}

/* ---------- расчёт структуры (портировано из конструктора типа) ---------- */
function rrCalc(s){return {matches:s*(s-1)/2,rounds:s<2?0:(s%2?s:s-1)}}
function groupSizes(n,G){if(n<2)return [n];G=Math.max(1,Math.min(G,Math.floor(n/2)));const base=Math.floor(n/G),extra=n%G,sizes=[];for(let i=0;i<G;i++)sizes.push(base+(i<extra?1:0));return sizes}
function bracketCalc(t,f){
  if(t<=1)return {matches:0,rounds:0,byes:0,M:1};
  if(f.type==='FG'){const c=rrCalc(t);return {...c,byes:0,M:t}}
  const M=pow2up(t),R=log2(M),byes=M-t;
  if(f.type==='O')return {matches:t-1+(f.third&&t>=4?1:0),rounds:R,byes,M};
  if(f.type==='ODT'){const L1=t-M/2;let E,dtR;if(f.dt==='r1'){E=L1;dtR=E>=2?log2(pow2up(E)):0}else if(f.dt==='r12'){E=L1+(R>=2?M/4:0);dtR=Math.max(1,L1>=2?log2(pow2up(L1)):0)+(R>=2?1:0)}else{E=t-1;dtR=R}
    return {matches:t-1+(f.thirdOT&&t>=4?1:0)+Math.max(0,E-1)+(f.thirdDT&&E>=4?1:0),rounds:Math.max(R,1+dtR),byes,M}}
  if(f.type==='UO')return {matches:(M/2)*R-byes,rounds:R,byes,M};
  if(f.type==='UO2'){const g=f.grand?1:0;return {matches:2*t-4+g+(f.third&&t>=4?1:0),rounds:2*R-2+g,byes,M}}
  if(f.type==='ODTG'){const rest=Math.max(0,(f.total||t)-t);return {matches:(t-1)+Math.max(0,rest-1),rounds:R,byes,M}}
  // обе сетки по УО: основная — вышедшие из групп, ДТ — все остальные
  if(f.type==='UODTG'){const rest=Math.max(0,(f.total||t)-t),uo=n=>{if(n<2)return 0;const m=pow2up(n);return (m/2)*log2(m)-(m-n)};return {matches:uo(t)+uo(rest),rounds:Math.max(R,rest>=2?log2(pow2up(rest)):0),byes,M}}
  return {matches:t-1,rounds:R,byes,M}
}
function structure(w){
  const N=+w.N,Q=w.qual?+w.Q:0,WC=+w.WC,DA=N-Q-WC,out={N,Q,WC,DA,errors:[],warns:[]};
  if(w.groups){const sizes=groupSizes(N,+w.G);let m=0,r=0;sizes.forEach(s=>{const c=rrCalc(s);m+=c.matches;r=Math.max(r,c.rounds)});out.groups={sizes,G:sizes.length,matches:m,rounds:r,out:sizes.reduce((a,s)=>a+Math.min(+w.k,s),0)}}
  if(w.finOn!==false){const t=w.groups?out.groups.out:N;out.fin={t,...bracketCalc(t,{...w.fin,total:N})}}
  if(DA<0)out.errors.push({id:'V8',msg:`Прямой допуск + Q + WC больше вместимости на ${-DA}. Уменьшите Q или WC.`});
  if(w.groups&&out.groups.G>1&&w.finOn===false)out.errors.push({id:'V4',msg:'Места между группами не разыграны. Включите финальный этап.'});
  if(!w.groups&&w.finOn===false)out.errors.push({id:'V5',msg:'Турнир не определяет победителя: включите групповой или финальный этап.'});
  if(w.finOn!==false&&TYPES_GROUPS.includes(w.fin.type)&&!w.groups)out.errors.push({id:'V6',msg:'Эта система играется только с групповым этапом.'});
  if(out.fin&&out.fin.byes>0&&!TYPES_GROUPS.includes(w.fin.type))out.warns.push({id:'V1',msg:`Сетка ${out.fin.M}: ${out.fin.byes} ${plural(out.fin.byes,'пропуск','пропуска','пропусков')} в первом туре у сильнейших по посеву.`});
  if(w.qual&&Q>N/2)out.warns.push({id:'V3',msg:'Через квалификацию больше половины мест основного турнира.'});
  return out;
}
function formula(w){const c=structure(w),p=[];if(w.qual)p.push(`Квал →${c.Q}`);if(c.groups)p.push(`Группы ${c.groups.G}×${Math.max(...c.groups.sizes)}${c.fin?` (выходят ${w.k})`:''}`);
  if(c.fin){if(w.fin.type==='FG')p.push(`Финальная группа ${c.fin.t}`);else if(w.fin.type==='ODTG'||w.fin.type==='UODTG')p.push(`Плей-офф ${c.fin.t} ${TYPES[w.fin.type].code} из групп`);else{let s=`Плей-офф ${c.fin.t} ${TYPES[w.fin.type].code}`;if((w.fin.type==='O'||w.fin.type==='UO2')&&w.fin.third)s+=', матч за 3-е';if(w.fin.type==='ODT'&&w.fin.thirdOT)s+=', матч за 3-е';if(w.fin.type==='UO2'&&w.fin.grand)s+=', гранд-финал';p.push(s)}}
  return p.join(' · ')}
function rulesText(r){return `до ${r.sets} ${plural(+r.sets,'победы','побед','побед')} · сет до ${r.games} · тай-брейк ${r.tb==='off'?'выкл':'до '+r.tb} · ${r.dec==='stb'?'решающий — супер-тай-брейк до 10':'решающий — полный сет'} · 40:40 — ${DEUCE_N[r.deuce]||DEUCE_N.star1}`}

/* ---------- мини-схемы типов (SVG) ---------- */
function layoutCols(cols,x0,y0,colW,h){const nodes={};cols.forEach((n,ci)=>{const s=h/n;for(let i=0;i<n;i++)nodes[ci+':'+i]={x:x0+ci*colW,y:y0+s*(i+.5)}});return {nodes}}
function circ(p,cls,r=4){return `<circle class="${cls}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}"/>`}
function elbow(a,b){const mx=(a.x+b.x)/2;return `<path class="ln" d="M${a.x.toFixed(1)} ${a.y.toFixed(1)}H${mx.toFixed(1)}V${b.y.toFixed(1)}H${b.x.toFixed(1)}"/>`}
function drawSE(pre,M,t,x,y,w,h,opts={}){const R=log2(M);const cols=[];for(let r=0;r<=R;r++)cols.push(M/Math.pow(2,r));const colW=w/(cols.length-1||1);const {nodes}=layoutCols(cols,x,y,colW,h);let s='',map={};const byeSet=new Set();let byes=M-t;for(let i=M/2-1;i>=0&&byes>0;i--,byes--)byeSet.add(2*i+1);
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];map[pre+':'+ci+':'+i]=p;if(ci<cols.length-1){s+=elbow(p,nodes[(ci+1)+':'+(i>>1)])}}});
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];const bye=ci===0&&byeSet.has(i);s+=circ(p,'n'+(bye?' bye':'')+(opts.inCls&&ci===0?' in':''),ci===cols.length-1?5:3.5)}});
  if(opts.label)s+=`<text class="lab" x="${x}" y="${y-6}">${opts.label}</text>`;
  if(opts.third&&t>=4){const f=nodes[R+':0'];const p={x:f.x,y:Math.min(y+h+14,f.y+Math.max(28,h/M*2))};map[pre+':3rd']=p;s+=circ(p,'n',3.5)+`<text class="lab" x="${p.x+8}" y="${p.y+3.5}">за 3-е</text>`}
  return {s,map,R,cols,byeSet}}
// o.p0 — с какого места считать (ДТ продолжает места основной сетки), o.label — подпись над сеткой, o.inCls — вход из другого этапа
function drawUO(pre,M,t,x,y,w,h,o={}){const R=log2(M);const cols=[];for(let r=0;r<=R;r++)cols.push(M);const colW=w/R;const {nodes}=layoutCols(cols,x,y,colW,h);let s='',map={};
  for(let r=0;r<R;r++){const B=M/Math.pow(2,r);for(let i=0;i<M;i++){const b=Math.floor(i/B),pI=Math.floor((i%B)/2);const p=nodes[r+':'+i];s+=elbow(p,nodes[(r+1)+':'+(b*B+pI)]);s+=elbow(p,nodes[(r+1)+':'+(b*B+B/2+pI)])}}
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];map[pre+':'+ci+':'+i]=p;s+=circ(p,'n'+(ci===0&&i>=t?' bye':'')+(o.inCls&&ci===0?' in':''),ci===R?4:3);if(ci===R)s+=`<text class="pl" x="${p.x+8}" y="${p.y+3.5}">${(o.p0||0)+i+1}</text>`}});
  if(o.label)s+=`<text class="lab" x="${x}" y="${y-6}">${o.label}</text>`;
  return {s,map,R}}
function drawUO2(pre,M,t,x,y,w,h){const R=log2(M);const upH=h*.5,loH=h*.42;const up=drawSE(pre+':U',M,t,x,y,w,upH,{label:'Верхняя сетка'});
  const drop=[];for(let r=2;r<=R-1;r++)drop.push(M/Math.pow(2,r));const cols=[M/2];let cur=M/2;const merge=[];drop.forEach(d=>{cur=cur/2+d;cols.push(cur);merge.push(cols.length-1);cur=cur/2;cols.push(cur)});if(cur>1)cols.push(1);
  const ly=y+upH+26;const colW=w/Math.max(1,cols.length-1);const {nodes}=layoutCols(cols,x,ly,colW,loH);let s=up.s,map=up.map;
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];map[pre+':L:'+ci+':'+i]=p;if(ci<cols.length-1)s+=elbow(p,nodes[(ci+1)+':'+(i>>1)])}});
  cols.forEach((n,ci)=>{for(let i=0;i<n;i++){const p=nodes[ci+':'+i];const isDrop=merge.includes(ci)&&i>=n/2;s+=circ(p,'n'+(isDrop?' in':''),ci===cols.length-1?5:3.5)}});
  s+=`<text class="lab" x="${x}" y="${ly-6}">Нижняя сетка</text>`;return {s,map,R,cols,merge}}
function drawODT(pre,M,t,x,y,w,h,f){const R=log2(M);const L1=t-M/2;let E;if(f.dt==='r1')E=L1;else if(f.dt==='r12')E=L1+(R>=2?M/4:0);else E=t-1;const upH=h*.52,loH=h*.38;
  const up=drawSE(pre+':U',M,t,x,y,w,upH,{label:'Основная сетка (ОТ)',third:f.thirdOT});let s=up.s,map=up.map;
  if(E>=1){const ME=pow2up(Math.max(2,E));const ly=y+upH+34;const lo=drawSE(pre+':D',ME,Math.max(1,E),x,ly,w*.7,loH,{label:'Утешительная (ДТ)',third:f.thirdDT,inCls:true});s+=lo.s;Object.assign(map,lo.map);
    let k=0;for(let i=0;i<M/2&&k<Math.min(E,ME);i++){if(up.byeSet.has(2*i+1))continue;const a=map[pre+':U:0:'+(2*i+1)],b=map[pre+':D:0:'+k];if(a&&b)s+=`<path class="ln dash" d="M${a.x} ${a.y}C${a.x-18} ${a.y},${b.x-18} ${b.y},${b.x} ${b.y}"/>`;k++}}
  return {s,map,R,E}}
function drawRR(pre,t,x,y,w,h,label,inN=0){let s=`<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/><text class="lab big" x="${x+8}" y="${y+14}">${label}</text>`;const map={};const step=(h-24)/t;
  for(let i=0;i<t;i++){const p={x:x+16,y:y+24+step*(i+.5)};map[pre+':'+i]=p;s+=circ(p,'n'+(i<inN?' in':''),3.5)+`<text class="pl" x="${x+w-22}" y="${p.y+3.5}">${i+1}</text>`}
  for(let i=0;i<t;i++)for(let j=i+1;j<t;j++){const a=map[pre+':'+i],b=map[pre+':'+j];s+=`<path class="ln" d="M${a.x+4} ${a.y}C${a.x+30} ${a.y},${b.x+30} ${b.y},${b.x+4} ${b.y}" opacity=".5"/>`}
  return {s,map}}
function pathSE(pre,R,L,i0=0){const ids=[];const last=L===0?R:L-1;for(let r=0;r<=last;r++)ids.push(pre+':'+r+':'+(i0>>r));return ids}
function pathUO(pre,M,L,i0=0){const R=log2(M);const ids=[pre+':0:'+i0];let i=i0;for(let r=0;r<R;r++){const B=M/Math.pow(2,r);const b=Math.floor(i/B),pI=Math.floor((i%B)/2);const win=!(L===r+1);i=win?b*B+pI:b*B+B/2+pI;ids.push(pre+':'+(r+1)+':'+i)}return {ids,place:i+1}}
function typeAnim(type){const W=270,H=190,CAP=H-8;let s='',map={},ids=[],endLabel='';
  if(type==='O'){const d=drawSE('a',8,8,14,20,180,112,{third:true});s=d.s;map=d.map;ids=pathSE('a',3,2);endLabel='проиграл во 2-м туре → место 5–8'}
