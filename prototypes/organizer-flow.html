  if(type==='UO'){const d=drawUO('a',8,8,14,20,180,132);s=d.s;map=d.map;const p=pathUO('a',8,1,0);ids=p.ids;endLabel='проиграл в 1-м туре → место '+p.place}
  if(type==='UO2'){const d=drawUO2('a',8,8,14,20,180,124);s=d.s;map=d.map;ids=[...pathSE('a:U',3,1,1),'a:L:0:0','a:L:1:0','a:L:2:0','a:L:3:0'];endLabel='проиграл в 1-м туре → нижняя сетка, 5-е'}
  if(type==='QUAL'){const a1=drawSE('a',4,4,14,22,110,64,{label:'Мини-сетка 1'}),a2=drawSE('b',4,4,14,110,110,64,{label:'Мини-сетка 2'});s=a1.s+a2.s;map={...a1.map,...a2.map};
    const m1=map['a:2:0'],m2=map['b:2:0'];const box={x:170,y:40,w:86,h:110};s+=`<rect class="box" x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="5"/><text class="lab big" x="${box.x+8}" y="${box.y+14}">Основной</text><text class="lab big" x="${box.x+8}" y="${box.y+26}">турнир</text>`;
    [m1,m2].forEach((m,i)=>{const p={x:box.x+20,y:box.y+50+i*30};map['q:'+i]=p;s+=`<path class="ln dash" d="M${m.x+4} ${m.y}C${m.x+30} ${m.y},${p.x-30} ${p.y},${p.x-4} ${p.y}"/>`+circ(p,'n in',4)});
    ids=['a:0:0','a:1:0','a:2:0','q:0'];endLabel='победитель мини-сетки → основной турнир'}
  if(type==='GROUPS'){const g1=drawRR('r',4,14,20,110,132,'Группа A'),g2=drawRR('s',4,146,20,110,132,'Группа B');s=g1.s+g2.s;map={...g1.map,...g2.map};ids=['r:0','r:1','r:2','r:3'];endLabel='каждый с каждым внутри группы'}
  if(type==='ODTG'){const gw=56,gh=26;let g='';for(let i=0;i<4;i++){const y=14+i*36;g+=`<rect class="box" x="14" y="${y}" width="${gw}" height="${gh}" rx="5"/><text class="lab big" x="20" y="${y+11}">Группа ${String.fromCharCode(65+i)}</text>`;for(let k=0;k<4;k++){const p={x:24+k*12,y:y+20};map['g:'+i+':'+k]=p;g+=circ(p,'n'+(k<2?' in':''),2.6)}}

    for(let i=0;i<4;i++)for(let k=0;k<4;k++){const a=map['g:'+i+':'+k],b=map[(k<2?'u':'d')+':0:'+(2*i+(k%2))];s+=`<path class="ln dash" d="M${a.x} ${a.y}C${a.x+30} ${a.y},${b.x-30} ${b.y},${b.x-3} ${b.y}"/>`}
    ids=['g:0:2',...pathSE('d',3,0,0)];endLabel='3-е место в группе → победитель ДТ'}

  if(type==='UODTG'){const ga=drawRR('ga',4,14,10,66,72,'Группа A',2),gb=drawRR('gb',4,14,90,66,72,'Группа B',2);
    const up=drawUO('u',4,4,128,26,100,52,{label:'Основная сетка'}),lo=drawUO('d',4,4,128,106,100,52,{label:'Утешительная (ДТ)',p0:4,inCls:true});s=ga.s+gb.s+up.s+lo.s;Object.assign(map,ga.map,gb.map,up.map,lo.map);
    [['ga:0','gb:1','gb:0','ga:1'],['ga:2','gb:3','gb:2','ga:3']].forEach((seeds,b)=>seeds.forEach((g,i)=>{const a={x:80,y:map[g].y},d=map[(b?'d':'u')+':0:'+i];s+=`<path class="ln dash" d="M${a.x} ${a.y}C${a.x+24} ${a.y},${d.x-24} ${d.y},${d.x-4} ${d.y}"/>`}));

  if(type==='FG'){const gw=78,gh=32;let g='';for(let i=0;i<4;i++){const y=14+i*38;g+=`<rect class="box" x="14" y="${y}" width="${gw}" height="${gh}" rx="5"/><text class="lab big" x="22" y="${y+13}">Группа ${String.fromCharCode(65+i)}</text>`;for(let k=0;k<4;k++){const p={x:26+k*14,y:y+24};if(k===0)map['g:'+i+':0']=p;g+=circ(p,'n'+(k===0?' in':''),3)}}
    const r=drawRR('r',4,140,20,112,132,'Финальная группа');s=g+r.s;Object.assign(map,r.map);for(let i=0;i<4;i++){const a=map['g:'+i+':0'],b=map['r:'+i];s+=`<path class="ln dash" d="M${a.x+gw-16} ${a.y}C${a.x+gw+10} ${a.y},${b.x-30} ${b.y},${b.x-4} ${b.y}"/>`}ids=['g:1:0','r:1'];endLabel='победители групп → одна таблица'}
  const pts=ids.map(i=>map[i]).filter(Boolean);let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);

  s+=`<line x1="0" y1="${CAP-14}" x2="${W}" y2="${CAP-14}" stroke="var(--border)" stroke-width="1"/><text class="cap" x="14" y="${CAP}">${endLabel}</text>`;

function stageActs(go){const {t,stage}=VIEW;const act=activeStage(t),prev=prevStage(t);if(stage!==act||!go)return '';

function tStatus(t){const d=D(t);const stages=t.divisions.map(dv=>divStage(t,dv));
  if(stages.every(s=>s.key==='done'))return {cls:'done',l:'завершён'};
  if(stages.some(s=>s.key==='main'||s.key==='qual'))return {cls:'live',l:'турнир идёт'};
  if(stages.some(s=>s.key==='drawq'||s.key==='drawm'))return {cls:'',l:'жеребьёвка'};
  return {cls:'',l:'приём заявок'}}
function trialBar(){const st=trialState(),tt=trialT();

  if(st==='held')return `<div class="ltrial"><span class="trial-b">Триал</span><span class="tx"><b>Пробный турнир — «${esc(tt.name)}»</b>триал израсходуется, когда турнир стартует: завершится приём заявок</span></div>`;
  return ''}

/* =====================================================================
   Визард создания турнира: 4 шага + сводка справа
   ===================================================================== */
const WSTEPS=['Основные настройки','Тип турнира','Настройки матчей','Участники'];
function wizErrors(w){const e=[];if(!w.name.trim())e.push({step:1,msg:'название турнира'});if(!w.start)e.push({step:1,msg:'дата начала'});if(!(+w.courts>0))e.push({step:1,msg:'число кортов'});(w.divisions.length?w.divisions:[{struct:w.struct}]).forEach(d=>structure(d.struct).errors.forEach(x=>e.push({step:2,msg:(d.name?d.name+': ':'')+x.msg})));return e}
function stepDone(w,i){return !wizErrors(w).some(e=>e.step===i)&&(i===1?!!(w.name.trim()&&w.start):true)}
function pageWiz(step){renderNav('t');const w=DB.wiz;w.step=step;const errs=wizErrors(w);
  const items=WSTEPS.map((l,i)=>({label:l,state:i+1===step?'cur':(i+1<step&&stepDone(w,i+1))?'done':'',href:`#/new/${i+1}`}));
  const body=[null,wizStep1,wizStep2,wizStep3,wizStep4][step](w);
  const missing=errs.length?`<div class="alert err" style="margin-bottom:12px">Чтобы создать турнир, заполните: ${errs.map(e=>`<a href="#/new/${e.step}" style="font-weight:600">${e.msg}</a> (шаг ${e.step})`).join(', ')}</div>`:'';
  const foot=`<div class="wizfoot">${step>1?`<a class="btn" href="#/new/${step-1}">← Назад</a>`:''}<span class="sp"></span>${step<4?`<a class="btn primary" href="#/new/${step+1}">Далее →</a>`:(trialState()==='free'?`<span class="tag-plan trial" style="margin:0">Триал</span><button class="btn go" data-act="create" ${errs.length?'disabled':''}>Создать турнир бесплатно</button>`:creditsLeft()?`<span class="tag-plan demo" style="margin:0">Баланс · ${creditsLeft()}</span><button class="btn go" data-act="create" ${errs.length?'disabled':''}>Создать турнир из баланса</button>`:`<button class="btn go" data-act="create" ${errs.length?'disabled':''}>Перейти к оплате →</button>`)}</div>`;
  if(step===4)return void(document.getElementById('app').innerHTML=`<div class="ph"><div class="tt"><h1>Создание турнира</h1></div></div>${stepsBar(items)}
  <div class="wizwrap">${body}${missing}${foot}</div>`);
  document.getElementById('app').innerHTML=`<div class="ph"><div class="tt"><h1>Создание турнира</h1></div></div>${stepsBar(items)}
  <div class="wizwrap ${step===2?'wide':''}">${body}${foot}</div>`}

function counts(t,dv){const st=S_(t,dv);const m=zone(dv,'main'),q=zone(dv,'qual'),r=zone(dv,'res');const wc=m.filter(p=>p.wc).length;return {m:m.length,q:q.length,r:r.length,wc,N:st.N,Q:st.qual?st.Q:0,WC:st.WC,directCap:st.N-(st.qual&&q.length?st.Q:0)}}

function fixDraw(t,dv,kind){const dr=kind==='q'?dv.drawQ:dv.drawM;if(!dr.slots.length)return;dr.done=true;dv.matches=dv.matches.filter(m=>m.stage!==(kind==='q'?'qual':'main'));genMatches(t,dv,kind);DB.ui.sel=null}
function resetDraw(t,dv,kind){const dr=kind==='q'?dv.drawQ:dv.drawM;dr.done=false;dr.slots=dr.slots.map(()=>null);dv.matches=dv.matches.filter(m=>m.stage!==(kind==='q'?'qual':'main'));if(kind==='q'){dv.qualDone=false;dv.qualWinners=[]}else dv.mainDone=false}

/* =====================================================================

function mkMatch(stage,br,r,i,label,a,b){return {id:uid(),stage,br,r,i,label,num:i+1,a,b,court:null,day:null,tm:'at',time:'',judge:'',sets:[],winner:null,fin:'normal',done:false}}
function roundName(size){return size===1?'Финал':size===2?'1/2 финала':`1/${size} финала`}
function refExists(dv,ref){if(!ref)return false;if(ref.k==='pair'||ref.k==='q')return true;const m=dv.matches.find(x=>x.id===ref.m);if(!m)return false;if(!m.bye)return true;return ref.k==='w'?!!m.winner:false}
function settleByes(dv){let changed=true;while(changed){changed=false;dv.matches.forEach(m=>{if(m.done)return;const ea=refExists(dv,m.a),eb=refExists(dv,m.b);if(ea&&eb)return;m.bye=true;m.done=true;m.sets=[];m.fin='bye';m.winner=ea?'a':eb?'b':null;changed=true})}}
function genMatches(t,dv,kind){t=S_(t,dv);
  if(kind==='q'){const slots=dv.drawQ.slots;const P=slots.length;const R=log2(pow2up(P))-log2(pow2up(t.Q));let prev=[];
    for(let r=0;r<R;r++){const cnt=P/Math.pow(2,r+1);const cur=[];const lbl=R===1?'Квалификация · решающий тур':r===R-1?`Квалификация · ${r+1}-й тур, решающий`:`Квалификация · ${r+1}-й тур`;
      for(let i=0;i<cnt;i++){const a=r===0?slots[2*i]:{k:'w',m:prev[2*i].id},b=r===0?slots[2*i+1]:{k:'w',m:prev[2*i+1].id};cur.push(mkMatch('qual','U',r,i,lbl,a,b))}dv.matches.push(...cur);prev=cur}settleByes(dv);return}
  const slots=dv.drawM.slots;const N=slots.length;const R=log2(N);let prev=[];const rounds=[];
  for(let r=0;r<R;r++){const cnt=N/Math.pow(2,r+1);const cur=[];for(let i=0;i<cnt;i++){const a=r===0?slots[2*i]:{k:'w',m:prev[2*i].id},b=r===0?slots[2*i+1]:{k:'w',m:prev[2*i+1].id};cur.push(mkMatch('main','U',r,i,roundName(cnt),a,b))}dv.matches.push(...cur);rounds.push(cur);prev=cur}

}
function resolve(t,dv,ref){if(!ref)return {p:null,text:'—'};if(ref.k==='pair'){const p=dv.pairs.find(x=>x.id===ref.id);return {p,text:p?pairName(p):'—'}}
  if(ref.k==='q'){const w=dv.qualWinners[ref.n-1];if(w){const p=dv.pairs.find(x=>x.id===w);return {p,text:p?pairName(p):'—'}}return {p:null,text:`победитель квалификации №${ref.n}`}}
  const m=dv.matches.find(x=>x.id===ref.m);if(!m)return {p:null,text:'—'};if(m.done&&m.winner){const side=ref.k==='w'?m.winner:(m.winner==='a'?'b':'a');if(m.bye&&side!==m.winner)return {p:null,text:'—'};return resolve(t,dv,m[side])}if(m.bye)return {p:null,text:'—'};

function courtName(t,n){const x=((t.courtNames||[])[n-1]||'').trim();return x||`Корт ${n}`}

function courtNamesField(o,path){o.courtNames=o.courtNames||[];const n=Math.min(12,Math.max(0,+o.courts||0));if(!n)return '';
  return field('Названия кортов',`<div class="cnames">${Array.from({length:n},(_,i)=>`<label class="cn"><span>${i+1}</span><input class="in" maxlength="24" data-bind="${path}.courtNames.${i}" value="${esc(o.courtNames[i]||'')}" placeholder="Корт ${i+1}"></label>`).join('')}</div>`,'Необязательно: «Центральный», «Fonbet Arena». Пустое поле — «Корт N». Название видно в расписании, на витрине и на табло корта')}
/* Расписание — как на витрине (03_public_page_mobile.md, U1–U8, B10, R3, R5, R6), плюс правка.
   Корты общие для всех дивизионов: в колонках всегда матчи всех дивизионов, n-й запуск каждого корта — в одном ряду.
   Счёт вводится прямо в ячейках сетов; корт, день, время и судья — в окне по нажатию на время матча.
   Фильтры дивизиона, статуса и поиск не убирают матчи, а приглушают: очередь на кортах не сдвигается (U6). */
const SLOT0=600,SLOT_STEP=90,SLOTS_DAY=8;// запуски с 10:00 через 1,5 часа, 8 в день
const toMin=s=>{if(!s)return null;const [h,mm]=String(s).split(':').map(Number);return h*60+(mm||0)};

function findM(t,id){for(const d of t.divisions){const m=d.matches.find(x=>x.id===id);if(m)return [d,m]}return [null,null]}

function placed(t,m){return !!(m.court&&m.day&&m.court<=(+t.courts||0)&&m.day<=dayList(t).length)}

// перенос в конец очереди корта; пустой корт или день — снять с расписания
function moveTo(t,m,court,day){const od=m.day,oc=m.court;m.court=court||null;m.day=day||null;

/* Авторасстановка: матчи без корта и дня встают в свободные запуски по кругам, дивизионы вперемешку,

function autoTime(t,stage,o={}){const days=dayList(t),courts=courtList(t);if(!courts.length){toast('Сначала укажите число кортов в настройках');return 0}

  t.divisions.forEach((d,di)=>d.matches.forEach(m=>{if(m.stage===stage&&!m.bye&&(o.all||(!m.done&&!placed(t,m))))todo.push({m,di})}));
  todo.forEach(({m})=>{m.court=null;m.day=null;m.ord=null});
  const busy=new Set();t.divisions.forEach(d=>d.matches.forEach(m=>{if(m.court&&m.day&&m.time)busy.add(`${m.day}|${m.court}|${Math.round((toMin(m.time)-SLOT0)/SLOT_STEP)}`)}));

// блок настроек: корт, день, начало, судья. У сыгранного матча свёрнут в строку — он уже история, раскрывается «Изменить»

function setBlock(t,m,st,ro){const days=dayList(t),courts=courtList(t);const d=m.day&&days[m.day-1];

// U2: колонки сетов фиксированные, по формату. Ячейка — поле ввода; пока счёт не подтверждён галочкой, ячейки жёлтые

function confirmBar(t,dv,m,rules){const dr=draftOf(m);if(!dr)return '';const w=setsWinner(dr,rules);

/* =====================================================================
   Спонсоры (specs/07_sponsors.md, раздел Г). Организатор загружает один логотип —
   система обрезает поля, убирает однотонный фон, подбирает подложку и считает
   пропорции; размеры во всех местах выводятся из пропорций (равная площадь, СП2)
   ===================================================================== */
const SP_PLACES=[['showcase_top','Страница турнира · шапка','титульный'],['showcase_bottom','Страница турнира · блок «Спонсоры турнира»','все'],['tv_footer','ТВ-режим · шапка и подвал','все'],['tv_slide','ТВ-режим · слайд «Спонсоры турнира»','все'],['draw','Табло жеребьёвки','титульный'],['court','Табло у корта','все'],['overlay','Виджет трансляции','титульный']];
const UPL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>';
const spById=id=>DB.acc.sponsors.find(x=>x.id===id);
const spUsage=id=>DB.tournaments.filter(t=>t.sponsors&&(t.sponsors.main===id||t.sponsors.extra.includes(id)));
function spFit(r,W,H){const h=Math.min(Math.sqrt(.55*W*H/r),H,W/r);return [Math.round(h*r),Math.round(h)]}
/* ячейка: W×H (W=0 — по ширине логотипа или колонки), бокс логотипа bw×bh */
function spCell(x,W,H,bw,bh,st=''){const [w,h]=spFit(x.r,bw,bh);return `<span class="spc ${x.plate==='dark'?'dark':''}" style="${W?`width:${W}px;`:''}height:${H}px;${st}"><img src="${x.src}" alt="${esc(x.name)}" width="${w}" height="${h}"></span>`}
const spRatio=r=>(r>=10?Math.round(r):Math.round(r*10)/10).toString().replace('.',',');
function spFacts(x){return [`Пропорции ${spRatio(x.r)} : 1 — размер в каждом месте система посчитает сама`,`Подложка ${x.plate==='dark'?'тёмная: логотип светлый':'белая'}`,x.vec?'Векторный файл — чёткий на любом экране':`${x.px} px по длинной стороне`]}
function spNameOf(f){const n=String(f||'').replace(/\.[a-z0-9]+$/i,'').replace(/^demo-/,'').replace(/[-_]+/g,' ').replace(/\b(logo|лого|логотип|white|whitebg|wide)\b/gi,'').trim();return n?n[0].toUpperCase()+n.slice(1):''}
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
/* обработка логотипа в браузере — так же должна работать загрузка на сервере */
async function processLogo(src,vec){const img=await loadImg(src);const w0=img.naturalWidth||1000,h0=img.naturalHeight||1000;
  const k=Math.min(1,1600/Math.max(w0,h0)),W=Math.round(w0*k),H=Math.round(h0*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H),p=d.data,o=(i,j)=>(j*W+i)*4,checks=[];
  /* фон: прозрачные углы — фон прозрачный; углы одного цвета — однотонный фон, убираем заливкой от краёв (внутренние детали того же цвета остаются) */
  const cs=[o(0,0),o(W-1,0),o(0,H-1),o(W-1,H-1)];let bg='transparent';
  if(!cs.every(q=>p[q+3]<16)){const c0=cs[0],R=p[c0],G=p[c0+1],B=p[c0+2];
    if(cs.every(q=>p[q+3]>240&&Math.abs(p[q]-R)+Math.abs(p[q+1]-G)+Math.abs(p[q+2]-B)<40)){
      const seen=new Uint8Array(W*H),Qu=new Int32Array(W*H);let qh=0,qt=0;
      const push=n=>{if(seen[n])return;const q=n*4;if(p[q+3]>200&&Math.abs(p[q]-R)+Math.abs(p[q+1]-G)+Math.abs(p[q+2]-B)<60){seen[n]=1;Qu[qt++]=n}};
      for(let i=0;i<W;i++){push(i);push((H-1)*W+i)}for(let j=0;j<H;j++){push(j*W);push(j*W+W-1)}
      while(qh<qt){const n=Qu[qh++];p[n*4+3]=0;const i=n%W;if(i>0)push(n-1);if(i<W-1)push(n+1);if(n>=W)push(n-W);if(n<W*(H-1))push(n+W)}
      bg=R+G+B>690?'white':'color'}else bg='complex'}
  /* поля: рамка по непрозрачным пикселям */
  let x0=W,y0=H,x1=-1,y1=-1,lt=0,op=0;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const q=(j*W+i)*4;if(p[q+3]>20){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
    if(p[q+3]>128){op++;if((.2126*p[q]+.7152*p[q+1]+.0722*p[q+2])/255>.82)lt++}}
  if(x1<0)throw new Error('empty');
  x.putImageData(d,0,0);
  const bw=x1-x0+1,bh=y1-y0+1,s2=Math.min(1,800/Math.max(bw,bh)),out=document.createElement('canvas');out.width=Math.round(bw*s2);out.height=Math.round(bh*s2);
  out.getContext('2d').drawImage(c,x0,y0,bw,bh,0,0,out.width,out.height);
  const plate=lt/Math.max(1,op)>.6?'dark':'light',r=Math.round(bw/bh*100)/100,px=Math.round(Math.max(bw,bh)/k);
  checks.push(['ok',(x0>2||y0>2||x1<W-3||y1<H-3)?'Пустые поля вокруг логотипа обрезаны':'Полей вокруг логотипа нет']);
  checks.push(bg==='transparent'?['ok','Фон прозрачный']:bg==='white'?['ok','Белый фон убран']:bg==='color'?['ok','Однотонный фон убран']:['w','Фон не однотонный — убрать его не получилось. Лучше загрузить PNG на прозрачном фоне']);
  checks.push(['ok',plate==='dark'?'Логотип светлый — подложка тёмная':'Подложка белая']);
  if(!vec&&px<500)checks.push(['w',`Логотип небольшой (${px} px) — на ТВ может быть нечётким. Есть файл крупнее — загрузите его`]);
  if(r>6)checks.push(['w','Логотип очень вытянутый — в узких местах он будет мельче остальных']);
  return {src:out.toDataURL('image/png'),r,plate,px,vec,checks}}

function sponsorsPanel(t){const s=t.sponsors,main=spById(s.main),ex=s.extra.map(spById).filter(Boolean),off=s.hidden.length;
  const row=(x,i,kind)=>`<div class="sprow">${spCell(x,120,56,96,36)}<span class="t"><b>${esc(x.name)}</b>${kind==='extra'&&ex.length>1?`<span>${i+1}-й по порядку</span>`:''}</span>${kind==='extra'?`<button class="btn xs ic" data-act="sp-up" data-i="${i}" ${i?'':'disabled'} title="Выше" aria-label="Выше">↑</button><button class="btn xs ic" data-act="sp-down" data-i="${i}" ${i<ex.length-1?'':'disabled'} title="Ниже" aria-label="Ниже">↓</button>`:`<button class="btn sm" data-act="sp-add" data-tg="main">Заменить</button>`}<button class="btn xs ic" data-act="sp-rm" data-tg="${kind}" data-i="${i}" title="Убрать из турнира" aria-label="Убрать из турнира">×</button></div>`;
  return `<div class="panel ${t.mods.brand?'':'nomod'}"><div class="panel-h"><h3>Спонсоры<span class="q" data-t="Загрузите один логотип на прозрачном фоне — размеры для страницы турнира, ТВ, табло корта и трансляции, подложку и поля система сделает сама">?</span></h3>${t.mods.brand?(main||ex.length?`<span class="r"><button class="btn sm" data-act="sp-preview">Как это выглядит</button></span>`:''):`<span class="r"><span class="hint">модуль не подключён</span><button class="btn sm" data-act="buy-mod" data-m="brand">Подключить · ${rub(PRICE.brand)}</button></span>`}</div><div class="panel-b"><div class="form">
    ${field('Титульный спонсор',main?`<div class="sprows">${row(main,0,'main')}</div>`:`<div><button class="btn" data-act="sp-add" data-tg="main">+ Добавить титульного спонсора</button></div>`,'',{q:'Крупнее всех: баннер в шапке страницы и ТВ, первым в блоке «Спонсоры турнира», в виджете трансляции'})}
    ${field('Партнёры',`<div class="sprows">${ex.map((x,i)=>row(x,i,'extra')).join('')}${ex.length<10?`<div><button class="btn" data-act="sp-add" data-tg="extra">+ Добавить партнёра</button></div>`:''}</div>`,'',{q:'До 10 партнёров. На странице и ТВ — в этом порядке'})}
    <details class="spwhere" ${DB.ui.spWhere?'open':''} ontoggle="DB.ui.spWhere=this.open"><summary>Где показывать<span>${off?`скрыто мест: ${off}`:'везде'}</span></summary><div class="lst">
      ${SP_PLACES.map(([c,l,w])=>`<label class="trow"><button class="toggle ${s.hidden.includes(c)?'':'on'}" data-act="sp-place" data-c="${c}" aria-label="${esc(l)}"></button><b>${esc(l)}</b><span>${w}</span></label>`).join('')}
      <div class="trow"><b>Титульный на ТВ</b><span class="seg"><button class="${s.tv!=='footer'?'on':''}" data-act="sp-tv" data-v="corner">В шапке</button><button class="${s.tv==='footer'?'on':''}" data-act="sp-tv" data-v="footer">В подвале</button></span></div>
      <label class="trow"><button class="toggle ${s.wm?'on':''}" data-toggle="t.sponsors.wm" aria-label="Водяной знак на ТВ"></button><b>Водяной знак на ТВ</b></label>
    </div></details>
  </div></div></div>`}

function spPrevOne(x){return `<figure><div class="pv d"><div style="zoom:.7;flex-wrap:nowrap"><span class="svc">PADEL.<em>SELECT</em></span>${spCell(x,0,48,200,32,'padding:0 16px')}</div></div><figcaption>Шапка страницы турнира</figcaption></figure>

function modalSpAdd(tg,rid){DB.ui.spadd={tg,rid:rid||null,item:null};renderSpAdd()}

async function spLoad(src,fname,vec){const s=DB.ui.spadd,dr=document.getElementById('drop');if(dr)dr.classList.add('busy');

  catch(e){if(dr)dr.classList.remove('busy');toast('Не получилось прочитать картинку — попробуйте PNG или SVG')}}
function spFile(f){if(!f)return;if(!/^image\/(png|svg\+xml|webp|jpeg)$/.test(f.type))return toast('Нужна картинка: PNG, SVG, WEBP или JPG');spLoad(URL.createObjectURL(f),f.name,f.type==='image/svg+xml')}
function spAttach(tg,id){const t=T();if(!t)return;if(tg==='main'){t.sponsors.main=id;t.sponsors.extra=t.sponsors.extra.filter(x=>x!==id)}else if(tg==='extra'&&!t.sponsors.extra.includes(id)&&t.sponsors.extra.length<10){t.sponsors.extra.push(id);if(t.sponsors.main===id)t.sponsors.main=''}}

/* счёт с клавиатуры: Enter — подтвердить (галочка), Esc — отменить ввод, стрелки и Backspace — по ячейкам */
document.addEventListener('keydown',e=>{const el=e.target;
  // выпадающий список: Esc закрывает и возвращает фокус на кнопку, стрелки ходят по пунктам
  if(e.key==='Escape'&&!document.getElementById('pop').hidden){const k=DB.ui.pop&&DB.ui.pop.dd;closePop();if(k)document.querySelector(`[data-dd="${k}"]`)?.focus();return}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&el.closest&&el.closest('#pop .dm')){e.preventDefault();const b=[...document.querySelectorAll('#pop .dm button:not(:disabled)')];const i=b.indexOf(el);const n=b[(i+(e.key==='ArrowDown'?1:-1)+b.length)%b.length];if(n)n.focus();return}
  if(e.key==='Escape'&&document.body.classList.contains('links-open')){document.body.classList.remove('links-open');return}
  // окно матча: Esc отменяет ввод и закрывает окно; без черновика — просто закрывает
  if(e.key==='Escape'&&MM){e.preventDefault();const b=document.querySelector(`#sheet [data-act="m-cancel"]`);if(b)b.click();else closeMatch();return}
  // плитка компактного вида открывается с клавиатуры
  if((e.key==='Enter'||e.key===' ')&&el.classList&&el.classList.contains('mt')){e.preventDefault();el.click();return}
  if(!el.classList||!el.classList.contains('si'))return;const id=el.dataset.sm,k=+el.dataset.k,side=+el.dataset.side;
  if(e.key==='Enter'){e.preventDefault();const b=document.querySelector(`.mc[data-mid="${id}"] [data-act="m-ok"]`);if(b&&!b.disabled)b.click();return}
  if(e.key==='Escape'){const b=document.querySelector(`.mc[data-mid="${id}"] [data-act="m-cancel"]`);if(b)b.click();return}
  const go=(kk,ss)=>{const x=document.querySelector(`.si[data-sm="${id}"][data-k="${kk}"][data-side="${ss}"]:not(:disabled)`);if(x){e.preventDefault();x.focus();x.select()}};
  if(e.key==='ArrowRight')go(k+1,side);else if(e.key==='ArrowLeft')go(k-1,side);else if(e.key==='ArrowDown'||e.key==='ArrowUp')go(k,1-side);
  else if(e.key==='Backspace'&&el.value===''){e.preventDefault();scoreNext(id,k,side,true)}
  else if(e.key==='Tab'&&scoreNext(id,k,side,e.shiftKey))e.preventDefault()});

/* быстрая перемотка демо для показа и скриншотов: ?state=closed|drawq|drawm|qual|main|done */
function randScore(m){const a=Math.random()<.5;const set=()=>{const l=Math.floor(Math.random()*5);return Math.random()<.5?[6,l]:[l,6]};const s1=set(),s2=set();const w1=s1[0]>s1[1]?'a':'b',w2=s2[0]>s2[1]?'a':'b';const sets=[s1,s2];let w=w1===w2?w1:null;if(!w){const st=Math.random()<.5?[10,Math.floor(Math.random()*9)]:[Math.floor(Math.random()*9),10];sets.push(st);w=st[0]>st[1]?'a':'b'}m.sets=sets;m.winner=w;m.done=true;m.fin='normal'}
function fastForward(t,dv,state){const order=['closed','drawq','drawm','qual','main','done'];const i=order.indexOf(state);if(state==='apps'){dv.apps='open';dv.synced='сегодня 12:40';return}if(i<0)return;
  dv.apps='done';if(i<1)return;
  if(hasQual(t,dv)){const pool=drawPool(t,dv,'q').sort(()=>Math.random()-.5);dv.drawQ.slots=pool;fixDraw(t,dv,'q')}if(i<2)return;
  {const pool=drawPool(t,dv,'m').sort(()=>Math.random()-.5);dv.drawM.slots=pool;fixDraw(t,dv,'m')}if(i<3)return;
  if(hasQual(t,dv)){const qs=dv.matches.filter(m=>m.stage==='qual');const half=i===3?Math.ceil(qs.length/2):qs.length;qs.sort((a,b)=>a.r-b.r).slice(0,half).forEach(m=>randScore(m));if(i>3)finishStage(t,dv,'qual')}if(i<4)return;
  if(i>=5)dv.mainDone=true}
