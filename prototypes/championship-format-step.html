<title>Конструктор чемпионата</title>
<link rel="icon" href="../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@1,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#f3f4f6;--border:#e5e7eb;--border-strong:#d1d5db;
  --ink:#111827;--muted:#6b7280;--faint:#9ca3af;
  --accent:#82eb00;--accent-ink:#0b1b06;--accent-soft:#ecfad6;--accent-line:#4f9a00;--display:"Inter Tight","Inter",system-ui,sans-serif;
  --black:#111111;--black-ink:#ffffff;
  --path:#111827;
  --warn:#92400e;--warn-bg:#fef3c7;--err:#b91c1c;--err-bg:#fee2e2;--hint:#1e40af;--hint-bg:#dbeafe;
  --r:8px;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
/* Логотип «Табло»: мяч вместо точки, SELECT на наклонной плашке в акценте скина; правило — assets/tokens.css */
.logo{font-family:var(--display);font-style:italic;font-weight:900;letter-spacing:.02em;white-space:nowrap;text-decoration:none;font-size:17px;color:var(--ink);--logo-plate:var(--accent);--logo-on:var(--accent-ink);--logo-dot:var(--ink)}
.logo .b{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--logo-dot,currentColor);margin:0 .12em 0 .08em;overflow:hidden;text-indent:1em}
.logo em{display:inline-block;position:relative;z-index:0;font-style:italic;color:var(--logo-on);padding:.11em .3em .09em .25em;line-height:1}
.logo em::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--logo-plate);transform:skewX(-12deg);border-radius:.08em}
.pillchip{background:var(--surface-2);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600}
.acct{margin-left:auto}
.avbtn{width:36px;height:36px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 0 transparent;transition:box-shadow .15s}
.avbtn:hover,.acct.open .avbtn{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--border-strong)}
.acct .dd{top:46px;min-width:240px;padding:6px}
.acct .ddh{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.acct .ddh b{display:block;font-size:13.5px}
.acct .ddh span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.acct .dd a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none}
.acct .dd a svg{width:16px;height:16px;color:var(--muted);flex:none}
.acct .dd a:hover{background:var(--surface-2)}
.acct .dd a.cur{font-weight:600;background:var(--surface-2)}
.acct .dd hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu{position:relative}
.menu .dd{position:absolute;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(17,24,39,.12);z-index:15;display:none}
.menu.open .dd{display:block}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.topbar .user:hover{background:var(--surface-2)}
.topbar .user i{width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.topbar .user small{color:var(--muted);font-weight:500;font-size:12.5px}
.topbar .out{color:var(--muted);font-weight:500;font-size:13px;text-decoration:none;padding:8px 4px}
.topbar .out:hover{color:var(--ink)}
.shell{display:grid;grid-template-columns:208px 1fr;min-height:calc(100vh - 56px)}
.sidenav{background:var(--surface);border-right:1px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-weight:500;font-size:14px;}
.sidenav a{color:var(--muted);text-decoration:none;white-space:nowrap;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px;position:relative}
.sidenav a svg{width:18px;height:18px;flex:none}
.sidenav a:hover{background:var(--surface-2);color:var(--ink)}
.sidenav a.cur{font-weight:600;background:var(--surface-2);color:var(--ink)}
.sidenav a.cur::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sidenav a.cur svg{color:var(--accent-line)}
.sidenav .reset{margin-top:auto;font-size:12px;color:var(--faint);padding:9px 10px}
.wiz{padding:22px 24px 40px;min-width:0}
.crumbs{color:var(--muted);font-size:13px;margin-bottom:6px}
h1{font-size:22px;margin:0 0 16px;font-weight:700;letter-spacing:-.01em}
.steps{display:flex;gap:8px;list-style:none;margin:0 0 20px;padding:0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:10px;padding:0 16px 0 10px;height:36px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--border)}
.steps li b{width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.steps li.cur{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.steps li.cur b{background:var(--accent);color:var(--accent-ink)}
.lead{color:var(--muted);margin:0 0 18px;max-width:80ch;font-size:13px}
h2{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 10px}
.base{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.base .field:first-child{margin-right:24px}
.base .alerts{flex-basis:100%}
.base .eq{color:var(--muted);padding-bottom:11px;font-variant-numeric:tabular-nums}
.num.sel{width:140px;height:40px;padding:0 10px;font-weight:600}
.base .num{width:120px;height:40px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink);font-weight:600}
.num{width:90px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-variant-numeric:tabular-nums;font-weight:500}
.num:disabled{color:var(--muted)}
.num.bad{border-color:var(--err);background:var(--err-bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.stages{display:grid;grid-template-columns:1fr 56px 1fr 56px 1fr;gap:0;align-items:stretch;margin-bottom:22px}
.arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.arrow svg{width:32px;height:16px}
.arrow.off{opacity:.35}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;transition:opacity .2s,border-color .2s}
.card:not(.off){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.off{opacity:.6}
.card.off .body{pointer-events:none;filter:grayscale(.6)}
.card .head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card .head .kind{font-size:11px;color:var(--muted);font-weight:600}
.card .head .name{border:0;background:transparent;font-weight:700;font-size:15px;padding:2px 4px;margin-left:-4px;border-radius:6px;width:100%;min-width:0}
.card .head .name:hover{background:var(--surface-2)}
.card .head .name:focus{background:var(--surface-2);outline:1px solid var(--accent)}
.toggle{position:relative;width:40px;height:22px;flex:none;border-radius:999px;background:var(--border-strong);border:0;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:21px}
.toggle:disabled{opacity:.4;cursor:not-allowed}
.headtitle{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.card .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.prow label{color:var(--ink);font-weight:600;font-size:13px}
.prow .val{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.prow .num{width:72px;padding:7px 10px}
.card select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-weight:500}
.card .foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.card .foot b{color:var(--ink);font-size:14px;font-weight:700}
.card .foot .tag{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px;font-weight:700;font-size:11px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.check input{accent-color:var(--accent-line);width:16px;height:16px;margin:0}
.card .alerts{margin-top:auto}
.anim{background:var(--surface-2);border-radius:6px;border:1px solid var(--border);aspect-ratio:1.5;display:block;overflow:hidden}
.anim svg{width:100%;height:100%;display:block}
.typeview{display:flex;flex-direction:column;gap:8px}
.typeview .tt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.typeview .tt b{font-size:15px}
.typeview .tt .code{font-family:var(--mono);font-size:11px;color:var(--accent-line);margin-left:4px}
.typeview p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45}
.typeview .change{flex:none;border:1px solid var(--border-strong);color:var(--ink);background:var(--surface);border-radius:6px;padding:5px 11px;font-weight:600;font-size:12px}
.typeview .change:hover{background:var(--surface-2)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;font-size:12.5px;flex-wrap:wrap}
.alert .id{font-family:var(--mono);font-size:11px;opacity:.7}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.hint{background:var(--hint-bg);color:var(--hint)}
.alert .fix{margin-left:auto;display:flex;gap:6px}
.alert .fix button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;color:inherit}
.nav{display:flex;align-items:center;gap:12px;margin-top:4px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:11px 18px;font-weight:700;font-size:14px}
a.btn{color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary,a.btn.primary{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent;color:var(--ink);font-weight:600}
.nav .sp{flex:1;color:var(--err);font-size:13px;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:12px;border:1px solid var(--border);max-width:1180px;width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.sheet .sh h3{margin:0;font-size:16px}
.sheet .sh .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.sheet .sh .x:hover{background:var(--surface-2)}
.sheet .sb{padding:18px;overflow:auto}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{border:1px solid var(--border);border-radius:8px;padding:14px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.tcard:hover{border-color:var(--border-strong)}
.tcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard.on::after{content:"выбран";position:absolute;top:12px;right:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.tcard.dis{opacity:.5;cursor:not-allowed}
.tcard .code{font-family:var(--mono);font-size:11px;color:var(--accent-line)}
.tcard b{font-size:15px;line-height:1.25;padding-right:64px}
.tcard p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.tcard .why{font-size:11px;color:var(--err)}
#preview .sheet{max-width:none;width:calc(100vw - 40px);height:calc(100vh - 40px)}
#preview .sb{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.prev{display:grid;grid-template-columns:1fr 240px;gap:20px;min-height:0;flex:1;height:100%}
.prev .side{overflow:auto}
.prev .canvas{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden;padding:10px;min-height:0;display:flex}
.prev .canvas svg{display:block;width:100%;height:100%}
.xm{stroke:var(--err);stroke-width:2.5;stroke-linecap:round}
.prev .side{display:flex;flex-direction:column;gap:12px}
.prev .side h4{margin:0;font-size:12px;font-weight:700}
.places{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums;font-size:13px}
.places div{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;background:var(--surface-2)}
.places div.ex{background:var(--accent-soft);font-weight:600}
.places div.hit{outline:2px solid var(--black)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.pctl{display:flex;flex-direction:column;gap:6px}
.pctl label{font-size:12px;font-weight:600}
.pctl select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.n{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2}
.n.bye{stroke-dasharray:2 2;fill:transparent}
.n.in{fill:var(--accent-soft);stroke:var(--accent-line)}
.ln{fill:none;stroke:var(--border-strong);stroke-width:1.1}
.ln.dash{stroke-dasharray:3 3;stroke:var(--accent-line)}
.pth{fill:none;stroke:var(--path);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pn{fill:var(--accent);stroke:var(--path);stroke-width:1.5}
.lab{font-size:10px;fill:var(--muted);font-family:var(--sans);font-weight:600}
.lab.big{font-size:11px;fill:var(--ink)}
.cap{font-size:11px;fill:var(--ink);font-family:var(--sans);font-weight:600}
.box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2;rx:5}
.pl{font-size:10px;fill:var(--ink);font-family:var(--mono)}
.anim .pth{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 4s linear infinite}
@keyframes draw{0%{stroke-dashoffset:var(--len)}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.anim .pth{animation:none;stroke-dashoffset:0}}
@media (max-width:1100px){
  .shell{grid-template-columns:1fr}
  .sidenav{display:none}
  .types{grid-template-columns:1fr}
  .stages{grid-template-columns:1fr}
  .arrow{flex-direction:row;padding:6px 0}
  .arrow svg{transform:rotate(90deg)}
  .base{grid-template-columns:1fr}
  .prev{grid-template-columns:1fr}
}
</style>
<style>
.block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.block h3{margin:0;font-size:15px;font-weight:700}
.block .desc{color:var(--muted);font-size:13px;margin:-4px 0 4px}
.block select{padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-weight:500;width:280px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.addrow button:hover{border-color:var(--border-strong)}
.divs{display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:8px;padding:10px}
.divs:empty{display:none}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.drow .badge{background:var(--surface-2);border-radius:6px;padding:6px 10px;font-weight:700;font-size:12px;min-width:36px;text-align:center}
.drow input{padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-weight:500;min-width:0}
.drow input.bad{border-color:var(--err);background:var(--err-bg)}
.drow .x{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:30px;height:30px;color:var(--muted)}
.drow .x:hover{border-color:var(--err);color:var(--err)}
.empty{color:var(--muted);font-size:13px;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:8px}
</style>

<div class="wiz">
  <div class="crumbs">Чемпионаты / Лиги / Новый чемпионат</div>
  <h1>Создание чемпионата</h1>
  <ol class="steps">
    <li class="done"><b>1</b>Основные настройки</li>
    <li class="cur"><b>2</b>Формат</li>
    <li><b>3</b>Настройки матчей</li>
    <li><b>4</b>Участники</li>
  </ol>

  <div id="format"></div>

  <div class="nav">
    <button class="btn">← Назад</button>
    <span class="sp" id="navnote"></span>
    <button class="btn primary" id="next">Далее →</button>
  </div>
</div>
</div>

<script>
const S = { rounds:1, divisions:[{cat:'m', name:'Мужской 1'}] };
const CATS = {m:{badge:'М', name:'Мужской'}, f:{badge:'Ж', name:'Женский'}, x:{badge:'МК', name:'Микст'}};
const plural = (n,a,b,c) => { const m=n%100, d=n%10; if(m>=11&&m<=19) return c; if(d===1) return a; if(d>=2&&d<=4) return b; return c; };
const $ = s => document.querySelector(s);

function validate(){
  const errors=[]; const names=S.divisions.map(d=>d.name.trim());
  if(names.some(n=>!n)) errors.push({id:'V1',msg:'У каждого дивизиона должно быть название.'});
  const dup=[...new Set(names.filter((n,i)=>n&&names.indexOf(n)!==i))];
  if(dup.length) errors.push({id:'V2',msg:`Названия дивизионов повторяются: ${dup.join(', ')}.`});
  return {errors, names};
}
function render(){
  const v=validate();
  $('#format').innerHTML=`
    <div class="block">
      <h3>Кол-во кругов</h3>
      <select data-change="rounds"><option value="1" ${S.rounds===1?'selected':''}>Однокруговая система</option><option value="2" ${S.rounds===2?'selected':''}>Двухкруговая система</option></select>
      <div class="desc" style="margin:0">Однокруговая — каждая пара играет с каждой один раз, двухкруговая — дважды. Жеребьёвки нет: посев по сумме рейтинга пары.</div>
    </div>
    <div class="block">
      <h3>Дивизионы</h3>
      <div class="desc">У каждого дивизиона свой состав, свои матчи и своя таблица (И, В, Н, П, О). Размер дивизионов может отличаться и определяется составом на шаге «Участники». Без дивизионов чемпионат сыграется одной общей таблицей.</div>
      <div class="addrow">${Object.keys(CATS).map(k=>`<button data-act="div+${k}">+ ${CATS[k].name.toLowerCase()}</button>`).join('')}</div>
      ${S.divisions.length?`<div class="divs">${S.divisions.map((d,i)=>`<div class="drow"><span class="badge">${CATS[d.cat].badge}</span><input value="${d.name}" class="${!d.name.trim()||v.names.indexOf(d.name.trim())!==i?'bad':''}" data-change="name.${i}" placeholder="Название дивизиона"><button class="x" data-act="div-${i}" aria-label="Удалить">×</button></div>`).join('')}</div>`:`<div class="empty">Дивизионов нет — одна общая таблица для всех пар.</div>`}
      ${v.errors.length?`<div class="alerts">${v.errors.map(a=>`<div class="alert err"><span class="id">${a.id}</span><span>${a.msg}</span></div>`).join('')}</div>`:''}
    </div>`;
  $('#next').disabled=v.errors.length>0;
  $('#navnote').textContent=v.errors.length?`${v.errors.length} ${plural(v.errors.length,'ошибка','ошибки','ошибок')} — исправьте, чтобы продолжить`:'';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a.startsWith('div+')){ const cat=a.slice(4); const n=S.divisions.filter(d=>d.cat===cat).length+1; S.divisions.push({cat, name:`${CATS[cat].name} ${n}`}); render(); }
  if(a.startsWith('div-')){ S.divisions.splice(+a.slice(4),1); render(); }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change; if(!k) return;
  if(k==='rounds') S.rounds=+e.target.value; else if(k.startsWith('name.')) S.divisions[+k.slice(5)].name=e.target.value;
  render();
});
render();
</script>

<script>document.addEventListener("click",e=>{const b=e.target.closest(".avbtn");document.querySelectorAll(".menu.open").forEach(m=>{if(!b||!m.contains(b))m.classList.remove("open")});if(b)b.closest(".menu").classList.toggle("open")});</script>
