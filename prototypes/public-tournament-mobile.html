<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Публичная страница турнира · мобильная</title>
<link rel="icon" href="../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@500;600;700&display=swap">
<style>
/* Публичная страница турнира, мобильная версия (целевая ширина 360px).
   Данные — снимок /api/public двух реальных турниров: ?t=4daf356d (ФПР 500, квалификация + УО), ?t=295a92ea (турнир, УО) и ?t=94ddeebe (лига).
   «Сегодня» зафиксировано на дату снимка 2026-10-02, переопределяется ?today=ГГГГ-ММ-ДД. */
:root{--bg:#0c1719;--stripe:#101f22;--panel:#0a0e13;--card:#101c1f;--chip:#18262a;--line:#1c2a2d;--line-strong:#25363a;--ink:#fff;--soft:#b6c4c6;--muted:#8a9ea0;--dim:#5e7174;--lime:#8ae81f;--lime-ink:#0b1b06;--live:#e5736b;--menu:#132225;--card-h:#15262a;--card-grid:#24363a;--conn-c:#3d5357;--status-bg:#182428;--status-ink:#cfd9da;--loser:#93a5a7;--wm:rgba(255,255,255,.07);--flag-ring:rgba(255,255,255,.12);--menu-shadow:0 12px 32px rgba(0,0,0,.55);--display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--names:"Roboto Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* Шапка */
header.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel)}
/* Логотип «Табло»: мяч вместо точки, SELECT на наклонной плашке в акценте скина; правило — assets/tokens.css */
.logo{font-family:var(--display);font-style:italic;font-weight:900;letter-spacing:.02em;white-space:nowrap;text-decoration:none;font-size:17px;--logo-plate:var(--lime);--logo-on:var(--lime-ink);--logo-dot:var(--lime)}
.logo .b{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--logo-dot,currentColor);margin:0 .12em 0 .08em;overflow:hidden;text-indent:1em}
.logo em{display:inline-block;position:relative;z-index:0;font-style:italic;color:var(--logo-on);padding:.11em .3em .09em .25em;line-height:1}
.logo em::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--logo-plate);transform:skewX(-12deg);border-radius:.08em}
.spn,.spf,.partners{display:none}

/* Скин титульного спонсора «Светлая сторона» (?skin=svetlaya), по брендированной витрине brand-showcase-svetlaya.html:
   нейтральный чёрный вместо бирюзового, кислотный лайм, лаймовая полоса сверху с логотипом сервиса, знаком спонсора и партнёрами */
html.sk-sv{--bg:#0b0b0b;--stripe:#101010;--panel:#161616;--card:#141414;--chip:#1c1c1c;--line:#242424;--line-strong:#333;--soft:#b8bfb8;--muted:#a3a8a3;--dim:#666c66;--lime:#b8dc1e;--lime-ink:#0b0f02;--menu:#171717;--card-h:#1a1a1a;--card-grid:#2a2a2a;--conn-c:#474747;--status-bg:#1c1c1c;--status-ink:#d6dbd6;--loser:#9a9f9a}
.sk-sv header.top{gap:10px;background:var(--lime);color:var(--lime-ink)}
.sk-sv .logo{--logo-plate:var(--lime-ink);--logo-on:var(--lime);--logo-dot:var(--lime-ink)}
.sk-sv .spn{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto;background:var(--bg);color:#fff;border-radius:6px;padding:6px 10px 6px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1;white-space:nowrap}
.sk-sv .spn .mark{width:20px;height:20px;border-radius:50%;flex:none;background:linear-gradient(90deg,var(--bg) 0 48%,#fff 48% 52%,var(--lime) 52%);border:2px solid #fff}
.sk-sv .share{border-color:rgba(11,15,2,.35);color:var(--lime-ink)}
/* телефон: логотип, знак спонсора и «Поделиться» в одну строку на 360px */
html.sk-sv:not(.desk) .logo{font-size:15px}
html.sk-sv:not(.desk) .spn{gap:6px;padding:5px 8px 5px 5px;font-size:10px;letter-spacing:.05em}
html.sk-sv:not(.desk) .spn .mark{width:18px;height:18px}
html.sk-sv:not(.desk) .spn{overflow:hidden}
html.sk-sv:not(.desk) .spn>span{overflow:hidden;text-overflow:ellipsis}
html.sk-sv:not(.desk) .share{flex-shrink:0}
@media (max-width:349px){html.sk-sv:not(.desk) header.top{gap:8px;padding:0 12px}html.sk-sv:not(.desk) .logo{font-size:13px}html.sk-sv:not(.desk) .spn{letter-spacing:.02em}}

/* Скин FONBET (?skin=fonbet), по брендированной витрине brand-showcase-fonbet.html: светлая тема, акцент — красный FONBET,
   красная полоса сверху: логотип сервиса, «Титульный спонсор» с белой плашкой FONBET, на десктопе партнёры */
html.sk-fb{--bg:#fff;--stripe:#f5f7f8;--panel:#fff;--card:#fff;--chip:#f0f3f4;--line:#e6eaec;--line-strong:#d5dcde;--ink:#12181b;--soft:#3d4a4f;--muted:#68777d;--dim:#9aa8ad;--lime:#e11b22;--lime-ink:#fff;--menu:#fff;--card-h:#f7f9fa;--card-grid:#e1e6e8;--conn-c:#c3cdd0;--status-bg:#f0f3f4;--status-ink:#3d4a4f;--loser:#7d8a8f;--wm:rgba(225,27,34,.10);--flag-ring:rgba(18,24,27,.18);--menu-shadow:0 12px 32px rgba(18,24,27,.16)}
.sk-fb header.top{gap:10px;background:var(--lime);color:#fff}
.sk-fb .logo{--logo-plate:#fff;--logo-on:var(--lime);--logo-dot:#fff}
.sk-fb .spf{display:flex;align-items:center;gap:10px;margin-right:auto}
.sk-fb .spf i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.sk-fb .spf b{background:#fff;color:var(--lime);border-radius:6px;padding:5px 12px;font-family:var(--display);font-weight:900;font-style:italic;font-size:17px;line-height:1}
.sk-fb .share{border-color:rgba(255,255,255,.5);color:#fff}
.desk.sk-fb .spf{margin-left:8px;margin-right:0}
.desk.sk-fb .partners{display:flex;gap:10px;margin-left:auto}
.desk.sk-fb .partners i{font-style:normal;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
/* телефон: подпись «Титульный спонсор» не помещается — только плашка FONBET */
html.sk-fb:not(.desk) .spf i{display:none}
.desk.sk-sv .spn{font-size:13px;letter-spacing:.14em;padding:6px 12px 6px 8px;margin-left:8px;margin-right:0}
.desk.sk-sv .spn .mark{width:22px;height:22px}
.desk.sk-sv .partners{display:flex;gap:10px;margin-left:auto}
.desk.sk-sv .partners i{font-style:normal;border:1px solid rgba(11,15,2,.4);border-radius:5px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.share{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-strong);background:transparent;border-radius:8px}
.share svg{width:18px;height:18px}

/* Hero: A1 — компактнее, название до 3 строк */
.hero{position:relative;overflow:hidden;background:repeating-linear-gradient(180deg,var(--bg) 0 36px,var(--stripe) 36px 72px);padding:14px 16px 16px;text-align:left}
.wm{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-style:italic;font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--wm);white-space:nowrap;pointer-events:none}
.rel{position:relative}
.kick{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.kick .kt{white-space:nowrap}
.kick .ks{font-style:normal;color:var(--dim);margin-right:8px}
.status{display:inline-flex;align-items:center;gap:6px;height:22px;border:1px solid var(--line-strong);background:var(--status-bg);border-radius:4px;padding:0 10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--status-ink)}
.status.live{background:var(--live);border-color:var(--live);color:#fff}
.status.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
/* телефон: подзаголовок плотнее, чтобы «LIVE · город · даты · категория» вставал в одну строку на 360px */
html:not(.desk) .kick{gap:4px 5px;letter-spacing:.03em}
html:not(.desk) .kick .ks{margin-right:5px}
html:not(.desk) .kick .status{height:20px;padding:0 6px;gap:5px;font-size:10px;letter-spacing:.06em}
/* разделитель в начале перенесённой строки не показываем */
.kick .kt.nl .ks{display:none}
.kick .kbr{flex-basis:100%;height:0}
h1{font-family:var(--display);font-weight:900;font-style:italic;font-size:24px;line-height:1.06;text-transform:uppercase;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
h1.long{font-size:22px}

/* A3 — закреплённые вкладки с прокруткой к активной */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin-top:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hs.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.tabs .hs{padding:0 16px;gap:4px}
/* вкладки — текстовая навигация, как в референсе: активная лаймовая с ромбом */
.tab{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 14px;border:0;background:transparent;color:var(--soft);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tab:first-child{padding-left:0}
.tab.on{color:var(--lime)}
.tab.on::after{content:"◆";font-size:8px;line-height:1}

.content{padding:14px 16px 40px}

/* Контролы */
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;color:var(--soft);min-height:44px;padding:0 12px;font-weight:600;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
/* корты: поровну на всю ширину; длинные названия кортов («Fonbet Arena») — кнопка по тексту, ряд листается вбок */
.seg.full{width:auto;min-width:100%}.seg.full button{flex:1 0 auto;padding:0 10px}
.filters{margin:0 -16px 10px;padding:0 16px}
/* Выпадающие списки фильтров */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fgrid>.dsel:only-child{grid-column:1/-1}
.dsel{position:relative;min-width:0}
.dd2{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.dd2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd2::after{content:"";flex-shrink:0;width:7px;height:7px;border-right:2px solid var(--lime);border-bottom:2px solid var(--lime);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.dd2[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:4px}
.dd2.set{border-color:var(--lime)}
/* на телефоне три списка в один ряд (2026-10-25): подписи на кнопках короткие («27 СЕН», «СТАТУС», «СКОРО»), в открытом списке — полные;
   день по ширине подписи, остальные делят ряд поровну; список открывается на всю ширину ряда, чтобы не вылезать за край экрана */
html:not(.desk) .fgrid .dd2{padding:0 12px;gap:8px;letter-spacing:.03em}
html:not(.desk) .fgrid.n3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:relative}
html:not(.desk) .fgrid.n3.dayf{grid-template-columns:max-content minmax(0,1fr) minmax(0,1fr)}
html:not(.desk) .fgrid.n3 .dd2{padding:0 10px;gap:6px;font-size:12px;letter-spacing:.02em}
html:not(.desk) .fgrid.n3>.dsel{position:static}
html:not(.desk) .fgrid.n3>.dsel .dmenu{left:0;right:0;width:auto;max-width:none}
@media (max-width:359px){html:not(.desk) .fgrid.n3 .dd2{padding:0 8px;gap:5px;font-size:11px;letter-spacing:0}}
/* лига: на телефоне два ряда — «дата · дивизион» и «клуб · матчи»; на десктопе все четыре в одну строку */
.fgrid.lg2{display:flex;flex-direction:column;gap:8px}
.fgrid.lg2 .fr{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px}
.fgrid.lg2 .fr.b{grid-template-columns:1fr 1fr}
.fgrid.lg2 .fr>.dsel:last-child .dmenu{left:auto;right:0}
.desk .fgrid.lg2{flex-direction:row;margin-bottom:14px}
.desk .fgrid.lg2 .fr{display:contents}
.desk .fgrid.lg2 .fr>.dsel:last-child .dmenu{left:0;right:auto}
.dd2[aria-expanded="true"]{border-color:var(--soft)}
.dmenu{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:calc(100vw - 32px);padding:4px;background:var(--menu);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--menu-shadow);max-height:340px;overflow:auto}
.fgrid>.dsel:last-child:not(:first-child) .dmenu{left:auto;right:0}
.dmenu button{text-transform:uppercase;letter-spacing:.05em;font-size:13px!important;width:100%;padding-top:8px!important;padding-bottom:8px!important;line-height:1.3;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 10px;border:0;border-radius:6px;background:transparent;font-size:14px;text-align:left;color:var(--ink)}
.dmenu button:hover:not(:disabled),.dmenu button:focus-visible{background:var(--chip);outline:none}
.dmenu button.on{color:var(--lime);font-weight:600}
.dmenu button.on::after{content:"✓"}
.dmenu button:disabled{color:var(--dim);cursor:default}
@media (prefers-reduced-motion:reduce){.dd2::after{transition:none}}


.dayh{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-family:var(--display);font-weight:800;font-style:italic;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.dayh:first-child{margin-top:0}
.dayh .today{font-family:var(--sans);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--lime);color:var(--lime-ink);border-radius:3px;padding:2px 6px}
.list{display:flex;flex-direction:column;gap:14px}

/* Карточка матча — одна для телефона и десктопа, расчерчена как таблица:
   шапка (этап | время) · строка 1-й пары · строка 2-й пары; внутри строки — посев | имена | сет | сет | сет */
.mc{--grid:var(--card-grid);border:1px solid var(--grid);border-radius:8px;background:var(--card);overflow:hidden}
.mc.live{border-color:var(--lime)}
.mh{display:flex;align-items:stretch;justify-content:space-between;min-height:38px;background:var(--card-h);border-bottom:1px solid var(--grid)}
.mh .ml{align-self:center;min-width:0;padding:7px 10px;font-size:11px;line-height:1.35;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mh .ml .mn{display:block;font-weight:800;color:var(--lime)}
.mh .ml .st{display:block}
.mh .ml .st>span{white-space:nowrap}
.mh .hr,.mh .chipc{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:4px;width:var(--scw,96px);padding:4px 6px;text-align:center;line-height:1.2;border-left:1px solid var(--grid);font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap}
.mh .hr b{color:var(--ink);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.mh .hr svg{flex-shrink:0;color:var(--muted)}
.mh .hr.nb{flex-direction:column;gap:1px}
.mh .hr.nb i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mh .hr.tbd{white-space:normal;font-size:11px}
.mh .hr.fin{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{flex-shrink:0;border:1px solid var(--line-strong);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip.live{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.pr{display:flex;align-items:stretch;min-height:56px;position:relative}
.pr+.pr{border-top:1px solid var(--grid)}
/* победитель выделен только контрастом (как в референсе): жирные белые имена и счёт, у проигравшего всё приглушено; без полосы и заливки */
.seed{flex-shrink:0;width:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1px solid var(--grid);font-size:12px;line-height:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seed i{font-style:normal;font-size:11px;letter-spacing:.02em}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 6px 6px 8px;font-family:var(--names);font-size:15px;line-height:19px;font-weight:500;letter-spacing:.01em}
.nm>span{display:flex;align-items:center;gap:5px;overflow-wrap:anywhere}
.nm .src{display:block;color:var(--muted);font-family:var(--sans);font-style:italic;font-size:13px}
.pr.w .nm{font-weight:700}
.pr.l .nm{color:var(--loser)}
.fl{flex-shrink:0;width:16px;height:12px;border-radius:2px;background:linear-gradient(#fff 0 33.4%,#1c57a5 33.4% 66.7%,#d52b1e 66.7%) center/cover;box-shadow:0 0 0 1px var(--flag-ring)}
.pr.l .fl{opacity:.75}
.sc{display:flex;flex-shrink:0;font-family:var(--display);font-weight:800;font-size:17px;color:var(--dim)}
.sc span{position:relative;width:32px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--grid);white-space:nowrap;font-variant-numeric:tabular-nums}
.sc span.up{color:var(--ink)}
/* матч в 1 сет: одна ячейка шириной с три — линии шапки и пар совпадают с соседними карточками */
.sc.one span{width:96px}
.pr.l .sc span.up{color:var(--soft)}
.sc span.ns{color:var(--line-strong);font-weight:600}
/* причина отказа на месте счёта снявшейся пары */
.sc span.rt{padding:0 4px;font-family:var(--sans);font-size:11px;line-height:1.25;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:normal;color:#e5736b}
.tree .sc span.rt{width:calc(var(--rtw, 96px) * .8125) !important;font-size:11px}
/* тай-брейк надстрочно внутри ячейки: «7⁽¹⁰⁾» помещается в 32px */
.sc sup{font-size:9px;font-weight:700;letter-spacing:-.03em;margin-left:1px;align-self:flex-start;margin-top:calc(50% - 4px)}
.mf{padding:7px 10px;border-top:1px solid var(--grid);font-size:12px;line-height:1.35;color:var(--muted)}
.mc .nxs{margin:0;padding:8px;border-top:1px solid var(--grid)}

.nxs{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

/* Десктоп от 1024px: расписание колонками по кортам (U1–U8), остальные вкладки — колонкой 640px по центру */
/* мобильная версия: полосы прокрутки нет, как на телефоне — экран ровно 360px */
html:not(.desk){scrollbar-width:none}

/* ---------- Десктопная версия (?view=desktop): своя раскладка, не зависит от ширины окна ---------- */
.desk .app{max-width:none}
/* шапка десктопа на всю ширину, крупное название — как на сайте */
/* как в референсе: всё содержимое в одном контейнере до 1440px по центру, фон шапки — на всю ширину.
   --gx — боковое поле: 32px на узком экране, на широком — до края контейнера */
.desk{--gx:max(32px,calc((100vw - 1440px) / 2 + 32px))}

.desk .content{padding:20px var(--gx) 48px}
.desk .content:not(.wide){max-width:688px;margin:0 auto;padding-left:32px;padding-right:32px}
.desk .dfl{margin:0 0 16px}

/* фильтры на десктопе — по ширине подписи (минимум 170px, чтобы кнопка не прыгала при смене значения) */
.desk .fgrid{display:flex;flex-wrap:wrap;gap:8px;margin:0}

.desk .fnote2{display:block;font-size:13px;color:var(--muted);margin-top:8px}
/* корты — колонки; матчи с одинаковым номером в очереди стоят в одном ряду и одной высоты */
/* ширина колонки корта ограничена (340–420px), как в референсе: широкий экран вмещает больше кортов, а не растягивает карточки */
.desk .cols{display:grid;grid-template-columns:repeat(var(--n),minmax(340px,420px));justify-content:start;gap:14px 16px;overflow-x:auto}
.desk .colh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:12px;border-radius:6px;background:var(--chip);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}

/* шапки карточек в ряду одной высоты (до 2 строк), чтобы строки пар на соседних кортах совпадали */
.desk .cols .mh{min-height:46px}
/* в ряду карточки одной высоты; лишнюю высоту забирает шапка, поэтому строки пар на соседних кортах совпадают */
.desk .cols>.mc{display:flex;flex-direction:column}
.desk .cols>.mc>.mh{flex:1 0 auto}
.desk .cols>.empty{padding:16px 0}
.desk .mc.dim{opacity:.3}

   Десктоп: колонки 270–340px в контейнере. Строка названий раундов закреплена под вкладками и едет вбок вместе с деревом */
.tree{--conn:var(--conn-c);--half:12px;--colw:280px;display:grid;grid-template-columns:repeat(var(--n),var(--colw));justify-content:start;column-gap:calc(var(--half) * 2);row-gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 8px;scroll-padding:0 16px;scroll-snap-type:x proximity;scrollbar-width:none}

<script>
const RAW = JSON.parse(document.getElementById('data').textContent);
const Q = new URLSearchParams(location.search);
const T = RAW[Q.get('t')] || RAW['295a92ea'];
// Названия кортов задаёт организатор в настройках турнира (в /api/public нужно поле courtNames: строки по номеру корта, пустая — «Корт N»).
// В демо у турнира с группами корты 1 и 3 названы, чтобы было видно, как это выглядит
if (T.code === 'da36e9c5' && !T.courtNames) T.courtNames = ['Центральный', '', 'Fonbet Arena'];

const TOP = T.divisions.filter(d => !d.parentId);

const divShort = d => d.title.replace(/^Дивизион\s+/, '');
// чипы дивизионов: в лиге полные названия (D2), у турнира с группами — как на сайте, «М», «Ж»
const divChip = d => GROUPED ? d.title[0] : divShort(d);
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON3 = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const START = new Date(T.dateStart + 'T00:00:00');
const dayDate = i => { const d = new Date(START); d.setDate(d.getDate() + i - 1); return d; };
const N_DAYS = T.dayLabels.length;
// «Сегодня»: у лиги — дата снимка 2026-10-02, у турнира — его последний день (демо идущего турнира); переопределяется ?today=
const TODAY = Q.get('today') ? new Date(Q.get('today') + 'T00:00:00') : LEAGUE ? new Date('2026-10-02T00:00:00') : dayDate(N_DAYS);
const TODAY_IDX = Math.round((TODAY - START) / 864e5) + 1;
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const st = m => m.live ? 'live' : m.result ? 'done' : 'wait';
const isBye = m => m.result && m.result.special === 'bye';

// Демо: турнир ещё идёт (снимки взяты после окончания). Последний день: первая половина матчей сыграна, следующий идёт
// с неполным счётом, остальные впереди; призёров ещё нет. Пары матчей, ждущих победителя или проигравшего несыгранного
// матча, неизвестны — вместо них подпись источника. Завершённый вид — ?finished=1
if (!LEAGUE && !Q.get('finished')) {
  T.state = 'live';
  const day = T.matches.filter(m => m.day === N_DAYS && !isBye(m)).sort((a, b) => timeKey(a) - timeKey(b) || (a.court || 0) - (b.court || 0));
  const cleared = new Set(day.slice(Math.floor(day.length / 2)));
  [...cleared].forEach((m, i) => {
    const s0 = (m.result && m.result.sets) || [];
    if (i === 0 && s0.length) {
      m.live = true;
      m.liveScore = s0.length > 1 ? [s0[0], {a: Math.min(s0[1].a, 4), b: Math.min(s0[1].b, 3)}] : [{a: Math.min(s0[0].a, 4), b: Math.min(s0[0].b, 3)}];
    }
    m.result = null;
  });
  const queue = [...cleared];
  while (queue.length) {
    const m = queue.shift(), sn = srcName(m.round);
    if (!sn) continue;
    for (const kind of ['победитель', 'проигравший']) {
      const lab = `${kind} ${sn} №${m.number}`;
      T.matches.filter(x => x.divisionId === m.divisionId && (x.sourceLabel1 === lab || x.sourceLabel2 === lab)).forEach(x => {
        if (x.sourceLabel1 === lab) x.pair1 = null;
        if (x.sourceLabel2 === lab) x.pair2 = null;
        if (!cleared.has(x)) { x.result = null; x.live = false; cleared.add(x); queue.push(x); }
      });
    }
  }
}

// Стартовый день: сегодня, если турнир идёт; до старта — первый, после — последний (B4)
const clampDay = i => Math.min(Math.max(i, 1), N_DAYS);

const state = {
  tab: Q.get('tab') || 'schedule',
  // турнир
  day: clampDay(TODAY_IDX), court: 0, mf: 'all',
  // R4: этап сетки общий для всех дивизионов, номер раунда запоминается по дивизиону и этапу
  bk: {}, gdiv: '', stage: GROUPED ? 'group' : 'upper',
  // лига
  div: '', club: '', selDay: clampDay(TODAY_IDX), more: 0, before: 0, undatedOpen: false,
  sdiv: '', pdiv: '',

  follow: null, flash: null

/* ---------- Подписи этапов (C2) ---------- */
const RL = {r128:'1/64 финала', r64:'1/32 финала', r32:'1/16 финала', r16:'1/8 финала', qf:'1/4 финала', sf:'1/2 финала', final:'Финал', lsf:'1/2 финала', lfinal:'Финал', qo8:'Квалификация · 1-й круг', qo4:'Квалификация · 1-й круг', qo2:'Квалификация · финал'};
function roundName(code, m) {
  code = code.replace(/^d(?=qf|sf|final|r\d)/, '');   // раунды утешительной сетки ДТ: dqf, dsf, dfinal
  if (m && m.isFifthPlace) return 'Матч за 5-е место';
  if (code === 'third' || (m && m.isThirdPlace)) return 'Матч за 3-е место';
  const lr = code.match(/^lr(\d+)$/);
  if (lr) return `${lr[1]}-й круг`;
  return RL[code] || code;
}
function roundLabel(m) {
  if (LEAGUE) {
    const r = m.round.match(/^r(\d+)t(\d+)$/), l = r ? `${r[1]}-й круг · ${r[2]}-й тур` : m.round;
    // B8: при фильтре «Дивизион: Все» дивизион пишется в строке этапа
    return !state.div && D[m.divisionId] ? `${divShort(D[m.divisionId])} · ${l}` : l;
  }
  const div = topOf(m.divisionId), pre = !state.div && div ? div.title + ' · ' : '';
  if (m.phase === 'group') {
    const r = m.round.match(/^r(\d+)t(\d+)$/);
    return `${!state.div && div ? div.title[0] + ' · ' : ''}${D[m.divisionId].title} · ${r ? `${r[1]}-й круг · ${r[2]}-й тур` : m.round}`;
  }
  const l = roundName(m.round, m);
  if (/^d(qf|sf|final|r\d)/.test(m.round)) return pre + 'Утешительная (ДТ) · ' + l;
  return pre + (m.branch === 'lower' && !m.isFifthPlace ? 'Нижняя сетка · ' + l : l);
}

/* ---------- Время (B2) ---------- */
function timeKey(m) {
  if (m.time) return toMin(m.time);
  const same = T.matches.filter(x => x.day === m.day && x.court === m.court && x.time);
  return same.length ? Math.max(...same.map(x => toMin(x.time))) + 1 : 9999;
}
// R6: у завершённого матча вместо времени начала — длительность.
// В /api/public длительности нет: нужно поле durationMin из судейского приложения (от первого розыгрыша до последнего).
// Пока поля нет, прототип оценивает длительность по счёту — только для демонстрации.
function durationMin(m) {
  if (m.durationMin) return m.durationMin;
  const r = m.result;
  if (!r || r.special || !(r.sets || []).length) return null;
  let min = 0, h = 0;
  r.sets.forEach(x => { min += Math.max(x.a, x.b) >= 10 ? 12 : (x.a + x.b) * 4.3 + 2 + (x.tb != null ? 6 : 0); });
  for (const ch of m.id) h = (h * 31 + ch.charCodeAt(0)) % 997;
  // демо: у части матчей (примерно у каждого пятого) длительность не записана — в шапке «Завершён»
  if (h % 5 === 0) return null;
  return Math.round(min + h % 9 - 4);
}
const wordN = (n, w) => { const a = n % 10, b = n % 100; return w[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 1 : 2]; };

/* ---------- Карточка матча ---------- */
const SPECIAL = {retired: 'Отказ', technical: 'Тех. поражение', walkover: 'Неявка'};
// число колонок сетов — по формату этапа: максимум сетов среди матчей той же фазы и сетки (группы и ДТ бывают в 1 сет).
// В API формата матча нет; когда появится — брать оттуда
const setKey = m => `${m.phase || '_'}|${m.branch}`;
const SET_COLS = {};
T.matches.forEach(m => { const k = setKey(m), n = ((m.result || {}).sets || []).length; SET_COLS[k] = Math.max(SET_COLS[k] || 0, n); });
const setCols = m => SET_COLS[setKey(m)] || 0;
const TIMER = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="9" r="5.5"/><path d="M8 6v3l2 1.5M6.5 1.5h3"/></svg>';
// Справа в шапке: время начала, «не ранее», «затем»; у завершённого — длительность (R6)
function timeInfo(m) {
  if (isBye(m)) return '<span class="hr"></span>';
  const dur = st(m) === 'done' ? durationMin(m) : null;
  if (dur) { const h = Math.floor(dur / 60), mm = dur % 60;
    const t = [h ? `${h} ч` : '', mm || !h ? `${mm} мин` : ''].filter(Boolean).join(' ');
    return `<span class="hr" aria-label="Матч длился ${t}">${TIMER}${t}</span>`; }
  // завершён, но длительность не записана — как в референсе, «Завершён» вместо времени
  if (st(m) === 'done') return '<span class="hr fin">Завершён</span>';
  if (m.time) return m.timeMode === 'not_before' ? `<span class="hr nb"><i>не ранее</i><b>${m.time}</b></span>` : `<span class="hr"><b>${m.time}</b></span>`;
  if (m.timeMode === 'after') return '<span class="hr">затем</span>';
  return '<span class="hr tbd">время уточняется</span>';
}
function card(m, o = {}) {
  const s = st(m), r = m.result, w = r ? r.winner : 0;
  const sets = r && !isBye(m) ? r.sets || [] : m.live && m.liveScore ? m.liveScore : [];
  // U4: чип только у идущего матча и у особого исхода; о завершении говорят счёт и длительность
  const chip = s === 'live' ? '<span class="chip live">● LIVE</span>' : '';
  // Отказ, неявка, тех. поражение — как в референсе: у снявшейся пары вместо счёта причина, у победителя прочерки
  const spec = r && SPECIAL[r.special] ? (r.reason || SPECIAL[r.special]) : '';
  // ячейки сетов есть у любого матча — и у несыгранного (пустые), чтобы карточка была расчерчена одинаково
  const nCols = spec ? Math.max(setCols(m), 1) : sets.length ? Math.max(sets.length, setCols(m)) : setCols(m) || 3;
  const side = i => {
    const id = i === 1 ? m.pair1 : m.pair2, p = P[id];
    const names = p ? playersHtml(p)
      : `<span class="src">${isBye(m) ? 'Бай' : esc(i === 1 ? m.sourceLabel1 : m.sourceLabel2)}</span>`;
    // U2: колонки сетов фиксированные — несыгранный сет «—», счёт стоит ровно в соседних карточках
    if (spec) {
      const sc = w === i ? Array.from({length: nCols}, () => '<span class="ns" aria-hidden="true">—</span>').join('')
        : `<span class="rt" style="--rtw:${(nCols === 1 ? 3 : nCols) * 32}px;width:var(--rtw)">${esc(spec)}</span>`;
      return `<div class="pr ${w === i ? 'w' : 'l'}${id && id === state.follow ? ' fp' : ''}"${p ? ` data-pair="${id}" role="button" aria-label="Следить за парой ${esc(pairLine(id))}"` : ''}>${seedTag(id, m)}<div class="nm">${names}</div><div class="sc${nCols === 1 ? ' one' : ''}">${sc}</div></div>`;
    }
    const sc = Array.from({length: nCols}, (_, k) => sets[k]).map(x => { if (!x) return `<span class="ns" aria-hidden="true">${sets.length ? '—' : ''}</span>`;
      const a = i === 1 ? x.a : x.b, b = i === 1 ? x.b : x.a;
      return `<span class="${a > b ? 'up' : ''}">${a}${x.tb != null && a > b ? `<sup>(${x.tb})</sup>` : ''}</span>`; }).join('');
    const cls = (w ? (w === i ? 'w' : 'l') : '') + (id && id === state.follow ? ' fp' : '');
    return `<div class="pr ${cls}"${p ? ` data-pair="${id}" role="button" aria-label="Следить за парой ${esc(pairLine(id))}"` : ''}>${seedTag(id, m)}<div class="nm">${names}</div>${sc ? `<div class="sc${nCols === 1 ? ' one' : ''}">${sc}</div>` : ''}</div>`;
  };
  const n = o.order && courtOrder(m);
  // шапка в две строки, как в референсе: сверху номер матча в очереди (и корт в общем списке), ниже — стадия
  const top = o.head || [o.court && m.court ? courtLabel(m.court) : '', n ? `${n}-й запуск` : ''].filter(Boolean).join(' · ');
  const stage = o.head ? '' : roundLabel(m);
  // Q1: короткого названия клуба в справочнике пока нет — клуб полным названием отдельной строкой
  const club = o.venue && V[m.venueId] ? `<div class="mf">${esc(V[m.venueId].title)}</div>` : '';
  const dim = o.dimOthers && state.follow && m.pair1 !== state.follow && m.pair2 !== state.follow;
  const right = chip ? `<span class="chipc">${chip}</span>` : timeInfo(m);
  // ячейка времени в шапке шириной с колонки счёта — вертикальные линии шапки и пар совпадают
  const scw = `--scw:${(nCols === 1 ? 3 : nCols || setCols(m) || 3) * 32}px`;
  return `<article class="mc ${s}${dim || o.off ? ' dim' : ''}${state.flash === m.id ? ' flash' : ''}" data-mid="${m.id}" style="${scw}${o.style ? ';' + o.style : ''}">
      ${o.bare ? '' : `<div class="mh"><span class="ml">${top ? `<b class="mn">${esc(top)}</b>` : ''}${stage ? `<span class="st">${stage.split(' · ').map(t => `<span>${esc(t)}</span>`).join(' · ')}</span>` : ''}</span>${right}</div>`}
      ${side(1)}${side(2)}${club}${o.links ? nextLinks(m) : ''}${o.bare ? bareFoot(m) : ''}
    </article>`;
}

/* ---------- R5: номер матча в очереди корта ---------- */
// Порядок внутри дня и корта — как в расписании (timeKey, при равенстве — номер матча), баи не считаются
const COURT_ORDER = {};
{ const g = {};
  T.matches.filter(m => m.day && m.court && !isBye(m)).forEach(m => (g[m.day + '|' + m.court] = g[m.day + '|' + m.court] || []).push(m));
  Object.values(g).forEach(ms => ms.sort((a, b) => timeKey(a) - timeKey(b) || a.number - b.number).forEach((m, i) => COURT_ORDER[m.id] = i + 1)); }
const courtOrder = m => !LEAGUE && COURT_ORDER[m.id];

// С3: в карточке дерева шапки и времени нет, у идущего матча снизу — LIVE
const bareFoot = m => m.live ? '<div class="mt live">● LIVE</div>' : '';

/* ---------- Флаги: всегда, у каждого игрока ---------- */
// Страны игрока в /api/public пока нет (нужно поле country, ISO-2). До его появления прототип считает всех игроков из России.
const flag = x => { const c = (x.country || 'RU').toUpperCase();

const playersHtml = p => p.players.map(x => `<span>${flag(x)}${esc(pl(x))}</span>`).join('');
// игрок с флагом не разрывается; если пара не помещается в строку, перенос идёт после «/»
const pairHtml = id => P[id] ? P[id].players.map(x => `<i class="pw">${flag(x)}${esc(pl(x))}</i>`).join(' / ') : '';

/* ---------- R3: посев, Q, WC ---------- */
// В основной сетке пара из квалификации — «Q» вместо номера посева; в матчах квалификации — её посев в квалификации.
// WC — второй строкой, напротив второго игрока. В лиге посев не показываем.
const isQual = m => /^qo\d+$/.test(m.round);
function seedTag(id, m) {
  if (LEAGUE) return '';
  const p = P[id];
  if (!p) return '<span class="seed"></span>';
  const top = p.stage === 'qualification' && !isQual(m) ? 'Q' : p.seed ?? '';
  const wc = p.isWildcard ? 'WC' : '';
  const label = [top === 'Q' ? 'из квалификации' : top !== '' ? `посев ${top}` : '', wc ? 'уайлд-кард' : ''].filter(Boolean).join(', ');
  return `<span class="seed"${label ? ` aria-label="${label}"` : ''}><b>${top || wc}</b>${top !== '' && wc ? `<i>${wc}</i>` : ''}</span>`;
}

/* ---------- R2: куда идут победитель и проигравший ---------- */
// Связь берём из подписи источника следующего матча: «победитель 1/8 №3», «проигравший 1/4 №2», «победитель квал. 1/2 №1»
function srcName(c) {
  let p = '';
  if (/^d(qf|sf|r\d)/.test(c)) { p = 'ДТ '; c = c.slice(1); }
  if (c === 'qf') return p + '1/4';
  if (c === 'sf') return p + '1/2';
  let r = c.match(/^r(\d+)$/); if (r) return p + '1/' + r[1] / 2;
  r = c.match(/^qo(\d+)$/); if (r) return 'квал. 1/' + r[1];
  r = c.match(/^lr(\d+)$/); if (r) return `НС ${r[1]}-го круга`;
  return c === 'lsf' ? 'НС 1/2' : null;
}
function nextOf(m, kind) {
  const sn = srcName(m.round); if (!sn) return null;
  const lab = `${kind} ${sn} №${m.number}`;
  return T.matches.find(x => x.divisionId === m.divisionId && (x.sourceLabel1 === lab || x.sourceLabel2 === lab)) || null;
}
function destName(x) {
  if (x.round === 'third') return 'Матч за 3-е место';
  const pre = x.branch === 'lower' && !x.isFifthPlace ? (GROUPED ? 'Утешительная · ' : 'Нижняя сетка · ') : '';
  const n = T.matches.filter(y => y.branch === x.branch && y.round === x.round && y.divisionId === x.divisionId).length;
  // части названия не разрываются переносом («1-й круг» целиком)
  return [pre.replace(' · ', ''), roundName(x.round, x), n > 1 ? `№${x.number}` : ''].filter(Boolean).map(esc).map(t => `<span class="nw">${t}</span>`).join(' · ');
}
function nextLinks(m) {
  const cells = [['Победитель', nextOf(m, 'победитель')], ['Проигравший', nextOf(m, 'проигравший')]].filter(c => c[1]);
  if (!cells.length) return '';
  return `<div class="nxs">${cells.map(([k, x]) => `<button class="nxl" data-goto="${x.id}"><span><i>${k} →</i>${destName(x)}</span></button>`).join('')}</div>`;
}

/* ---------- Hero, призёры, вкладки ---------- */

/* ---------- Выпадающие списки фильтров (как в референсе): триггер показывает значение, список открывается под ним ---------- */
let menuPick = null;

document.addEventListener('click', e => { if (!e.target.closest('.dsel')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (document.querySelector('.dmenu')) closeMenu(); else if (state.follow) unfollow(); });
const dsel = (act, label, text, isSet) => `<div class="dsel"><button class="dd2${isSet ? ' set' : ''}" data-act="${act}" aria-haspopup="listbox" aria-expanded="false" aria-label="${label}: ${esc(text)}"><span>${esc(text)}</span></button></div>`;
const MF = [['all','Все'],['past','Прошедшие'],['next','Предстоящие']];
// R4: статус матча в расписании турнира (в лиге остаётся MF по правилам B5)
// статус матча — короткими словами и на кнопке, и в списке (2026-10-25)
const MFT = [['all','Все'],['next','Скоро'],['live','Идут'],['done','Сыграны']];
const MFT_TEST = {all: () => true, next: m => !m.result && !m.live, live: m => !!m.live, done: m => !!m.result};
const tourDayBase = () => T.matches.filter(m => m.day === state.day && !isBye(m) && (!state.div || (topOf(m.divisionId) || {}).id === state.div) && (!state.court || DESK.matches || m.court === state.court));
// Десктоп (от 1024px): расписание турнира колонками по кортам
// Версия задаётся параметром ?view=desktop | mobile (по умолчанию мобильная), а не шириной окна.
// Переключатель версий — в обёртке prototypes/public-tournament.html
const DESK = {matches: Q.get('view') === 'desktop'};
document.documentElement.classList.toggle('desk', DESK.matches);
// скин титульного спонсора — демо брендирования на новой странице: svetlaya, fonbet

// Фавиконка в цвете скина: та же наклонная плашка с «P.», что assets/brand/favicon.svg, плашка — акцент скина
const skinIcon = (plate, ink) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g transform="translate(16 16) skewX(-12.5) translate(-16 -16)"><rect x="4" y="2.5" width="24" height="27" rx="1.6" fill="${plate}"/><path transform="translate(7.6 7.3) scale(1.25)" fill-rule="evenodd" fill="${ink}" d="M0 0H5.8A4.2 4.2 0 0 1 5.8 8.4H3.6V14H0Z M3.6 2.9H5.6A1.3 1.3 0 0 1 5.6 5.5H3.6Z"/></g><circle cx="20.43" cy="22.2" r="2.6" fill="${ink}"/></svg>`;

}
if (Q.get('skin')) { const cs = getComputedStyle(document.documentElement); setSkinIcon(cs.getPropertyValue('--lime').trim(), cs.getPropertyValue('--lime-ink').trim()); }
// на десктопе всё содержимое на всю ширину, кроме текста регламента
const wideContent = () => DESK.matches && state.tab !== 'rules';
// Фильтры расписания турнира: день · дивизион (если есть) · статус матча — на телефоне и десктопе одинаково
const dayShort = i => { const d = dayDate(i); return `${d.getDate()} ${MON[d.getMonth()]}`; };
// на телефоне в ряду из трёх списков — короткие подписи кнопок
const short3 = () => !DESK.matches;
function tourFilters() {
  const mf = (MFT.find(x => x[0] === state.mf) || MFT[0]);

  const day = sm ? (d => `${d.getDate()} ${MON3[d.getMonth()]}`)(dayDate(state.day)) : dayShort(state.day);
  return `<div class="fgrid${TOP.length ? ' n3 dayf' : ''}">${dsel('day', 'День', day, false)}${
    TOP.length ? dsel('div', 'Дивизион', state.div ? divShort(D[state.div]) : sm ? 'Дивизион' : 'Все матчи', !!state.div) : ''}${
    dsel('mf', 'Статус матча', state.mf === 'all' ? (sm ? 'Статус' : 'Статус матча') : mf[1], state.mf !== 'all')}</div>`;

/* ---------- Расписание: турнир ---------- */
function schedTournament() {
  if (DESK.matches) return schedDesk();
  const ms = tourDayBase().filter(MFT_TEST[state.mf] || MFT_TEST.all);
  ms.sort((a, b) => timeKey(a) - timeKey(b) || a.court - b.court);
  const courts = [0, ...Array.from({length: T.courts}, (_, i) => i + 1)]
    .map(c => `<button class="${state.court === c ? 'on' : ''}" data-court="${c}">${c ? esc(courtLabel(c)) : 'Все'}</button>`).join('');
  return `${tourFilters()}
    <div class="row hs"><div class="seg full">${courts}</div></div>
    <div class="list">${ms.length ? ms.map(m => card(m, {court: !state.court, order: true})).join('') : '<div class="empty">Матчей нет</div>'}</div>`;
}

// U6: фильтры дивизиона и статуса на десктопе не убирают матчи, а приглушают — очередь на кортах сохраняется. U8: фильтры одним рядом слева
function schedDesk() {
  const day = T.matches.filter(m => m.day === state.day && !isBye(m));
  const pass = m => (!state.div || (topOf(m.divisionId) || {}).id === state.div) && (MFT_TEST[state.mf] || MFT_TEST.all)(m);
  const courts = Array.from({length: T.courts}, (_, i) => i + 1);
  const cols = courts.map(c => [courtLabel(c), day.filter(m => m.court === c)]);
  const noCourt = day.filter(m => !courts.includes(m.court));
  if (noCourt.length) cols.push(['Корт не назначен', noCourt]);
  const shown = day.filter(pass).length;
  return `<div class="dfl">${tourFilters()}${shown < day.length ? `<span class="fnote2">Подходят ${shown} из ${day.length}, остальные приглушены</span>` : ''}</div>
    ${day.length ? `<div class="cols" style="--n:${cols.length}">${cols.map(([t, ms], c) => `<div class="colh" style="grid-area:1/${c + 1}">${esc(t)}</div>${
      // n-й матч корта — в (n+1)-й строке сетки: матчи одной очереди на разных кортах стоят рядом и одной высоты
      ms.sort((a, b) => (COURT_ORDER[a.id] || 99) - (COURT_ORDER[b.id] || 99)).map((m, i) => card(m, {order: true, off: !pass(m), style: `grid-area:${i + 2}/${c + 1}`})).join('') || `<div class="empty" style="grid-area:2/${c + 1}">Матчей нет</div>`}`).join('')}</div>` : '<div class="empty">Матчей нет</div>'}`;
}

/* ---------- Расписание: лига (B4, B5) ---------- */
function leagueBase() {
  return T.matches.filter(m => (!state.div || m.divisionId === state.div) && (!state.club || m.venueId === state.club));
}
function dayTitle(i) { const d = dayDate(i); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; }
function schedLeague() {
  const all = leagueBase();
  const dated = all.filter(m => m.day).sort((a, b) => a.day - b.day || timeKey(a) - timeKey(b) || (a.court || 0) - (b.court || 0));
  const undated = state.club ? [] : all.filter(m => !m.day && !isBye(m));
  const sel = state.selDay, step = 7 * (1 + state.more);
  let items, hasMore, hasBefore = false;
  if (state.mf === 'past') {
    const base = dated.filter(m => m.result && m.day <= sel).reverse();
    items = base.filter(m => m.day > sel - step);
    if (items.length < step) items = base.slice(0, step);
    hasMore = base.length > items.length;
  } else {
    const base = state.mf === 'next' ? dated.filter(m => !m.result) : dated;
    items = base.filter(m => m.day >= sel && m.day < sel + step);
    if (items.length < step) items = base.filter(m => m.day >= sel).slice(0, step);
    const tail = base.filter(m => m.day >= sel);
    hasMore = tail.length > items.length;
    const earlier = base.filter(m => m.day < sel && m.day >= sel - 7 * state.before);
    hasBefore = base.some(m => m.day < sel - 7 * state.before);
    items = earlier.concat(items);
  }
  // Дата — выпадающим списком, как день в расписании турнира (2026-10-25): лига идёт месяцами, лента из десятков дней не годится.
  // На кнопке выбранный день, рамка лаймовая, если это не сегодня; в списке «Сегодня» и только дни с матчами
  const sd = dayDate(sel);
  const dateTxt = DESK.matches ? dayShort(sel) : `${sd.getDate()} ${MON3[sd.getMonth()]}`;
  let html = `<div class="fgrid lg2">
      <div class="fr">${dsel('lday', 'Дата', dateTxt, sel !== TODAY_IDX)}${dsel('div', 'Дивизион', state.div ? divShort(D[state.div]) : 'Все дивизионы', !!state.div)}</div>
      <div class="fr b">${dsel('club', 'Клуб', state.club ? V[state.club].title : 'Все клубы', !!state.club)}${dsel('mf', 'Матчи', state.mf === 'all' ? 'Все матчи' : MF.find(x => x[0] === state.mf)[1], state.mf !== 'all')}</div>
    </div>`;
  if (hasBefore) html += `<button class="more top" data-act="before">Показать раньше</button>`;
  if (!items.length) html += '<div class="empty">Матчей нет</div>';
  let cur = null, open = false;
  items.forEach(m => {
    if (m.day !== cur) {
      if (open) html += '</div>';
      cur = m.day;
      html += `<div class="dayh">${dayTitle(m.day)}${m.day === TODAY_IDX ? '<span class="today">сегодня</span>' : ''}</div><div class="list">`;
      open = true;
    }
    html += card(m, {court: true, venue: !state.club});
  });
  if (open) html += '</div>';
  if (hasMore) html += `<button class="more" data-act="more">${state.mf === 'past' ? 'Показать ещё' : 'Показать следующие 7 дней'}</button>`;
  if (undated.length && state.mf !== 'past') {
    html += `<div class="undated ${state.undatedOpen ? 'open' : ''}"><button data-act="undated">Время уточняется · ${undated.length}</button>
      ${state.undatedOpen ? `<div class="list">${undated.map(m => card(m, {notime: true})).join('')}</div>` : ''}</div>`;
  }
  return html;
}

/* ---------- Сетка по раундам (C1–C4); R4 — переключатели дивизиона и этапа ---------- */
const ORDER_UP = ['r128','r64','r32','r16','qf','sf','final'];
const inDiv = (m, div) => !div || m.divisionId === div;
const stageOf = m => m.branch === 'lower' ? 'lower' : isQual(m) ? 'qual' : m.phase === 'group' ? 'group' : 'upper';
const STAGES = [['qual', 'Квалификация'], ['group', 'Группы'], ['upper', 'Основная'], ['lower', GROUPED ? 'ДТ' : 'Нижняя']]
  .filter(([k]) => T.matches.some(m => stageOf(m) === k));
if (!STAGES.some(x => x[0] === state.stage)) state.stage = (STAGES.find(x => x[0] === 'upper') || STAGES[0] || ['upper'])[0];
// Раунды этапа; у квалификации последний шаг — «Вышли в основную» (qout)
function bracketRounds(stage, div) {
  const ms = T.matches.filter(m => stageOf(m) === stage && inDiv(m, div));
  const codes = [...new Set(ms.filter(m => m.round !== 'third').map(m => m.round))];
  const order = c => { if (/^qo\d+$/.test(c)) return -1000 - parseInt(c.slice(2), 10); const i = ORDER_UP.indexOf(c.replace(/^d(?=qf|sf|final|r\d)/, '')); return i >= 0 ? i : c === 'lsf' ? 90 : c === 'lfinal' ? 99 : parseInt(c.replace(/\D/g, ''), 10); };
  codes.sort((a, b) => order(a) - order(b));
  if (stage === 'qual' && codes.length) codes.push('qout');
  return codes;
}
// В этапе «Квалификация» префикс «Квалификация · » в названиях раундов лишний
function stageRoundName(c, stage, div) {
  if (c === 'qout') return 'Вышли в основную';
  const m = T.matches.find(x => stageOf(x) === stage && x.round === c && inDiv(x, div));
  const n = roundName(c, m);
  return stage === 'qual' ? n.replace(/^Квалификация · /, '').replace(/^./, ch => ch.toUpperCase()) : n;
}
// Последний шаг квалификации: победители последнего раунда и их место в основной сетке
function qoCard(m) {
  const id = m.result ? (m.result.winner === 1 ? m.pair1 : m.pair2) : null, p = P[id], x = nextOf(m, 'победитель');
  const names = p ? playersHtml(p) : `<span class="src">победитель матча №${m.number}</span>`;
  const dim = state.follow && id !== state.follow;
  return `<article class="mc done bare${dim ? ' dim' : ''}" data-mid="${m.id}">
      <div class="pr${id && id === state.follow ? ' fp' : ''}"${p ? ` data-pair="${id}" role="button" aria-label="Следить за парой ${esc(pairLine(id))}"` : ''}>${seedTag(id, x || {round: ''})}<div class="nm">${names}</div></div>
      ${x ? `<div class="nxs"><button class="nxl" data-goto="${x.id}"><span><i>В основной сетке →</i>${destName(x)}</span></button></div>` : ''}
    </article>`;
}
const qoMatches = (last, div) => T.matches.filter(m => m.round === last && inDiv(m, div)).sort((a, b) => a.number - b.number);

/* ---------- Десктоп: сетка деревом — раунды колонками, линии ведут к следующему матчу ---------- */
// Матч k следующего раунда собирается из матчей 2k−1 и 2k (вдвое меньше матчей) или из матча k (столько же — прямая линия)
function bracketTree(div, ctl = '') {
  const stage = state.stage, rounds = bracketRounds(stage, div);
  if (!rounds.length) return `<div class="bdock">${ctl}</div><section class="bk" data-bdiv="${div || ''}"><div class="empty">Нет матчей этого этапа</div></section>`;
  const cols = rounds.map(c => c === 'qout' ? qoMatches(rounds[rounds.length - 2], div).map(qoCard)
    : T.matches.filter(m => stageOf(m) === stage && m.round === c && inDiv(m, div)).sort((a, b) => a.number - b.number)
      .map(m => card(m, {bare: true, dimOthers: true})));
  const kind = i => i === cols.length - 1 ? 'last' : cols[i + 1].length * 2 === cols[i].length ? 'pair' : cols[i + 1].length === cols[i].length ? 'straight' : 'none';
  const inc = i => i > 0 && ['pair', 'straight'].includes(kind(i - 1));
  const third = stage === 'upper' ? T.matches.filter(m => m.round === 'third' && inDiv(m, div)) : [];
  const n = cols.length;
  return `<section class="bk" data-bdiv="${div || ''}">
    <div class="bdock">${ctl}
      <div class="thead" style="--n:${n}" aria-hidden="true"><div class="thead-in">${rounds.map(c => `<div class="th">${esc(stageRoundName(c, stage, div))}</div>`).join('')}</div></div>
      <div class="tprog" aria-hidden="true"><i></i></div>
    </div>
    <div class="tree" style="--n:${n}" role="region" aria-label="Сетка">
      ${cols.map((items, i) => `<div class="tcol c-${kind(i)}" style="grid-area:1/${i + 1}">${items.map(h => `<div class="slot">${inc(i) ? '<i class="lin"></i>' : ''}${h}</div>`).join('')}</div>`).join('')}
      ${third.length ? `<div class="tthird" style="grid-area:2/${n}"><div class="tcap">Матч за 3-е место</div>${third.map(m => card(m, {bare: true, dimOthers: true})).join('')}</div>` : ''}
    </div>
    <div class="swipe-hint">${DESK.matches ? '' : 'Сетка листается вправо. '}Нажмите на пару — выделится её путь по сетке. Нажмите ещё раз или на свободное место, чтобы снять выделение</div></section>`;
}
// Сетка целиком деревом — и на десктопе, и на телефоне (на телефоне листается вбок)
function bracket(div) { return bracketTree(div); }

/* ---------- Турнир с группами: вкладка «Турнир» (Г7 — таблицы групп как D1) ---------- */
const TBL_HEAD = '<div class="tr hd"><span>#</span><span>Пара</span><span>И</span><span>В</span><span>П</span><span>Геймы</span></div>';
const LEGEND = '<div class="legend">И — сыграно матчей, В — победы, П — поражения, Геймы — выиграно–проиграно</div>';
const tableRow = (r, i, cls = '') => `<div class="tr ${r.withdrawn ? 'wd' : ''} ${r.pairId === state.follow ? 'fp' : ''} ${cls}"><span class="n">${i + 1}</span>
  <span class="pn">${P[r.pairId] ? playersHtml(P[r.pairId]) : ''}</span>
  <span>${r.played}</span><span class="wv">${r.wins}</span><span>${r.losses}</span><span class="g">${r.gamesWon}–${r.gamesLost}</span></div>`;
function groupTable(g, d) {
  const s = T.standings.find(x => x.divisionId === g.id); if (!s) return '';
  const adv = d.groupAdvance || 0;
  const sub = [adv ? `выходят ${adv}` : '', s.complete ? 'все матчи сыграны' : ''].filter(Boolean).join(' · ');
  return `<div class="gbox"><div class="grph"><b>${esc(g.title)}</b>${sub ? `<span>${sub}</span>` : ''}</div>
    <div class="tbl">${TBL_HEAD}${s.tables[0].rows.map((r, i) => tableRow(r, i, (i < adv ? 'q' : '') + (i === adv - 1 ? ' cut' : ''))).join('')}</div></div>`;
}
// R4: вкладка «Сетка» / «Турнир» — сегмент дивизионов (если их больше одного) и сегмент этапов турнира
// Полные названия этапов для выпадающего списка
// на телефоне список в половину ширины — на кнопке короткое название, в открытом списке полное
const STAGE_SHORT = {qual: 'Квалификация', group: 'Группы', upper: 'Основная', lower: GROUPED ? 'ДТ' : 'Нижняя'};
const STAGE_FULL = {qual: 'Квалификация', group: 'Групповой этап', upper: 'Основная сетка', lower: GROUPED ? 'Утешительная (ДТ)' : 'Нижняя сетка'};
// С1: дивизион и этап — выпадающими списками, как фильтры расписания. С2: всегда один дивизион, без «Все».
// С5: фильтры и строка раундов закреплены под вкладками одним блоком
function bracketTab() {
  if (TOP.length && !TOP.some(d => d.id === state.gdiv)) state.gdiv = TOP[0].id;
  const d = TOP.length ? D[state.gdiv] : null;
  const ctl = (TOP.length > 1 || STAGES.length > 1) ? `<div class="fgrid">${TOP.length > 1 ? dsel('bdiv', 'Дивизион', d.title, false) : ''}${
    STAGES.length > 1 ? dsel('stage', 'Этап', (DESK.matches ? STAGE_FULL : STAGE_SHORT)[state.stage], false) : ''}</div>` : '';
  if (state.stage === 'group') return `<div class="bdock">${ctl}</div><div class="ggrid">${T.divisions.filter(g => g.parentId === d.id).map(g => groupTable(g, d)).join('')}</div>` + LEGEND;
  return bracketTree(d ? d.id : null, ctl);
}

/* ---------- Таблица лиги (D1–D3) ---------- */
const divChips = (key) => `<div class="hs dchips fade">${[['', 'Все'], ...TOP.map(d => [d.id, divChip(d)])]
  .map(([v, l]) => `<button class="fchip ${state[key] === v ? 'on' : ''}" data-${key}="${v}">${esc(l)}</button>`).join('')}</div>`;
function standings() {
  const list = T.standings.filter(s => !state.sdiv || s.divisionId === state.sdiv);
  return divChips('sdiv') + `<div class="ggrid">${list.map(s => {
    const rows = s.tables[0].rows;
    return `<div class="gbox"><div class="divh">${esc(divShort(D[s.divisionId]))}</div><div class="tbl">${TBL_HEAD}${rows.map((r, i) => tableRow(r, i)).join('')}</div></div>`;
  }).join('')}</div>` + LEGEND;
}

/* ---------- Игроки (E2) ---------- */
function playerCard(p) {
  const pp = x => `<div class="pp"><div class="av">${x.photoUrl ? `<img loading="lazy" src="${ORIGIN + x.photoUrl}" alt="">` : esc((x.lastName[0] || '') + (x.firstName[0] || ''))}</div>
    <div class="ln">${flag(x)}${esc(x.lastName)}</div><div class="fn">${esc(x.firstName)}</div><div class="rt"><b>${x.rating}</b> · ${esc(x.city)}</div></div>`;
  return `<div class="pc"><span class="sd ${p.seed != null && p.seed <= 4 ? 'top' : ''}">${p.seed ?? 'рез.'}</span><div class="two">${p.players.map(pp).join('')}</div>
    <div class="pr2">Рейтинг пары <b>${p.rating}</b></div></div>`;
}
function players() {
  const pairs = T.pairs.filter(p => !p.withdrawn).sort((a, b) => (a.seed ?? 999) - (b.seed ?? 999));
  const divs = TOP.filter(d => !state.pdiv || d.id === state.pdiv);
  const groups = GROUPED
    ? divs.flatMap(d => T.divisions.filter(g => g.parentId === d.id).map(g => [`${d.title} · ${g.title}`, pairs.filter(p => p.divisionId === g.id)]))
    : TOP.length ? divs.map(d => [divShort(d), pairs.filter(p => p.divisionId === d.id)])
    : [['Основная сетка', pairs]];
  return (TOP.length ? divChips('pdiv') : '') +
    groups.filter(g => g[1].length).map(([t, ps]) => `<div class="grh">${esc(t)}<span>· ${ps.length} ${plural(ps.length)}</span></div><div class="pgrid">${ps.map(playerCard).join('')}</div>`).join('');
}
const plural = n => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'пара' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'пары' : 'пар'; };

/* ---------- Регламент (без изменений) ---------- */
// пункт подзаголовка, перенесённый на новую строку, — без «·» в начале
// перед таким пунктом — явный разрыв строки, иначе без «·» он становится короче и возвращается на первую строку
function kickWrap() {
  const k = document.querySelector('#hero .kick');
  if (!k) return;
  k.querySelectorAll('.kbr').forEach(e => e.remove());
  const items = [...k.children];
  items.forEach(e => e.classList.remove('nl'));
  const nl = items.filter((e, i) => i && e.offsetTop > items[i - 1].offsetTop + 8);
  nl.forEach(e => { e.classList.add('nl'); e.before(Object.assign(document.createElement('i'), {className: 'kbr'})); });
}
// перепроверка, когда строка меняет высоту: подгрузился шрифт, повернули экран
const kickRO = new ResizeObserver(kickWrap);

// Клубы — здесь, а не в шапке: их может быть несколько
function rules() {
  const where = T.venues.length ? `<div class="about"><h3>Где играем</h3>${T.venues.map(v => `<p>${esc(v.title)}${T.venueCity ? `, ${esc(T.venueCity.charAt(0) + T.venueCity.slice(1).toLowerCase())}` : ''}</p>`).join('')}</div>` : '';
  return where + `<div class="about"><h3>Об этом турнире</h3>${T.description || ''}</div>` +
    (T.regulationsFile ? `<div class="pdf"><a href="${ORIGIN + T.regulationsFile.url}" target="_blank" rel="noopener">📄 Регламент турнира (PDF)</a></div>` : '');
}

/* ---------- R1: следить за парой ---------- */
const pairMatches = id => T.matches.filter(m => (m.pair1 === id || m.pair2 === id) && !isBye(m));
const chrono = (a, b) => (a.day || 999) - (b.day || 999) || timeKey(a) - timeKey(b) || (a.court || 0) - (b.court || 0);
// высота закреплённой шапки: вкладки + плашка «Следим за парой»
const stickyH = () => document.getElementById('tabs').offsetHeight + (content.querySelector('.follow') || {offsetHeight: 0}).offsetHeight;
function followBar() {
  if (!state.follow || !P[state.follow]) return '';
  return `<div class="follow"><div class="fb"><i>Следим за парой</i>${pairHtml(state.follow)}</div><button class="fx" data-act="unfollow" aria-label="Перестать следить">✕</button></div>`;
}
// Расписание в режиме слежения: все матчи пары за турнир по дням, без фильтров
function followSchedule() {
  const ms = pairMatches(state.follow).sort(chrono);
  let html = '', cur;
  ms.filter(m => m.day).forEach(m => {
    if (m.day !== cur) { html += `${cur ? '</div>' : ''}<div class="dayh">${dayTitle(m.day)}${m.day === TODAY_IDX ? '<span class="today">сегодня</span>' : ''}</div><div class="list">`; cur = m.day; }
    html += card(m, {court: true, order: !LEAGUE, venue: LEAGUE});
  });
  if (cur) html += '</div>';
  const undated = ms.filter(m => !m.day);
  if (undated.length) html += `<div class="dayh">Время уточняется</div><div class="list">${undated.map(m => card(m, {notime: true, venue: LEAGUE})).join('')}</div>`;
  return html || '<div class="empty">Матчей нет</div>';
}
function unfollow() { state.follow = null; render(); }
function follow(id, el) {
  if (id === state.follow) return unfollow();   // повторное нажатие снимает выделение
  const c0 = el.closest('[data-mid]'), mid = c0 && c0.dataset.mid, before = c0 && c0.getBoundingClientRect().top;
  state.follow = id; render();
  if (state.tab === 'schedule') { const top = tabsTop(); if (scrollY > top) scrollTo({top}); return; }
  // в сетке оставляем нажатую карточку на том же месте экрана
  const c1 = mid && content.querySelector(`[data-mid="${mid}"]`);
  if (c1) scrollBy(0, c1.getBoundingClientRect().top - before);
}
function goTo(mid) {
  const m = T.matches.find(x => x.id === mid);
  if (!m || m.phase === 'group') return;
  state.tab = GROUPED ? 'groups' : 'bracket';
  state.stage = stageOf(m);
  if (TOP.length) state.gdiv = m.divisionId;
  const u = new URL(location); u.searchParams.set('tab', state.tab); history.replaceState(null, '', u);
  renderTabs();
  state.flash = mid; render(); state.flash = null;
  const c = content.querySelector(`[data-mid="${mid}"]`);
  if (c) c.scrollIntoView({block: 'center', inline: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

/* ---------- Рендер ---------- */
const content = document.getElementById('content');
function render() {
  const t = state.tab;
  // плашка слежения — только в расписании (там она фильтрует матчи); в сетке путь пары просто выделен в дереве
  const fb = t === 'schedule' ? followBar() : '';
  content.classList.toggle('wide', wideContent());
  content.innerHTML = fb + (t === 'schedule' ? (state.follow ? followSchedule() : LEAGUE ? schedLeague() : schedTournament())
    : t === 'bracket' || t === 'groups' ? bracketTab() : t === 'standings' ? standings() : t === 'players' ? players() : rules());
  content.querySelectorAll('.hs').forEach(fadeRow);
  // строка названий раундов прокручивается вбок вместе с деревом сетки
  content.querySelectorAll('.tree').forEach(t => {
    const bk = t.closest('.bk'), h = bk.querySelector('.thead'), bar = bk.querySelector('.tprog');
    const sync = () => {
      if (h) h.scrollLeft = t.scrollLeft;
      // С6: полоса прокрутки — какая часть сетки видна по горизонтали
      const over = t.scrollWidth - t.clientWidth > 2;
      bar.hidden = !over;
      if (over) { bar.firstChild.style.width = t.clientWidth / t.scrollWidth * 100 + '%'; bar.firstChild.style.left = t.scrollLeft / t.scrollWidth * 100 + '%'; }
    };
    t.addEventListener('scroll', sync, {passive: true}); sync();
  });
  content.querySelectorAll('.dchips .fchip.on').forEach(on => {
    if (on.matches('.fchip[data-sdiv=""], .fchip[data-pdiv=""]')) return;
    const row = on.parentElement; row.scrollLeft = on.offsetLeft - row.clientWidth / 2 + on.offsetWidth / 2; fadeRow(row);
  });
}
function fadeRow(row) {
  const upd = () => row.classList.toggle('fade', row.scrollWidth - row.clientWidth - row.scrollLeft > 4);
  upd(); if (!row._f) { row._f = 1; row.addEventListener('scroll', upd, {passive: true}); }
}

content.addEventListener('click', e => {
  const pr = e.target.closest('[data-pair]');
  if (pr && !e.target.closest('button')) return follow(pr.dataset.pair, pr);
  // десктопное дерево: нажатие на свободное место снимает выделение пути
  if (state.follow && e.target.closest('.tree') && !e.target.closest('.mc')) return unfollow();
  const b = e.target.closest('button'); if (!b) return;
  if (b.closest('.dmenu')) { const pick = menuPick; closeMenu(); if (!b.disabled) pick(b.dataset.v); return; }
  const d = b.dataset;
  if (d.goto) return goTo(d.goto);
  if (d.act === 'unfollow') { state.follow = null; render(); const top = tabsTop(); if (state.tab === 'schedule' && scrollY > top) scrollTo({top}); return; }
  if (d.court !== undefined) { state.court = +d.court; }
  else if (d.act === 'bdiv') { return openMenu(b, TOP.map(x => [x.id, x.title]), state.gdiv, v => { state.gdiv = v; render(); }); }
  else if (d.act === 'stage') { return openMenu(b, STAGES.map(([k]) => [k, STAGE_FULL[k]]), state.stage, v => { state.stage = v; render(); }); }
  else if (d.sdiv !== undefined) { state.sdiv = d.sdiv; }
  else if (d.pdiv !== undefined) { state.pdiv = d.pdiv; }
  else if (d.act === 'more') { state.more++; }
  else if (d.act === 'before') { state.before++; }
  else if (d.act === 'undated') { state.undatedOpen = !state.undatedOpen; }
  else if (d.act === 'day') { return openMenu(b, T.dayLabels.map((l, i) => [String(i + 1), dayShort(i + 1) + (i + 1 === TODAY_IDX ? ' · сегодня' : '')]), String(state.day), v => { state.day = +v; render(); }); }
  else if (d.act === 'mf' && LEAGUE) { return openMenu(b, [['all', 'Все матчи'], ...MF.slice(1)], state.mf, v => { state.mf = v; state.more = 0; state.before = 0; render(); }); }
  else if (d.act === 'mf') {
    // R4: счётчики по выбранному дню, дивизиону и корту; пустые значения неактивны
    const base = tourDayBase(), cnt = k => base.filter(MFT_TEST[k]).length;
    return openMenu(b, MFT.map(([v, l]) => [v, `${v === 'all' ? 'Все' : l} · ${cnt(v)}`, v !== 'all' && v !== state.mf && !cnt(v)]), state.mf, v => { state.mf = v; render(); });
  }
  else if (d.act === 'div') { return openMenu(b, [['', LEAGUE ? 'Все дивизионы' : 'Все матчи'], ...TOP.map(x => [x.id, divShort(x)])], state.div, v => { state.div = v; state.more = 0; render(); }); }
  else if (d.act === 'lday') {
    const mdays = [...new Set(leagueBase().filter(m => m.day).map(m => m.day))].sort((a, b) => a - b);
    const lbl = i => { const x = dayDate(i); return `${x.getDate()} ${MON[x.getMonth()]}, ${WD[x.getDay()]}${i === TODAY_IDX ? ' · сегодня' : ''}`; };
    return openMenu(b, [['today', 'Сегодня'], ...mdays.map(i => [String(i), lbl(i)])], String(state.selDay), v => { state.selDay = v === 'today' ? TODAY_IDX : +v; state.more = 0; state.before = 0; render(); });
  }
  else if (d.act === 'club') { return openMenu(b, [['', 'Все клубы'], ...T.venues.map(x => [x.id, x.title])], state.club, v => { state.club = v; state.more = 0; render(); }); }
  else return;
  render();
});

renderHero(); renderTabs(); render();
</script>
</body>
</html>
