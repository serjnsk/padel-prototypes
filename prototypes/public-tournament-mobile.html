<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Публичная страница турнира · мобильная</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Публичная страница турнира, мобильная версия (целевая ширина 360px).
   Данные — снимок /api/public двух реальных турниров: ?t=295a92ea (турнир, УО) и ?t=94ddeebe (лига).
   «Сегодня» зафиксировано на дату снимка 2026-10-02, переопределяется ?today=ГГГГ-ММ-ДД. */
:root{--bg:#0c1719;--stripe:#101f22;--panel:#0a0e13;--card:#101c1f;--chip:#18262a;--line:#1c2a2d;--line-strong:#25363a;--ink:#fff;--soft:#b6c4c6;--muted:#8a9ea0;--dim:#5e7174;--lime:#8ae81f;--lime-ink:#0b1b06;--live:#e5736b;--display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* Шапка */
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel)}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:17px;letter-spacing:.03em}
.logo em{color:var(--lime)}
.share{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-strong);background:transparent;border-radius:8px}
.share svg{width:18px;height:18px}

/* Hero: A1 — компактнее, название до 3 строк */
.hero{position:relative;overflow:hidden;background:repeating-linear-gradient(180deg,var(--bg) 0 36px,var(--stripe) 36px 72px);padding:16px 16px 18px;text-align:center}
.wm{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-style:italic;font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.07);white-space:nowrap;pointer-events:none}
.rel{position:relative}
.status{display:inline-flex;align-items:center;gap:6px;height:24px;border:1px solid var(--line-strong);background:#182428;border-radius:4px;padding:0 10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#cfd9da}
.status.live{background:var(--live);border-color:var(--live);color:#fff}
.status.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
h1{font-family:var(--display);font-weight:900;font-style:italic;font-size:26px;line-height:1.08;text-transform:uppercase;margin:10px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
h1.long{font-size:23px}
.meta{color:var(--soft);font-size:13px;line-height:1.4}
.clubs{display:inline-flex;align-items:center;gap:8px;color:var(--soft);font-size:13px;margin-top:8px;max-width:100%}
.clubs img{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#fff;object-fit:contain;border:1px solid var(--line-strong)}
.clubs span{text-align:left}

/* A2 — призёры: одна строка на пару, место показывает медаль */
.podium{margin:16px 16px 0;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);padding:12px 14px}
.podium .t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.podium .r{display:flex;align-items:center;gap:10px;padding:5px 0;font-weight:700;font-size:15px;line-height:1.3}
.podium .r.p1 .nm{color:var(--lime)}
.medal{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1a1a1a}
.podium .pdh{font-size:13px;font-weight:700;margin:8px 0 2px}
.podium .pdh:nth-child(2){margin-top:0}
.podium .r.dt{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.medal.mdt{background:var(--chip);color:var(--soft);font-size:8px;letter-spacing:.02em}
.medal.m1{background:linear-gradient(135deg,#f6d36b,#c9962a)}.medal.m2{background:linear-gradient(135deg,#e3e7ea,#9aa3a8)}.medal.m3{background:linear-gradient(135deg,#e2a46f,#9c5d2c)}

/* A3 — закреплённые вкладки с прокруткой к активной */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hs.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.tabs .hs{padding:8px 16px}
.tab{flex-shrink:0;height:44px;padding:0 16px;border:0;border-radius:6px;background:var(--chip);color:var(--soft);font-weight:600;font-size:14px;white-space:nowrap}
.tab.on{background:var(--lime);color:var(--lime-ink)}

.content{padding:14px 16px 40px}

/* Контролы */
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;color:var(--soft);min-height:44px;padding:0 12px;font-weight:600;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
.seg.full{width:100%}.seg.full button{flex:1;padding:0 6px}
.days button{padding:0 14px;line-height:1.1}
.days b{display:block;font-size:17px;font-weight:800}.days i{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.dd{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--soft);font-weight:600;font-size:13px;white-space:nowrap}
.dd b{color:var(--lime);font-weight:700}
.dd.set{border-color:var(--lime)}
.dd::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.7}
.filters{margin:0 -16px 10px;padding:0 16px}

/* B4 — лента дней лиги */
.strip{margin:0 -16px 14px;padding:0 16px;gap:6px}
.dchip{flex-shrink:0;width:52px;height:52px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative;padding:0}
.dchip i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dchip b{font-size:15px;font-weight:800}
.dchip.past{opacity:.55}
.dchip.today{border-color:var(--lime)}
.dchip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);opacity:1}
.dchip.on i{color:var(--lime-ink)}
.tchip{flex-shrink:0;height:52px;padding:0 12px;border:1px solid var(--lime);border-radius:8px;background:var(--bg);color:var(--lime);font-weight:700;font-size:13px;position:sticky;left:0;z-index:1;box-shadow:-16px 0 0 var(--bg),8px 0 10px var(--bg)}

.dayh{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-family:var(--display);font-weight:800;font-style:italic;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.dayh:first-child{margin-top:0}
.dayh .today{font-family:var(--sans);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--lime);color:var(--lime-ink);border-radius:3px;padding:2px 6px}
.list{display:flex;flex-direction:column;gap:8px}

/* Карточка матча: B1 — игрок на строке, B2 — время слева, B7 — акцент только LIVE */
.mc{display:flex;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px}
.mc.live{border-color:var(--lime)}
.tm{width:46px;flex-shrink:0;padding-top:1px}
.tm b{display:block;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;letter-spacing:-.01em}
.tm b.w{font-size:13px;font-family:var(--sans);font-weight:700;color:var(--soft);padding-top:3px}
.tm i{display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.2}
.mc.done .tm b{color:var(--soft)}
.mb{flex:1;min-width:0}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:20px;line-height:1.35;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mh>span:first-child{padding-top:2px}
.chip{flex-shrink:0;border:1px solid var(--line-strong);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.chip.live{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.sc span{width:20px;text-align:center;white-space:nowrap}
.sc span.tb{width:34px}
.sc sup{font-size:9px;font-weight:700;vertical-align:7px;margin-left:1px}
.pr{display:flex;align-items:center;gap:6px;padding:4px 0 4px 10px;position:relative}
.mh+.pr{margin-top:6px}
.pr.w::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--lime)}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:16px;line-height:21px;font-weight:500}
.nm span{overflow-wrap:anywhere}
.nm .src{color:var(--muted);font-style:italic;font-size:13px}
.pr.w .nm{font-weight:700}
.pr.l .nm{color:#93a5a7}
.sc{display:flex;flex-shrink:0;font-family:var(--display);font-weight:800;font-size:16px;color:var(--dim)}
.sc span.up{color:var(--ink)}
.pr.l .sc span.up{color:var(--soft)}
.tm .ct{color:var(--soft);font-weight:700;font-size:11px;margin-top:8px}
.mf{margin-top:4px;padding-left:10px;font-size:12px;line-height:1.35;color:var(--muted)}
.mc .tm{width:58px}
.mc.nt .tm{display:none}

.more{width:100%;min-height:44px;margin-top:12px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--soft);font-weight:600;font-size:14px}
.more.top{margin:0 0 12px}
.empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center}
.undated{margin-top:20px}
.undated>button{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--chip);border-color:var(--line);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.undated>button::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px}
.undated.open>button::after{transform:rotate(-135deg);margin-top:4px}
.undated .list{margin-top:8px}

/* C1–C4 — сетка по раундам */
.branch{margin-bottom:10px}
.steps{margin:0 -16px 12px;padding:0 16px;gap:4px;align-items:center}
.step{flex-shrink:0;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:20px;background:transparent;color:var(--soft);font-weight:600;font-size:13px;white-space:nowrap}
.step.done{color:var(--muted)}
.step.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:700}
.steps .sep{flex-shrink:0;color:var(--dim);font-size:13px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.rhead b{font-family:var(--display);font-weight:800;font-style:italic;font-size:20px;text-transform:uppercase}
.rhead span{font-size:12px;color:var(--muted);font-weight:600}
.subh{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.rpane{transition:transform .22s ease,opacity .22s ease}
.rpane.out-l{transform:translateX(-24px);opacity:0}.rpane.out-r{transform:translateX(24px);opacity:0}
.rnav{display:flex;gap:8px;margin-top:14px}
.rnav button{flex:1;min-height:52px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--soft);font-weight:600;font-size:13px;line-height:1.25;padding:6px 10px;display:flex;align-items:center;gap:8px;text-align:left}
.rnav button i{font-style:normal;display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rnav button.nx{justify-content:flex-end;text-align:right;border-color:var(--lime);color:var(--ink)}
.rnav button.nx i{color:var(--lime)}
.rnav .ar{font-size:20px;line-height:1}
.rnav button.nx .ar{color:var(--lime)}
.swipe-hint{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}

/* D1–D3 — таблица лиги */
.dchips{margin:0 -16px 14px;padding:0 16px}
.fchip{flex-shrink:0;height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:20px;background:transparent;color:var(--soft);font-weight:600;font-size:13px;white-space:nowrap}
.fchip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.divh{font-family:var(--display);font-weight:800;font-style:italic;font-size:17px;text-transform:uppercase;margin:20px 0 8px}
.divh:first-child{margin-top:0}
.tbl{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.tr{display:grid;grid-template-columns:22px 1fr 24px 24px 24px 54px;gap:4px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.tr>span:not(.pn){text-align:center;font-variant-numeric:tabular-nums}
.tr .n{color:var(--muted);font-weight:700;font-size:12px}
.tr .pn{display:flex;flex-direction:column;line-height:17px;font-weight:600;min-width:0}
.tr .pn span{overflow-wrap:anywhere}
.tr .wv{font-weight:800}
.tr .g{font-size:13px;color:var(--soft)}
.tr.hd{border-top:0;padding-top:7px;padding-bottom:7px;background:var(--chip);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr.hd>span{text-align:center}.tr.hd>span:nth-child(2){text-align:left}
.tr.wd{opacity:.45}
.grph{display:flex;flex-direction:column;gap:2px;margin:16px 0 8px}
.grph b{font-family:var(--display);font-weight:800;font-style:italic;font-size:16px;text-transform:uppercase}
.grph span{font-size:12px;color:var(--muted)}
.divh+.grph{margin-top:4px}
.tr.q .n{color:var(--lime);font-weight:800}
.tr.cut+.tr{border-top:2px solid var(--lime)}
.seg.stage{margin-bottom:16px}
.seg.stage button.on{background:#3a4a4e;color:var(--ink)}
.bk+.divh{margin-top:28px}
.legend{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}

/* E2 — игроки: фильтр дивизиона; карточка пары как в текущей версии */
.grh{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-weight:700;font-size:14px}
.grh:first-child{margin-top:0}
.grh span{color:var(--muted);font-weight:500}
.pc{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px;margin-bottom:12px}
.pc .sd{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:4px;background:var(--chip);color:var(--soft);font-weight:800;font-size:12px}
.pc .sd.top{background:var(--lime);color:var(--lime-ink)}
.pc .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:-6px}
.pp{text-align:center;min-width:0}
.av{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;background:var(--chip);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:22px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.pp .ln{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:14px;overflow-wrap:anywhere}
.pp .fn{font-style:italic;text-transform:uppercase;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.pp .rt{font-size:12px;color:var(--soft);margin-top:4px}.pp .rt b{color:var(--lime)}
.pc .pr2{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;text-align:center;font-size:13px;color:var(--soft)}
.pc .pr2 b{color:var(--ink)}

/* Регламент — как в текущей версии */
.about{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:16px;font-size:14px;line-height:1.6;color:var(--soft)}
.about h3{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;color:var(--ink);font-size:18px;margin:0 0 10px}
.about p{margin:4px 0}
.pdf{display:flex;justify-content:center;margin-top:16px}
.pdf a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:6px;background:var(--lime);color:var(--lime-ink);font-weight:700;font-size:14px;text-decoration:none}

/* B9 — выбор фильтра снизу */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:480px;background:#132225;border-radius:14px 14px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:75vh;overflow:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 8px}
.sheet .st{padding:6px 16px 10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid var(--line);background:transparent;font-size:15px;text-align:left}
.sheet button.on{color:var(--lime);font-weight:600}
.sheet button.on::after{content:"✓"}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">PADEL.<em>SELECT</em></div>
    <button class="share" aria-label="Поделиться"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
  </header>
  <section class="hero" id="hero"></section>
  <div id="podium"></div>
  <div id="tabsAnchor"></div>
  <nav class="tabs" id="tabs"><div class="hs" id="tabrow"></div></nav>
  <main class="content" id="content"></main>

<script>
const RAW = JSON.parse(document.getElementById('data').textContent);
const Q = new URLSearchParams(location.search);
const T = RAW[Q.get('t')] || RAW['295a92ea'];
const LEAGUE = T.type === 'championship';
const P = {}, V = {}, D = {};
T.pairs.forEach(p => P[p.id] = p);
T.venues.forEach(v => V[v.id] = v);
T.divisions.forEach(d => D[d.id] = d);
// Дивизионы верхнего уровня; у турнира с групповым этапом группы — дочерние записи с parentId
const TOP = T.divisions.filter(d => !d.parentId);
const GROUPED = T.divisions.some(d => d.parentId);
const topOf = id => { const d = D[id]; return d && d.parentId ? D[d.parentId] : d; };
const ORIGIN = 'https://padel.select';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl = x => `${x.lastName}${x.firstName ? ' ' + x.firstName[0] + '.' : ''}`;
const pairLine = id => P[id] ? P[id].players.map(pl).join(' / ') : '';
const divShort = d => d.title.replace(/^Дивизион\s+/, '');
// чипы дивизионов: в лиге полные названия (D2), у турнира с группами — как на сайте, «М», «Ж»
const divChip = d => GROUPED ? d.title[0] : divShort(d);
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON3 = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const START = new Date(T.dateStart + 'T00:00:00');
const dayDate = i => { const d = new Date(START); d.setDate(d.getDate() + i - 1); return d; };
const TODAY = new Date((Q.get('today') || '2026-10-02') + 'T00:00:00');
const N_DAYS = T.dayLabels.length;
const TODAY_IDX = Math.round((TODAY - START) / 864e5) + 1;
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const st = m => m.live ? 'live' : m.result ? 'done' : 'wait';
const isBye = m => m.result && m.result.special === 'bye';

// Стартовый день: сегодня, если турнир идёт; до старта — первый, после — последний (B4)
const clampDay = i => Math.min(Math.max(i, 1), N_DAYS);

const state = {
  tab: Q.get('tab') || 'schedule',
  // турнир
  day: clampDay(TODAY_IDX), court: 0, mf: 'all',
  bk: {}, gdiv: '', gstage: 'group',
  // лига
  div: '', club: '', selDay: clampDay(TODAY_IDX), more: 0, before: 0, undatedOpen: false,
  sdiv: '', pdiv: ''
};

/* ---------- Подписи этапов (C2) ---------- */
const RL = {r128:'1/64 финала', r64:'1/32 финала', r32:'1/16 финала', r16:'1/8 финала', qf:'1/4 финала', sf:'1/2 финала', final:'Финал', lsf:'1/2 финала', lfinal:'Финал'};
function roundName(code, m) {
  code = code.replace(/^d(?=qf|sf|final|r\d)/, '');   // раунды утешительной сетки ДТ: dqf, dsf, dfinal
  if (m && m.isFifthPlace) return 'Матч за 5-е место';
  if (code === 'third' || (m && m.isThirdPlace)) return 'Матч за 3-е место';
  const lr = code.match(/^lr(\d+)$/);
  if (lr) return `${lr[1]}-й круг`;
  return RL[code] || code;
}
function roundLabel(m) {
  if (LEAGUE) {
    const r = m.round.match(/^r(\d+)t(\d+)$/), l = r ? `${r[1]}-й круг · ${r[2]}-й тур` : m.round;
    // B8: при фильтре «Дивизион: Все» дивизион пишется в строке этапа
    return !state.div && D[m.divisionId] ? `${divShort(D[m.divisionId])} · ${l}` : l;
  }
  const div = topOf(m.divisionId), pre = !state.div && div ? div.title + ' · ' : '';
  if (m.phase === 'group') {
    const r = m.round.match(/^r(\d+)t(\d+)$/);
    return `${!state.div && div ? div.title[0] + ' · ' : ''}${D[m.divisionId].title} · ${r ? `${r[1]}-й круг · ${r[2]}-й тур` : m.round}`;
  }
  const l = roundName(m.round, m);
  if (/^d(qf|sf|final|r\d)/.test(m.round)) return pre + 'Утешительная (ДТ) · ' + l;
  return pre + (m.branch === 'lower' && !m.isFifthPlace ? 'Нижняя сетка · ' + l : l);
}

/* ---------- Время (B2) ---------- */
function timeKey(m) {
  if (m.time) return toMin(m.time);
  const same = T.matches.filter(x => x.day === m.day && x.court === m.court && x.time);
  return same.length ? Math.max(...same.map(x => toMin(x.time))) + 1 : 9999;
}
function timeHtml(m) {
  if (m.time) return `<b>${m.time}</b>${m.timeMode === 'not_before' ? '<i>не ранее</i>' : ''}`;
  if (m.timeMode === 'after') return '<b class="w">затем</b>';
  return '<b class="w">—</b>';
}

/* ---------- Карточка матча ---------- */
function card(m, o = {}) {
  const s = st(m), r = m.result, w = r ? r.winner : 0;
  const sets = r && !isBye(m) ? r.sets || [] : [];
  const chip = s === 'live' ? '<span class="chip live">● LIVE</span>'
    : s === 'done' && !isBye(m) ? `<span class="chip">${r.special === 'retired' ? 'Отказ' : 'Завершён'}</span>` : '';
  const side = i => {
    const id = i === 1 ? m.pair1 : m.pair2, p = P[id];
    const names = p ? p.players.map(x => `<span>${esc(pl(x))}</span>`).join('')
      : `<span class="src">${isBye(m) ? 'Бай' : esc(i === 1 ? m.sourceLabel1 : m.sourceLabel2)}</span>`;
    const sc = sets.map(x => { const a = i === 1 ? x.a : x.b, b = i === 1 ? x.b : x.a;
      return `<span class="${a > b ? 'up' : ''}${x.tb != null ? ' tb' : ''}">${a}${x.tb != null && a > b ? `<sup>(${x.tb})</sup>` : ''}</span>`; }).join('');
    const cls = w ? (w === i ? 'w' : 'l') : '';
    return `<div class="pr ${cls}"><div class="nm">${names}</div>${sc ? `<div class="sc">${sc}</div>` : ''}</div>`;
  };
  const head = o.head || roundLabel(m);
  const place = o.court && m.court ? `<i class="ct">Корт ${m.court}</i>` : '';
  // Q1: короткого названия клуба в справочнике пока нет — клуб полным названием отдельной строкой
  const club = o.venue && V[m.venueId] ? `<div class="mf">${esc(V[m.venueId].title)}</div>` : '';
  return `<article class="mc ${s}${o.notime ? ' nt' : ''}">
    <div class="tm">${timeHtml(m)}${place}</div>
    <div class="mb">
      <div class="mh"><span>${esc(head)}</span>${chip}</div>
      ${side(1)}${side(2)}${club}
    </div></article>`;
}

/* ---------- Hero, призёры, вкладки ---------- */
function renderHero() {
  const stTxt = {finished: 'Завершён', live: 'Live'}[T.state] || 'Скоро';
  document.getElementById('hero').innerHTML = `
    <div class="wm">${esc(T.venueCity)}</div>
    <div class="rel">
      <span class="status ${T.state === 'live' ? 'live' : ''}">${stTxt}</span>
      <h1 class="${T.title.length > 34 ? 'long' : ''}">${esc(T.title)}</h1>
      <div class="meta">${esc(T.datesLabel)} · ${esc(T.category)}</div>
      ${T.venues.map(v => `<div class="clubs"><img src="${ORIGIN + v.logoUrl}" alt=""><span>${esc(v.title)}</span></div>`).join('<br>')}
    </div>`;
  const pods = T.podium || [];
  if (pods.length) {
    const row = x => `<div class="r p${x.place}"><span class="medal m${x.place}">${x.place}</span><span class="nm">${esc(pairLine(x.pairId))}</span></div>`;
    const byDiv = TOP.length ? TOP.map(d => [d, pods.filter(x => x.divisionId === d.id)]) : [[null, pods]];
    document.getElementById('podium').innerHTML = `<div class="podium"><div class="t">Призёры турнира</div>${byDiv.filter(g => g[1].length).map(([d, xs]) => {
      const dt = d && T.matches.find(m => m.round === 'dfinal' && m.divisionId === d.id && m.result);
      const dtId = dt ? (dt.result.winner === 1 ? dt.pair1 : dt.pair2) : null;
      return (d ? `<div class="pdh">${esc(d.title)}</div>` : '') + xs.map(row).join('') +
        (dtId ? `<div class="r dt"><span class="medal mdt">ДТ</span><span class="nm">${esc(pairLine(dtId))}</span></div>` : '');
    }).join('')}</div>`;
  }
}
const TABS = LEAGUE ? [['schedule','Расписание'],['standings','Таблица'],['players','Игроки'],['rules','Регламент']]
  : GROUPED ? [['schedule','Расписание'],['groups','Турнир'],['players','Игроки'],['rules','Регламент']]
  : [['schedule','Расписание'],['bracket','Сетка'],['players','Игроки'],['rules','Регламент']];
if (!TABS.some(t => t[0] === state.tab)) state.tab = 'schedule';
function renderTabs() {
  const row = document.getElementById('tabrow');
  row.innerHTML = TABS.map(([k, l]) => `<button class="tab ${state.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('');
  const on = row.querySelector('.on');
  if (on.offsetLeft + on.offsetWidth > row.scrollLeft + row.clientWidth - 16 || on.offsetLeft < row.scrollLeft) row.scrollTo({left: on.offsetLeft - 16, behavior: 'smooth'});
  fadeRow(row);
}
document.getElementById('tabrow').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab;
  const u = new URL(location); u.searchParams.set('tab', state.tab); history.replaceState(null, '', u);
  renderTabs(); render();
  const top = tabsTop();
  if (scrollY > top) scrollTo({top});
});

// у sticky-элемента offsetTop меняется при прокрутке, поэтому меряем по якорю перед вкладками
const tabsTop = () => document.getElementById('tabsAnchor').offsetTop + 16;

/* ---------- Нижний лист выбора (B9) ---------- */
let sheetPick = null;
function openSheet(title, opts, cur, onPick) {
  sheetPick = onPick;
  document.getElementById('sheet').innerHTML = `<div class="grab"></div><div class="st">${esc(title)}</div>` +
    opts.map(([v, l]) => `<button class="${v === cur ? 'on' : ''}" data-v="${esc(v)}">${esc(l)}</button>`).join('');
  document.getElementById('sheetBg').classList.add('open');
}
document.getElementById('sheetBg').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (b) sheetPick(b.dataset.v);
  else if (e.target.id !== 'sheetBg') return;
  document.getElementById('sheetBg').classList.remove('open');
});
const MF = [['all','Все'],['past','Прошедшие'],['next','Предстоящие']];
const ddBtn = (act, label, val, isSet) => `<button class="dd ${isSet ? 'set' : ''}" data-act="${act}">${label}${val ? `: <b>${esc(val)}</b>` : ''}</button>`;

/* ---------- Расписание: турнир ---------- */
function schedTournament() {
  let ms = T.matches.filter(m => m.day === state.day && !isBye(m) && (!state.div || (topOf(m.divisionId) || {}).id === state.div));
  if (state.mf === 'past') ms = ms.filter(m => m.result);
  if (state.mf === 'next') ms = ms.filter(m => !m.result);
  if (state.court) ms = ms.filter(m => m.court === state.court);
  ms.sort((a, b) => timeKey(a) - timeKey(b) || a.court - b.court);
  const days = T.dayLabels.map((l, i) => { const [d, mo] = l.split(' '); return `<button class="${state.day === i + 1 ? 'on' : ''}" data-day="${i + 1}"><b>${d}</b><i>${mo.slice(0, 3)}</i></button>`; }).join('');
  const courts = [0, ...Array.from({length: T.courts}, (_, i) => i + 1)]
    .map(c => `<button class="${state.court === c ? 'on' : ''}" data-court="${c}">${c ? 'Корт ' + c : 'Все'}</button>`).join('');
  return `<div class="hs filters fade"><div class="seg days">${days}</div>${TOP.length ? ddBtn('div', state.div ? divShort(D[state.div]) : 'Дивизион', '', !!state.div) : ''}${ddBtn('mf', 'Матчи', MF.find(x => x[0] === state.mf)[1], state.mf !== 'all')}</div>
    <div class="row"><div class="seg full">${courts}</div></div>
    <div class="list">${ms.length ? ms.map(m => card(m, {court: !state.court})).join('') : '<div class="empty">Матчей нет</div>'}</div>`;
}

/* ---------- Расписание: лига (B4, B5) ---------- */
function leagueBase() {
  return T.matches.filter(m => (!state.div || m.divisionId === state.div) && (!state.club || m.venueId === state.club));
}
function dayTitle(i) { const d = dayDate(i); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; }
function schedLeague() {
  const all = leagueBase();
  const dated = all.filter(m => m.day).sort((a, b) => a.day - b.day || timeKey(a) - timeKey(b) || (a.court || 0) - (b.court || 0));
  const undated = state.club ? [] : all.filter(m => !m.day && !isBye(m));
  const sel = state.selDay, step = 7 * (1 + state.more);
  let items, hasMore, hasBefore = false;
  if (state.mf === 'past') {
    const base = dated.filter(m => m.result && m.day <= sel).reverse();
    items = base.filter(m => m.day > sel - step);
    if (items.length < step) items = base.slice(0, step);
    hasMore = base.length > items.length;
  } else {
    const base = state.mf === 'next' ? dated.filter(m => !m.result) : dated;
    items = base.filter(m => m.day >= sel && m.day < sel + step);
    if (items.length < step) items = base.filter(m => m.day >= sel).slice(0, step);
    const tail = base.filter(m => m.day >= sel);
    hasMore = tail.length > items.length;
    const earlier = base.filter(m => m.day < sel && m.day >= sel - 7 * state.before);
    hasBefore = base.some(m => m.day < sel - 7 * state.before);
    items = earlier.concat(items);
  }
  // Лента дней: только дни с матчами
  const mdays = [...new Set(dated.map(m => m.day))];
  const chips = mdays.map(i => { const d = dayDate(i);
    return `<button class="dchip ${i === sel ? 'on' : ''} ${i === TODAY_IDX ? 'today' : ''} ${i < TODAY_IDX ? 'past' : ''}" data-sel="${i}"><i>${WD[d.getDay()]}</i><b>${d.getDate()}</b><i>${MON3[d.getMonth()]}</i></button>`; }).join('');
  let html = `<div class="hs filters fade">
      ${ddBtn('div', state.div ? divShort(D[state.div]) : 'Дивизион', '', !!state.div)}
      ${ddBtn('club', state.club ? V[state.club].title : 'Клуб', '', !!state.club)}
      ${ddBtn('mf', 'Матчи', MF.find(x => x[0] === state.mf)[1], state.mf !== 'all')}
    </div>
    <div class="hs strip fade" id="strip"><button class="tchip" data-sel="${TODAY_IDX}">Сегодня</button>${chips}</div>`;
  if (hasBefore) html += `<button class="more top" data-act="before">Показать раньше</button>`;
  if (!items.length) html += '<div class="empty">Матчей нет</div>';
  let cur = null, open = false;
  items.forEach(m => {
    if (m.day !== cur) {
      if (open) html += '</div>';
      cur = m.day;
      html += `<div class="dayh">${dayTitle(m.day)}${m.day === TODAY_IDX ? '<span class="today">сегодня</span>' : ''}</div><div class="list">`;
      open = true;
    }
    html += card(m, {court: true, venue: !state.club});
  });
  if (open) html += '</div>';
  if (hasMore) html += `<button class="more" data-act="more">${state.mf === 'past' ? 'Показать ещё' : 'Показать следующие 7 дней'}</button>`;
  if (undated.length && state.mf !== 'past') {
    html += `<div class="undated ${state.undatedOpen ? 'open' : ''}"><button data-act="undated">Время уточняется · ${undated.length}</button>
      ${state.undatedOpen ? `<div class="list">${undated.map(m => card(m, {notime: true})).join('')}</div>` : ''}</div>`;
  }
  return html;
}

/* ---------- Сетка по раундам (C1–C4); у турнира с группами — отдельно для каждого дивизиона ---------- */
const ORDER_UP = ['r128','r64','r32','r16','qf','sf','final'];
const bkey = div => div || '_';
const bst = div => state.bk[bkey(div)] || (state.bk[bkey(div)] = {branch: 'upper', round: 0});
const inDiv = (m, div) => !div || m.divisionId === div;
function bracketRounds(branch, div) {
  const ms = T.matches.filter(m => m.branch === branch && m.phase !== 'group' && inDiv(m, div));
  const codes = [...new Set(ms.filter(m => m.round !== 'third').map(m => m.round))];
  const order = c => { const i = ORDER_UP.indexOf(c.replace(/^d(?=qf|sf|final|r\d)/, '')); return i >= 0 ? i : c === 'lsf' ? 90 : c === 'lfinal' ? 99 : parseInt(c.replace(/\D/g, ''), 10); };
  return codes.sort((a, b) => order(a) - order(b));
}
function bracket(div) {
  const s = bst(div);
  const hasLower = T.matches.some(m => m.branch === 'lower' && inDiv(m, div));
  const rounds = bracketRounds(s.branch, div);
  s.round = Math.min(s.round, rounds.length - 1);
  const code = rounds[s.round];
  const ms = T.matches.filter(m => m.branch === s.branch && m.round === code && inDiv(m, div)).sort((a, b) => a.number - b.number);
  const third = s.branch === 'upper' && code === 'final' ? T.matches.filter(m => m.round === 'third' && inDiv(m, div)) : [];
  const name = c => { const m = T.matches.find(x => x.branch === s.branch && x.round === c && inDiv(x, div)); return roundName(c, m); };
  const steps = rounds.map((c, i) => `${i ? '<span class="sep">›</span>' : ''}<button class="step ${i === s.round ? 'on' : i < s.round ? 'done' : ''}" data-round="${i}">${esc(name(c))}</button>`).join('');
  const prev = rounds[s.round - 1], next = rounds[s.round + 1];
  const bc = m => card(m, {notime: true, head: `Матч №${m.number}`});
  const BR = GROUPED ? ['Основная сетка', 'Утешительная (ДТ)'] : ['Верхняя сетка', 'Нижняя сетка'];
  return `<section class="bk" data-bdiv="${div || ''}">
    ${hasLower ? `<div class="seg full branch"><button class="${s.branch === 'upper' ? 'on' : ''}" data-branch="upper">${BR[0]}</button><button class="${s.branch === 'lower' ? 'on' : ''}" data-branch="lower">${BR[1]}</button></div>` : ''}
    <div class="hs steps fade">${steps}</div>
    <div class="rpane" id="rpane-${bkey(div)}">
      <div class="rhead"><b>${esc(name(code))}</b><span>Раунд ${s.round + 1} из ${rounds.length}</span></div>
      <div class="list">${ms.map(bc).join('')}</div>
      ${third.length ? `<div class="list" style="margin-top:8px">${third.map(m => card(m, {notime: true, head: 'Матч за 3-е место'})).join('')}</div>` : ''}
    </div>
    <div class="rnav">
      ${prev ? `<button data-go="-1"><span class="ar">‹</span><span><i>Назад</i>${esc(name(prev))}</span></button>` : ''}
      ${next ? `<button class="nx" data-go="1"><span><i>Следующий раунд</i>${esc(name(next))}</span><span class="ar">›</span></button>` : ''}
    </div>
    <div class="swipe-hint">Раунды листаются свайпом влево и вправо</div></section>`;
}
function goRound(dir, div) {
  const s = bst(div), rounds = bracketRounds(s.branch, div), to = s.round + dir;
  if (to < 0 || to >= rounds.length) return;
  const pane = document.getElementById('rpane-' + bkey(div));
  pane.classList.add(dir > 0 ? 'out-l' : 'out-r');
  setTimeout(() => {
    s.round = to; render();
    const p = document.getElementById('rpane-' + bkey(div));
    p.classList.add(dir > 0 ? 'out-r' : 'out-l');
    requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove('out-l', 'out-r')));
    // к началу этой сетки, с учётом закреплённых вкладок
    const sec = document.querySelector(`[data-bdiv="${div || ''}"]`);
    const top = sec.getBoundingClientRect().top + scrollY - document.getElementById('tabs').offsetHeight - 12;
    if (scrollY > top) scrollTo({top});
  }, 160);
}

/* ---------- Турнир с группами: вкладка «Турнир» (Г7 — таблицы групп как D1) ---------- */
const TBL_HEAD = '<div class="tr hd"><span>#</span><span>Пара</span><span>И</span><span>В</span><span>П</span><span>Геймы</span></div>';
const LEGEND = '<div class="legend">И — сыграно матчей, В — победы, П — поражения, Геймы — выиграно–проиграно</div>';
const tableRow = (r, i, cls = '') => `<div class="tr ${r.withdrawn ? 'wd' : ''} ${cls}"><span class="n">${i + 1}</span>
  <span class="pn">${(P[r.pairId] ? P[r.pairId].players : []).map(x => `<span>${esc(pl(x))}</span>`).join('')}</span>
  <span>${r.played}</span><span class="wv">${r.wins}</span><span>${r.losses}</span><span class="g">${r.gamesWon}–${r.gamesLost}</span></div>`;
function groupTable(g, d) {
  const s = T.standings.find(x => x.divisionId === g.id); if (!s) return '';
  const adv = d.groupAdvance || 0;
  const sub = [adv ? `выходят ${adv}` : '', s.complete ? 'все матчи сыграны' : ''].filter(Boolean).join(' · ');
  return `<div class="grph"><b>${esc(g.title)}</b>${sub ? `<span>${sub}</span>` : ''}</div>
    <div class="tbl">${TBL_HEAD}${s.tables[0].rows.map((r, i) => tableRow(r, i, (i < adv ? 'q' : '') + (i === adv - 1 ? ' cut' : ''))).join('')}</div>`;
}
function groupsTab() {
  const chips = `<div class="hs dchips fade">${[['', 'Все'], ...TOP.map(d => [d.id, divChip(d)])]
    .map(([v, l]) => `<button class="fchip ${state.gdiv === v ? 'on' : ''}" data-gdiv="${v}">${esc(l)}</button>`).join('')}</div>`;
  const sw = `<div class="seg full stage"><button class="${state.gstage === 'group' ? 'on' : ''}" data-gstage="group">Групповой этап</button><button class="${state.gstage === 'final' ? 'on' : ''}" data-gstage="final">Финальный этап</button></div>`;
  const divs = TOP.filter(d => !state.gdiv || d.id === state.gdiv);
  if (state.gstage === 'final') return chips + sw + divs.map(d => `<div class="divh">${esc(d.title)}</div>${bracket(d.id)}`).join('');
  return chips + sw + divs.map(d => `<div class="divh">${esc(d.title)}</div>${T.divisions.filter(g => g.parentId === d.id).map(g => groupTable(g, d)).join('')}`).join('') + LEGEND;
}

/* ---------- Таблица лиги (D1–D3) ---------- */
const divChips = (key) => `<div class="hs dchips fade">${[['', 'Все'], ...TOP.map(d => [d.id, divChip(d)])]
  .map(([v, l]) => `<button class="fchip ${state[key] === v ? 'on' : ''}" data-${key}="${v}">${esc(l)}</button>`).join('')}</div>`;
function standings() {
  const list = T.standings.filter(s => !state.sdiv || s.divisionId === state.sdiv);
  return divChips('sdiv') + list.map(s => {
    const rows = s.tables[0].rows;
    return `<div class="divh">${esc(divShort(D[s.divisionId]))}</div><div class="tbl">${TBL_HEAD}${rows.map((r, i) => tableRow(r, i)).join('')}</div>`;
  }).join('') + LEGEND;
}

/* ---------- Игроки (E2) ---------- */
function playerCard(p) {
  const pp = x => `<div class="pp"><div class="av">${x.photoUrl ? `<img loading="lazy" src="${ORIGIN + x.photoUrl}" alt="">` : esc((x.lastName[0] || '') + (x.firstName[0] || ''))}</div>
    <div class="ln">${esc(x.lastName)}</div><div class="fn">${esc(x.firstName)}</div><div class="rt"><b>${x.rating}</b> · ${esc(x.city)}</div></div>`;
  return `<div class="pc"><span class="sd ${p.seed <= 4 ? 'top' : ''}">${p.seed}</span><div class="two">${p.players.map(pp).join('')}</div>
    <div class="pr2">Рейтинг пары <b>${p.rating}</b></div></div>`;
}
function players() {
  const pairs = T.pairs.filter(p => !p.withdrawn).sort((a, b) => a.seed - b.seed);
  const divs = TOP.filter(d => !state.pdiv || d.id === state.pdiv);
  const groups = GROUPED
    ? divs.flatMap(d => T.divisions.filter(g => g.parentId === d.id).map(g => [`${d.title} · ${g.title}`, pairs.filter(p => p.divisionId === g.id)]))
    : TOP.length ? divs.map(d => [divShort(d), pairs.filter(p => p.divisionId === d.id)])
    : [['Основная сетка', pairs]];
  return (TOP.length ? divChips('pdiv') : '') +
    groups.filter(g => g[1].length).map(([t, ps]) => `<div class="grh">${esc(t)}<span>· ${ps.length} ${plural(ps.length)}</span></div>${ps.map(playerCard).join('')}`).join('');
}
const plural = n => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'пара' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'пары' : 'пар'; };

/* ---------- Регламент (без изменений) ---------- */
function rules() {
  return `<div class="about"><h3>Об этом турнире</h3>${T.description || ''}</div>` +
    (T.regulationsFile ? `<div class="pdf"><a href="${ORIGIN + T.regulationsFile.url}" target="_blank" rel="noopener">📄 Регламент турнира (PDF)</a></div>` : '');
}

/* ---------- Рендер ---------- */
const content = document.getElementById('content');
function render() {
  const t = state.tab;
  content.innerHTML = t === 'schedule' ? (LEAGUE ? schedLeague() : schedTournament())
    : t === 'bracket' ? bracket(null) : t === 'groups' ? groupsTab() : t === 'standings' ? standings() : t === 'players' ? players() : rules();
  content.querySelectorAll('.hs').forEach(fadeRow);
  content.querySelectorAll('#strip .dchip.on, .steps .step.on, .dchips .fchip.on').forEach(on => {
    if (on.matches('.fchip[data-sdiv=""], .fchip[data-pdiv=""], .fchip[data-gdiv=""]')) return;
    const row = on.parentElement; row.scrollLeft = on.offsetLeft - row.clientWidth / 2 + on.offsetWidth / 2; fadeRow(row);
  });
}
function fadeRow(row) {
  const upd = () => row.classList.toggle('fade', row.scrollWidth - row.clientWidth - row.scrollLeft > 4);
  upd(); if (!row._f) { row._f = 1; row.addEventListener('scroll', upd, {passive: true}); }
}

content.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.day) { state.day = +d.day; }
  else if (d.court !== undefined) { state.court = +d.court; }
  else if (d.sel) { state.selDay = +d.sel; state.more = 0; state.before = 0; }
  else if (d.branch) { const s = bst(b.closest('[data-bdiv]').dataset.bdiv || null); s.branch = d.branch; s.round = 0; }
  else if (d.round !== undefined) { const k = b.closest('[data-bdiv]').dataset.bdiv || null, to = +d.round; if (to !== bst(k).round) goRound(to - bst(k).round, k); return; }
  else if (d.go) { goRound(+d.go, b.closest('[data-bdiv]').dataset.bdiv || null); return; }
  else if (d.gdiv !== undefined) { state.gdiv = d.gdiv; }
  else if (d.gstage) { state.gstage = d.gstage; }
  else if (d.sdiv !== undefined) { state.sdiv = d.sdiv; }
  else if (d.pdiv !== undefined) { state.pdiv = d.pdiv; }
  else if (d.act === 'more') { state.more++; }
  else if (d.act === 'before') { state.before++; }
  else if (d.act === 'undated') { state.undatedOpen = !state.undatedOpen; }
  else if (d.act === 'mf') { return openSheet('Матчи', MF, state.mf, v => { state.mf = v; state.more = 0; state.before = 0; render(); }); }
  else if (d.act === 'div') { return openSheet('Дивизион', [['', 'Все'], ...TOP.map(x => [x.id, divShort(x)])], state.div, v => { state.div = v; state.more = 0; render(); }); }
  else if (d.act === 'club') { return openSheet('Клуб', [['', 'Все'], ...T.venues.map(x => [x.id, x.title])], state.club, v => { state.club = v; state.more = 0; render(); }); }
  else return;
  render();
});
// Свайп раундов сетки
let sx = 0, sy = 0;
content.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
content.addEventListener('touchend', e => {
  const sec = e.target.closest('[data-bdiv]');
  if (!sec || e.target.closest('.hs')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 40) goRound(dx < 0 ? 1 : -1, sec.dataset.bdiv || null);
}, {passive: true});

renderHero(); renderTabs(); render();
</script>
</body>
</html>
