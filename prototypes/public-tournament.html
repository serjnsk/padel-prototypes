<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Публичная страница турнира · десктоп и мобильная</title>
<link rel="icon" href="../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
<style>
/* Обёртка прототипа публичной страницы: строка управления сверху (версия и турнир),
   ниже — сам прототип public-tournament-mobile.html во фрейме с ?view=desktop | mobile.
   Состояние в адресе: ?view=desktop|mobile&t=<код>[&skin=svetlaya|fonbet]; вкладка внутри прототипа сохраняется при переключении версии. */
:root{--bg:#06090b;--bar:#0f1a1d;--line:#25363a;--ink:#fff;--soft:#b6c4c6;--muted:#8a9ea0;--lime:#8ae81f;--lime-ink:#0b1b06}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif}
/* строка управления сверху, фрейм занимает всё оставшееся место — даже если строка перенеслась на две */
body{display:flex;flex-direction:column}
.bar{flex-shrink:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:56px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.bar b{font-size:14px;font-weight:700;margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 16px;border:0;background:transparent;color:var(--soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--lime);color:var(--lime-ink)}
select{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bar);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600}
.bar a{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.bar a:hover{color:var(--ink)}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:0;overflow:auto}
iframe{display:block;border:0;background:#0c1719}
.desktop iframe{width:100%;height:100%}
/* мобильная версия — экран 360×780 */
.mobile .stage{padding:24px 16px;align-items:flex-start}
.mobile iframe{flex-shrink:0;width:360px;height:780px;border-radius:24px;box-shadow:0 0 0 8px #1a2427,0 20px 60px rgba(0,0,0,.6)}
.size{color:var(--muted);font-size:12px;font-weight:600}
@media (max-width:1000px){.size{display:none}}
</style>
</head>
<body>
<div class="bar">
  <b>Публичная страница турнира</b>
  <div class="seg" role="group" aria-label="Версия">
    <button data-view="desktop">Десктоп</button><button data-view="mobile">Мобильная</button>
  </div>
  <span class="size" id="size"></span>
  <select id="t" aria-label="Турнир">
    <option value="4daf356d">Турнир ФПР 500 с квалификацией</option>
    <option value="295a92ea">Турнир УО-2</option>
    <option value="da36e9c5">Турнир с группами и дивизионами</option>
    <option value="94ddeebe">Лига</option>
  </select>
  <select id="skin" aria-label="Скин">
    <option value="">Скин PADEL.SELECT</option>
    <option value="svetlaya">Скин «Светлая сторона»</option>
    <option value="fonbet">Скин FONBET</option>
  </select>
  <a id="open" target="_blank" rel="noopener">Открыть отдельно ↗</a>
</div>
<div class="stage"><iframe id="frame" title="Прототип публичной страницы"></iframe></div>
<script>
const Q = new URLSearchParams(location.search);
const st = {view: Q.get('view') === 'mobile' ? 'mobile' : 'desktop', t: Q.get('t') || '4daf356d', skin: ['svetlaya', 'fonbet'].includes(Q.get('skin')) ? Q.get('skin') : ''};
const frame = document.getElementById('frame');
// Фавиконка в цвете скина: та же наклонная плашка с «P.», что assets/brand/favicon.svg, плашка — акцент скина
const skinIcon = (plate, ink) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g transform="translate(16 16) skewX(-12.5) translate(-16 -16)"><rect x="4" y="2.5" width="24" height="27" rx="1.6" fill="${plate}"/><path transform="translate(7.6 7.3) scale(1.25)" fill-rule="evenodd" fill="${ink}" d="M0 0H5.8A4.2 4.2 0 0 1 5.8 8.4H3.6V14H0Z M3.6 2.9H5.6A1.3 1.3 0 0 1 5.6 5.5H3.6Z"/></g><circle cx="20.43" cy="22.2" r="2.6" fill="${ink}"/></svg>`;
function setSkinIcon(plate, ink) {
  document.querySelectorAll('link[rel="icon"]').forEach(l => l.remove());
  const l = document.createElement('link'); l.rel = 'icon'; l.type = 'image/svg+xml';
  l.href = 'data:image/svg+xml,' + encodeURIComponent(skinIcon(plate, ink)); document.head.appendChild(l);
}
const SKIN_ICON = {'': ['#82eb00', '#0b1b06'], svetlaya: ['#b8dc1e', '#0b0f02'], fonbet: ['#e11b22', '#ffffff']};
// параметры прототипа (вкладка, «сегодня») берём из фрейма, чтобы при смене версии остаться на той же вкладке
function innerParams() {
  try { return new URLSearchParams(frame.contentWindow.location.search); } catch (e) { return new URLSearchParams(); }
}
function apply(keepInner) {
  const p = keepInner ? innerParams() : new URLSearchParams();
  if (Q.get('today') && !p.get('today')) p.set('today', Q.get('today'));
  p.set('t', st.t); p.set('view', st.view);
  if (st.skin) p.set('skin', st.skin); else p.delete('skin');
  const src = 'public-tournament-mobile.html?' + p;
  frame.src = src;
  document.getElementById('open').href = src;
  document.body.className = st.view;
  document.getElementById('size').textContent = st.view === 'mobile' ? '360 × 780' : 'на всю ширину окна';
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === st.view));
  document.getElementById('t').value = st.t;
  document.getElementById('skin').value = st.skin;
  setSkinIcon(...SKIN_ICON[st.skin]);
  const u = new URL(location); u.searchParams.set('view', st.view); u.searchParams.set('t', st.t);
  if (st.skin) u.searchParams.set('skin', st.skin); else u.searchParams.delete('skin');
  history.replaceState(null, '', u);
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { st.view = b.dataset.view; apply(true); }));
document.getElementById('t').addEventListener('change', e => { st.t = e.target.value; apply(false); });
// скин — демо брендирования титульного спонсора; вкладку внутри прототипа сохраняем
document.getElementById('skin').addEventListener('change', e => { st.skin = e.target.value; apply(true); });
apply(false);
</script>
</body>
</html>
