<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Скины страницы турнира · PADEL.SELECT</title>
<link rel="icon" href="../assets/brand/favicon.ico" sizes="32x32"><link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,800;1,800;1,900&family=Inter:wght@400;500;600;700;800&family=Roboto+Condensed:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Все скины страницы турнира: 5 из прода и 8 новых. Макет — мобильная публичная страница в текущем дизайне
   (public-tournament-mobile.html): шапка, герой со статусом и городом, вкладки, фильтры, карточки матчей.
   Победитель выделен только контрастом, без заливки. Цвета скина — токены страницы (--bg, --lime, --loser…) на макете,
   полный список и CSS для вставки — под карточкой. */
:root{--bg:#f0f5f6;--card:#fff;--ink:#142c31;--muted:#5f7478;--faint:#909ea1;--line:#dde6e8;--lime:#82eb00;--lime-ink:#0b1b06;
 --display:"Inter Tight","Inter",system-ui,sans-serif;--sans:"Inter",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* Логотип «Табло» — как в assets/tokens.css; цвета приходят от шапки макета */
.logo{font-family:var(--display);font-style:italic;font-weight:900;letter-spacing:.02em;white-space:nowrap;text-decoration:none;color:var(--logo-ink,var(--ink))}
.logo .b{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--logo-dot,currentColor);margin:0 .12em 0 .08em;overflow:hidden;text-indent:1em}
.logo em{display:inline-block;position:relative;z-index:0;font-style:italic;color:var(--logo-on,var(--lime-ink));padding:.11em .3em .09em .25em;line-height:1}
.logo em::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--logo-plate,var(--lime));transform:skewX(-12deg);border-radius:.08em}

.wrap{max-width:1320px;margin:0 auto;padding:36px 24px 80px}
.top{display:flex;align-items:center;gap:14px;font-size:17px}
.top a.chip{font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;text-decoration:none}
.top a.chip:hover{color:var(--ink)}
h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(30px,4.4vw,46px);line-height:1.02;margin-top:22px}
.lead{max-width:820px;margin-top:10px;color:var(--muted);font-size:15.5px}
.lead b{color:var(--ink);font-weight:600}

/* панель: фильтр и указатель */
.bar{position:sticky;top:0;z-index:10;margin:22px -24px 0;padding:12px 24px;background:rgba(240,245,246,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;display:flex;gap:14px;align-items:center}
.bar.stuck{border-bottom-color:var(--line)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:999px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg button i{font-style:normal;opacity:.6;margin-left:4px}
.idx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.idx::-webkit-scrollbar{display:none}
.idx a{display:inline-flex;align-items:center;gap:7px;flex:none;height:30px;padding:0 11px 0 6px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.idx a:hover{border-color:#b9c8cb}
.idx a i{width:18px;height:18px;border-radius:50%;background:var(--a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);position:relative;flex:none}
.idx a i::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--b)}
.idx a[hidden]{display:none}

h2{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1.1;margin:36px 0 0;display:flex;align-items:baseline;gap:10px}
h2 span{font-family:var(--sans);font-style:normal;font-weight:600;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-top:14px}
.sk{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sk-h{display:flex;align-items:center;gap:8px;padding:2px 4px 0}
.sk-h b{font-size:15.5px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px}
.tag.new{background:var(--lime);color:var(--lime-ink)}
.sk-h .tag:last-child{margin-left:auto}
.sk p.why{font-size:13px;color:var(--muted);padding:0 4px;min-height:58px}

/* вкладка браузера над макетом */
.btab{display:flex;align-items:flex-end;height:30px;padding:0 8px;border-radius:10px 10px 0 0;background:#dee1e6}
.btab span{display:flex;align-items:center;gap:7px;height:25px;flex:0 1 230px;min-width:0;padding:0 10px;border-radius:7px 7px 0 0;background:#fff;font-size:11.5px;color:#1f1f1f}
.btab span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab img{width:14px;height:14px;flex:none}
.btab+.pv{border-top-left-radius:0;border-top-right-radius:0}

/* ---------- макет страницы турнира: правила public-tournament-mobile.html, ужатые под карточку ---------- */
.pv{--names:"Roboto Condensed","Arial Narrow",sans-serif;border-radius:10px;overflow:hidden;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.pv .tb{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--panel);font-size:15px}
.pv .share{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:7px;color:var(--ink)}
.pv .share svg{width:15px;height:15px}
.pv .hero{position:relative;overflow:hidden;background:repeating-linear-gradient(180deg,var(--bg) 0 30px,var(--stripe) 30px 60px);padding:12px 12px 14px}
.pv .wm{position:absolute;left:50%;top:-4px;translate:-50% 0;font-family:var(--display);font-weight:900;font-style:italic;font-size:92px;line-height:1;color:transparent;-webkit-text-stroke:1.3px var(--wm);white-space:nowrap;pointer-events:none}
.pv .kick{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:4px 5px;font-size:10px;line-height:1.4;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lime-text)}
.pv .kick i{font-style:normal;color:var(--dim)}
.pv .status{display:inline-flex;align-items:center;gap:5px;height:19px;border-radius:4px;padding:0 6px;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--live);color:#fff}
.pv .status::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.pv .ttl{position:relative;font-family:var(--display);font-weight:900;font-style:italic;font-size:23px;line-height:1.06;text-transform:uppercase;margin-top:8px}
.pv .tabs{display:flex;gap:2px;padding:0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.pv .tab{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 10px;color:var(--soft);font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.pv .tab:first-child{padding-left:0}
.pv .tab.on{color:var(--lime-text)}
.pv .tab.on::after{content:"◆";font-size:7px;line-height:1}
.pv .content{padding:12px 12px 14px;display:grid;gap:10px}
.pv .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pv .dd2{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;padding:0 11px;border:1px solid var(--line-strong);border-radius:7px;background:var(--card);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pv .dd2::after{content:"";flex-shrink:0;width:6px;height:6px;border-right:2px solid var(--lime-text);border-bottom:2px solid var(--lime-text);transform:rotate(45deg);margin-top:-3px}
.pv .mc{border:1px solid var(--card-grid);border-radius:7px;background:var(--card);overflow:hidden}
.pv .mc.live{border-color:var(--lime)}
.pv .mh{display:flex;align-items:stretch;justify-content:space-between;min-height:34px;background:var(--card-h);border-bottom:1px solid var(--card-grid)}
.pv .ml{align-self:center;min-width:0;padding:6px 9px;font-size:9.5px;line-height:1.35;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pv .ml b{display:block;font-weight:800;color:var(--lime-text)}
.pv .hr{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:84px;border-left:1px solid var(--card-grid);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pv .chip{border-radius:4px;padding:2px 6px;font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--lime);color:var(--lime-ink)}
.pv .pr{display:flex;align-items:stretch;min-height:46px}
.pv .pr+.pr{border-top:1px solid var(--card-grid)}
.pv .seed{flex-shrink:0;width:28px;display:grid;place-items:center;border-right:1px solid var(--card-grid);font-size:11px;font-weight:700;color:var(--muted)}
.pv .nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:5px 6px 5px 8px;font-family:var(--names);font-size:13.5px;line-height:17px;font-weight:500}
.pv .nm span{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.pv .pr.w .nm{font-weight:700}
.pv .pr.l .nm{color:var(--loser)}
.pv .fl{flex-shrink:0;width:14px;height:10px;border-radius:2px;background:linear-gradient(#fff 0 33.4%,#1c57a5 33.4% 66.7%,#d52b1e 66.7%);box-shadow:0 0 0 1px var(--flag-ring)}
.pv .pr.l .fl{opacity:.75}
.pv .sc{display:flex;flex-shrink:0;font-family:var(--display);font-weight:800;font-size:15px;color:var(--dim)}
.pv .sc span{width:28px;display:grid;place-items:center;border-left:1px solid var(--card-grid)}
.pv .sc span.up{color:var(--ink)}
.pv .sc span.ns{color:var(--line-strong);font-weight:600}

/* цвета скина */
.tk{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.tk span{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px 4px 5px}
.tk span i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.tk span.bad{color:#b4232a;border-color:#f3c4c6;background:#fff5f5}
details{border-top:1px solid var(--line);margin:2px -12px -12px;padding:0 16px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;height:42px;font-size:13px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);rotate:45deg;translate:0 -2px;transition:rotate .15s}
details[open] summary::after{rotate:225deg;translate:0 2px}
.tok{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
.tok td{padding:5px 0;border-top:1px solid #edf2f3}
.tok td:first-child{color:var(--muted);width:60%;line-height:1.3}
.tok td code{font:11px var(--mono);color:var(--faint)}
.tok td:last-child{text-align:right}
.tok button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font:500 12px var(--mono);padding:2px 6px;border-radius:6px}
.tok button:hover{background:var(--bg)}
.tok button i{width:14px;height:14px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.css{all:unset;cursor:pointer;display:block;text-align:center;font-size:13px;font-weight:600;padding:9px;margin-bottom:14px;border-radius:999px;background:var(--ink);color:#fff}
.css.ok{background:var(--lime);color:var(--lime-ink)}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;transition:.2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;translate:-50% 0}
@media (max-width:720px){.wrap{padding:24px 16px 64px}.bar{margin:18px -16px 0;padding:10px 16px;flex-wrap:wrap;gap:10px}.idx{flex:1 1 100%}.grid{grid-template-columns:minmax(0,1fr)}.sk p.why{min-height:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="logo">PADEL<span class="b">.</span><em>SELECT</em></span><a class="chip" href="brandbook.html">брендинг</a></div>
  <h1>Скины страницы турнира</h1>
  <p class="lead" id="lead"></p>
  <div class="bar" id="bar">
    <div class="seg" id="seg"></div>
    <div class="idx" id="idx"></div>
  </div>
  <div id="groups"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- цвет ---------- */
function lum(hex) { const n = parseInt(hex.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };

const hx = n => n.toString(16).padStart(2, '0');
const mix = (a, b, t) => { const p = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)), x = p(a), y = p(b); return '#' + x.map((v, k) => hx(Math.round(v + (y[k] - v) * t))).join(''); };

/* ---------- скины ---------- */
// Токены — как у public-tournament-mobile.html (--bg, --lime, --loser…). У скина задаются акцент, текст на акценте
// и база: фон для тёмных, цвет текста для светлых; остальное выводится из неё. Скины из прода и прототипа — с готовыми токенами.
const SKINS = [
  /* светлые */
  {id: 'yellow', name: 'Бело-жёлтая', prod: true, acc: '#eeff00', on: '#000000', ink: '#0a0a08', why: 'Кислотный жёлтый с чёрным: Varlion, Т-Банк, «Билайн».'},
  {id: 'teal', name: 'Бирюзовая', acc: '#13c2b0', on: '#00221f', ink: '#0b1a19', why: 'Цвет моря и кортов на курортах: клубы у воды, летние турниры.'},
  {id: 'slate', name: 'Голубая', prod: true, acc: '#8a9dad', on: '#ffffff', ink: '#0f1417', why: 'Спокойный серо-голубой. Белый текст на акценте (LIVE, плашка логотипа) читается плохо — контраст ниже нормы.'},
  {id: 'blue', name: 'Синяя', acc: '#1f5bff', on: '#ffffff', ink: '#0a1226', why: 'Ярко-синий: ВТБ, Head, Babolat. Заметнее и контрастнее голубой.'},
  {id: 'violet', name: 'Фиолетовая', acc: '#7b3cff', on: '#ffffff', ink: '#120d1f', why: 'Wildberries, «МегаФон», фитнес-сети.'},
  {id: 'pink', name: 'Малиновая', acc: '#e0105f', on: '#ffffff', ink: '#1c0a11', why: 'Ozon, «Пари», женские турниры.'},
  {id: 'red', name: 'Красная', prod: true, acc: '#e11b22', on: '#ffffff', why: 'FONBET, Альфа-Банк, МТС. Токены — скин FONBET прототипа страницы турнира.',
   tok: {bg: '#ffffff', stripe: '#f5f7f8', panel: '#ffffff', card: '#ffffff', chip: '#f0f3f4', line: '#e6eaec', lineStrong: '#d5dcde', ink: '#12181b', soft: '#3d4a4f', muted: '#68777d', dim: '#9aa8ad', menu: '#ffffff', cardH: '#f7f9fa', cardGrid: '#e1e6e8', conn: '#c3cdd0', statusBg: '#f0f3f4', statusInk: '#3d4a4f', loser: '#7d8a8f', wm: 'rgba(225,27,34,.10)', flagRing: 'rgba(18,24,27,.18)'}},
  {id: 'mono', name: 'Бело-чёрная', acc: '#111111', on: '#ffffff', ink: '#0a0a0a', why: 'Монохром для спонсоров с чёрно-белым брендом (adidas, Nox): цвет даёт логотип спонсора.'},
  /* тёмные */
  {id: 'green', name: 'Зелёная', dark: true, prod: true, acc: '#8ae81f', on: '#0b1b06', why: 'Фирменная PADEL.SELECT, по умолчанию. Токены — страница турнира без скина.',
   tok: {bg: '#0c1719', stripe: '#101f22', panel: '#0a0e13', card: '#101c1f', chip: '#18262a', line: '#1c2a2d', lineStrong: '#25363a', soft: '#b6c4c6', muted: '#8a9ea0', dim: '#5e7174', menu: '#132225', cardH: '#15262a', cardGrid: '#24363a', conn: '#3d5357', statusBg: '#182428', statusInk: '#cfd9da', loser: '#93a5a7'}},
  {id: 'salad', name: 'Чёрно-салатовая', dark: true, prod: true, acc: '#b8dc1e', on: '#0b0f02', why: 'Чёрный с салатовым: «Светлая сторона». Токены — скин прототипа страницы турнира.',
   tok: {bg: '#0b0b0b', stripe: '#101010', panel: '#161616', card: '#141414', chip: '#1c1c1c', line: '#242424', lineStrong: '#333333', soft: '#b8bfb8', muted: '#a3a8a3', dim: '#666c66', menu: '#171717', cardH: '#1a1a1a', cardGrid: '#2a2a2a', conn: '#474747', statusBg: '#1c1c1c', statusInk: '#d6dbd6', loser: '#9a9f9a'}},
  {id: 'gold', name: 'Чёрно-золотая', dark: true, acc: '#e2b14a', on: '#1f1503', bg: '#0e0d0b', why: 'Финалы, мастерсы, премиальные спонсоры. Тёплый оттенок, не спорит с жёлтым.'},
  {id: 'orange', name: 'Чёрно-оранжевая', dark: true, acc: '#ff6a1a', on: '#1a0800', bg: '#141516', why: 'Графит и оранжевый: Winline, энергия мяча. Самый «спортивный» цвет.'},
  {id: 'navy', name: 'Тёмно-синяя', dark: true, acc: '#3ec5ff', on: '#031a26', bg: '#0a1328', why: 'Ночной синий с голубым: банки, «Газпром», Olimpbet. На ТВ смотрится как эфирная графика.'}
].map(s => {
  const W = '#ffffff', b = s.bg || s.tok?.bg, k = s.ink || s.tok?.ink || '#12181b';  // у скинов с готовыми токенами база берётся из них
  const base = s.dark
    ? {bg: b, stripe: mix(b, W, .025), panel: mix(b, '#000000', .3), card: mix(b, W, .02), chip: mix(b, W, .07), line: mix(b, W, .08), lineStrong: mix(b, W, .13), soft: mix(b, W, .72), muted: mix(b, W, .52), dim: mix(b, W, .33),
       menu: mix(b, W, .05), cardH: mix(b, W, .05), cardGrid: mix(b, W, .12), conn: mix(b, W, .25), statusBg: mix(b, W, .07), statusInk: mix(b, W, .8), loser: mix(b, W, .57)}
    : {bg: W, stripe: mix(W, k, .04), panel: W, card: W, chip: mix(W, k, .06), line: mix(W, k, .1), lineStrong: mix(W, k, .16), ink: k, soft: mix(k, W, .2), muted: mix(k, W, .42), dim: mix(k, W, .6),
       menu: W, cardH: mix(W, k, .03), cardGrid: mix(W, k, .12), conn: mix(W, k, .25), statusBg: mix(W, k, .06), statusInk: mix(k, W, .2), loser: mix(k, W, .5), wm: s.acc + '1a', flagRing: k + '2e'};
  const t = {ink: '#ffffff', wm: 'rgba(255,255,255,.07)', flagRing: 'rgba(255,255,255,.12)', ...base, ...s.tok, acc: s.acc, on: s.on, live: '#e5736b'};
  // акцент текстом (город, активная вкладка, № запуска): на светлом фоне светлые акценты затемняются до контраста 4,5
  let at = s.acc; for (let x = .05; contrast(at, t.bg) < 4.5 && x <= 1; x += .05) at = mix(s.acc, s.dark ? W : '#000000', x);
  return {...s, t: {...t, accText: at}};
});

/* ---------- токены: подпись и переменная страницы турнира ---------- */
const TOKENS = [['acc', 'Акцент: LIVE, плашка логотипа, рамка идущего матча', 'lime'], ['on', 'Текст на акценте', 'lime-ink'], ['accText', 'Акцент текстом: город, вкладка, № запуска, стрелки', 'lime-text'],
  ['bg', 'Фон страницы', 'bg'], ['stripe', 'Полосы героя', 'stripe'], ['panel', 'Шапка с логотипом', 'panel'], ['card', 'Карточка матча', 'card'], ['cardH', 'Шапка карточки', 'card-h'], ['cardGrid', 'Линии карточки', 'card-grid'],
  ['chip', 'Чип, наведение', 'chip'], ['line', 'Линии', 'line'], ['lineStrong', 'Рамки полей', 'line-strong'], ['ink', 'Текст, победитель', 'ink'], ['soft', 'Вкладки, второй текст', 'soft'], ['muted', 'Подписи', 'muted'],
  ['dim', 'Счёт проигравшего', 'dim'], ['loser', 'Проигравший', 'loser'], ['statusBg', 'Статус: фон', 'status-bg'], ['statusInk', 'Статус: текст', 'status-ink'], ['menu', 'Выпадающий список', 'menu'],
  ['conn', 'Линии сетки', 'conn-c'], ['live', 'LIVE в шапке', 'live'], ['wm', 'Город на фоне', 'wm'], ['flagRing', 'Обводка флага', 'flag-ring']];
const cssOf = s => `/* Скин «${s.name}» (${s.dark ? 'тёмный' : 'светлый'}) для public-tournament-mobile.html */\nhtml.sk-${s.id}{\n${TOKENS.map(([k, , v]) => `  --${v}:${s.t[k]};`).join('\n')}\n}`;
const pvVars = s => TOKENS.map(([k, , v]) => `--${v}:${s.t[k]}`).join(';');

/* ---------- логотип и фавиконка в цвете скина ---------- */
const P = 'M0 0H5.8A4.2 4.2 0 0 1 5.8 8.4H3.6V14H0Z M3.6 2.9H5.6A1.3 1.3 0 0 1 5.6 5.5H3.6Z';
const fav = (plate, ink) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g transform="translate(16 16) skewX(-12.5) translate(-16 -16)"><rect x="4" y="2.5" width="24" height="27" rx="1.6" fill="${plate}"/><path transform="translate(7.6 7.3) scale(1.25)" fill-rule="evenodd" fill="${ink}" d="${P}"/></g><circle cx="20.43" cy="22.2" r="2.6" fill="${ink}"/></svg>`);
const logoVars = t => `--logo-ink:${t.ink};--logo-plate:${t.acc};--logo-on:${t.on};--logo-dot:${contrast(t.acc, t.panel) >= 1.8 ? t.acc : t.ink}`;

const SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
const pair = (a, b) => `<span><i class="fl"></i>${a}</span><span><i class="fl"></i>${b}</span>`;
const preview = s => `<div class="pv" style="${pvVars(s)}">
  <div class="tb" style="${logoVars(s.t)}"><span class="logo">PADEL<span class="b">.</span><em>SELECT</em></span><span class="share">${SHARE}</span></div>
  <div class="hero"><div class="wm">НОВОСИБИРСК</div><div class="kick"><span class="status">Live</span>Новосибирск<i>·</i>29–30 августа<i>·</i>ФПР 250</div><div class="ttl">Кубок Сибири</div></div>
  <div class="tabs"><span class="tab on">Расписание</span><span class="tab">Сетка</span><span class="tab">Игроки</span><span class="tab">Регламент</span></div>
  <div class="content">
    <div class="fgrid"><span class="dd2">30 августа</span><span class="dd2">Статус матча</span></div>
    <div class="mc live"><div class="mh"><div class="ml"><b>1-й запуск</b>1/2 финала</div><div class="hr"><span class="chip">Live</span></div></div>
      <div class="pr"><div class="seed">1</div><div class="nm">${pair('Филичев Илья', 'Денисов Иван')}</div><div class="sc"><span class="up">6</span><span class="up">4</span><span class="ns">—</span></div></div>
      <div class="pr"><div class="seed">8</div><div class="nm">${pair('Парыгин Максим', 'Никитин Артём')}</div><div class="sc"><span class="up">3</span><span class="up">2</span><span class="ns">—</span></div></div></div>
    <div class="mc"><div class="mh"><div class="ml"><b>2-й запуск</b>Матч за 3-е место</div><div class="hr">Завершён</div></div>
      <div class="pr w"><div class="seed">6</div><div class="nm">${pair('Петров Максим', 'Кочанов Павел')}</div><div class="sc"><span class="up">6</span><span class="up">6</span><span class="ns">—</span></div></div>
      <div class="pr l"><div class="seed">4</div><div class="nm">${pair('Мироносицкий Алексей', 'Елисеев Даниил')}</div><div class="sc"><span>3</span><span>4</span><span class="ns">—</span></div></div></div>
  </div>
</div>`;
const fmt = x => x.toFixed(1).replace('.', ',');
const card = s => { const t = s.t, c = contrast(t.acc, t.on);
  return `<article class="sk" id="${s.id}" data-dark="${s.dark ? 1 : 0}">
    <div class="sk-h"><b>${s.name}</b><span class="tag">${s.dark ? 'тёмная' : 'светлая'}</span><span class="tag ${s.prod ? '' : 'new'}">${s.prod ? 'в проде' : 'новая'}</span></div>
    <p class="why">${s.why}</p>
    <div><div class="btab"><span><img src="${fav(t.acc, t.on)}" alt=""><em>Кубок Сибири · PADEL.SELECT</em></span></div>${preview(s)}</div>
    <div class="tk"><span style="--c:${t.acc}"><i></i>акцент ${t.acc}</span><span style="--c:${t.bg}"><i></i>фон ${t.bg}</span><span class="${c < 4.5 ? 'bad' : ''}">текст на акценте · ${fmt(c)}</span>${t.accText !== t.acc ? `<span style="--c:${t.accText}"><i></i>акцент текстом ${t.accText}</span>` : ''}</div>
    <details><summary>Все цвета скина</summary>
      <table class="tok">${TOKENS.map(([k, l, v]) => `<tr><td>${l}<br><code>--${v}</code></td><td><button data-copy="${t[k]}" style="--c:${t[k]}"><i></i>${t[k]}</button></td></tr>`).join('')}</table>
      <button class="css" data-css="${s.id}">Скопировать CSS скина</button>
    </details>
  </article>`; };

const light = SKINS.filter(s => !s.dark), dark = SKINS.filter(s => s.dark), fresh = SKINS.filter(s => !s.prod).length;
document.getElementById('lead').innerHTML = `${SKINS.length} цветовых схем страницы турнира: <b>${light.length} светлых</b> и <b>${dark.length} тёмных</b>. ${SKINS.length - fresh} уже есть в проде, ${fresh} новых. Превью — мобильная страница турнира в текущем дизайне: победитель выделен контрастом, акцентом — LIVE, город, активная вкладка, номер запуска и плашка логотипа. Под карточкой — все токены скина и CSS для вставки в страницу турнира.`;
document.getElementById('groups').innerHTML =
  `<section data-g="0"><h2>Светлые<span>${light.length}</span></h2><div class="grid">${light.map(card).join('')}</div></section>` +
  `<section data-g="1"><h2>Тёмные<span>${dark.length}</span></h2><div class="grid">${dark.map(card).join('')}</div></section>`;
document.getElementById('idx').innerHTML = SKINS.map(s => `<a href="#${s.id}" data-dark="${s.dark ? 1 : 0}" style="--a:${s.bg};--b:${s.acc}"><i></i>${s.name}</a>`).join('');

/* ---------- фильтр: все / светлые / тёмные ---------- */
const FILTERS = [['all', 'Все', SKINS.length], ['0', 'Светлые', light.length], ['1', 'Тёмные', dark.length]];
let flt = 'all';
function renderSeg() {
  document.getElementById('seg').innerHTML = FILTERS.map(([k, l, n]) => `<button class="${k === flt ? 'on' : ''}" data-f="${k}">${l}<i>${n}</i></button>`).join('');
  document.querySelectorAll('section[data-g]').forEach(g => g.hidden = flt !== 'all' && g.dataset.g !== flt);
  document.querySelectorAll('#idx a').forEach(a => a.hidden = flt !== 'all' && a.dataset.dark !== flt);
}
document.getElementById('seg').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { flt = b.dataset.f; renderSeg(); } });
renderSeg();

/* ---------- копирование ---------- */
const toast = t => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1400); };
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) navigator.clipboard.writeText(c.dataset.copy).then(() => toast('Скопировано: ' + c.dataset.copy), () => toast('Не удалось скопировать'));
  const b = e.target.closest('[data-css]');
  if (b) navigator.clipboard.writeText(cssOf(SKINS.find(s => s.id === b.dataset.css))).then(() => {
    b.classList.add('ok'); b.textContent = 'Скопировано'; setTimeout(() => { b.classList.remove('ok'); b.textContent = 'Скопировать CSS скина'; }, 1400);
  }, () => toast('Не удалось скопировать'));
});

/* ---------- линия под панелью, когда она прилипла ---------- */
const bar = document.getElementById('bar');
new IntersectionObserver(([en]) => bar.classList.toggle('stuck', en.intersectionRatio < 1), {threshold: 1, rootMargin: '-1px 0px 0px 0px'}).observe(bar);
</script>
</body>
</html>
